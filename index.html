      state.remarksDoneOpen = true;
      render();
    };
    var remarksDoneOverlay = document.getElementById('remarksDoneOverlay');
    if (remarksDoneOverlay){
      remarksDoneOverlay.onclick = function(e){ if (e.target.id === 'remarksDoneOverlay'){ state.remarksDoneOpen = false; render(); } };
    }
    var closeRemarksDoneBtn = document.getElementById('closeRemarksDoneBtn');
    if (closeRemarksDoneBtn) closeRemarksDoneBtn.onclick = function(){ state.remarksDoneOpen = false; render(); };

    var activityBtn = document.getElementById('activityBtn');
    if (activityBtn) activityBtn.onclick = function(){
      state.recentRemarksOpen = true;
      render();
    };
    var recentRemarksOverlay = document.getElementById('recentRemarksOverlay');
    if (recentRemarksOverlay){
      recentRemarksOverlay.onclick = function(e){ if (e.target.id === 'recentRemarksOverlay'){ state.recentRemarksOpen = false; render(); } };
    }
    var closeRecentRemarksBtn = document.getElementById('closeRecentRemarksBtn');
    if (closeRecentRemarksBtn) closeRecentRemarksBtn.onclick = function(){ state.recentRemarksOpen = false; render(); };
    var clearActivityBtn = document.getElementById('clearActivityBtn');
    if (clearActivityBtn) clearActivityBtn.onclick = function(){
      if (!state.remarksLog.length) return;
      if (!window.confirm('Clear all activity history on this device? This only clears this local list — it does not undo anything on the Google Sheet.')) return;
      state.remarksLog = [];
      saveRemarksLog();
      render();
    };
    document.querySelectorAll('.activity-undo-btn').forEach(function(btn){
      btn.onclick = function(e){
        // Undo lives inside a .breakdown-row that also has a data-jump-row
        // click handler (tapping the row opens that customer) -- without
        // this, tapping Undo would ALSO jump/navigate away right as the
        // undo kicks off.
        e.stopPropagation();
        var id = btn.getAttribute('data-undo-id');
        if (id) undoRemarksLogEntry(id);
      };
    });

    document.querySelectorAll('[data-jump-row]').forEach(function(el){
      el.onclick = function(){
        var rowNum = parseInt(el.getAttribute('data-jump-row'), 10);
        var jumpBranch = el.getAttribute('data-jump-branch');
        state.remarksDoneOpen = false;
        state.recentRemarksOpen = false;
        state.notifPanelOpen = false;
        state.errorDetailNotif = null;
        if (jumpBranch && jumpBranch !== state.activeBranch){
          state.activeBranch = jumpBranch;
        }
        openCustomerRow(rowNum);
      };
    });

    function openCustomerRow(rowNum){
      var b = currentBranch();
      state.selected = b.rows.find(function(x){ return x._row === rowNum; });
      state.remarksMsg = '';
      state.fieldMsg = {};
      state.micError = '';
      state.openPicker = '';
      // Register a "screen" in browser history so the phone's back
      // button / back gesture closes this detail view first, instead of
      // exiting the whole app (which happens when there's no history
      // entry to go back to).
      history.pushState({ detailOpen: true }, '', '#customer-' + rowNum);
      render();
    }

    document.querySelectorAll('tbody tr').forEach(function(el){
      el.onclick = function(){
        openCustomerRow(parseInt(el.getAttribute('data-row'), 10));
      };
    });
    var overlay = document.getElementById('overlay');
    if (overlay){
      overlay.onclick = function(e){ if (e.target.id === 'overlay'){ closeDetail(); } };
    }
    var closeBtn = document.getElementById('closeDrawer');
    if (closeBtn) closeBtn.onclick = function(){ closeDetail(); };
    var saveBtn = document.getElementById('saveBtn');
    if (saveBtn) saveBtn.onclick = handleSaveRemarks;
    var alreadyPaidBtn = document.getElementById('alreadyPaidBtn');
    if (alreadyPaidBtn) alreadyPaidBtn.onclick = handleAlreadyPaid;
    var alreadyPaidDateInput = document.getElementById('alreadyPaidDateInput');
    if (alreadyPaidDateInput) alreadyPaidDateInput.onchange = function(e){
      state.alreadyPaidDate = e.target.value || todayISODate();
    };
    var auditDateInput = document.getElementById('auditDateInput');
    var auditDateCalendarBtn = document.getElementById('auditDateCalendarBtn');
    if (auditDateInput) auditDateInput.onchange = function(e){
      var v = e.target.value || '';
      // When month/day are already filled and you retype the year one
      // digit at a time, the browser treats every partial digit as a
      // "complete" date (year 0001, then 0019, then 0192...) and fires
      // this change event on each one. Committing immediately used to
      // re-render the page mid-keystroke, which destroyed and rebuilt
      // this very input and corrupted whatever the user was typing into
      // garbage like 1902. Debounce instead: wait for typing to pause,
      // then only commit if the settled value is a real, plausible date
      // -- ignore the transitional single/double/triple-digit years
      // that show up along the way.
      clearTimeout(auditDateInput._commitTimer);
      if (v === ''){ handleAuditDateChangeAllCustomers(''); return; }
      auditDateInput._commitTimer = setTimeout(function(){
        var m = /^(\d{4})-\d{2}-\d{2}$/.exec(v);
        var yr = m ? Number(m[1]) : NaN;
        if (!m || yr < 2000 || yr > 2100) return;
        handleAuditDateChangeAllCustomers(v);
      }, 600);
    };
    if (auditDateCalendarBtn) auditDateCalendarBtn.onclick = function(){
      if (!auditDateInput) return;
      // showPicker() opens the native calendar directly; older browsers
      // that don't support it fall back to just focusing the field (which
      // still lets the user type/pick via the browser's own icon).
      if (typeof auditDateInput.showPicker === 'function'){
        try{ auditDateInput.showPicker(); }
        catch(err){ auditDateInput.focus(); }
      } else {
        auditDateInput.focus();
      }
    };
    var remarksInputEl = document.getElementById('remarksInput');
    if (remarksInputEl){
      remarksInputEl.oninput = function(e){
        var b = currentBranch();
        if (b && state.selected) saveDraft(b.branch, state.selected._row, e.target.value);
        scheduleRemarksAutoSave();
      };
    }
    document.querySelectorAll('[data-toggle-field]').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var f = btn.getAttribute('data-toggle-field');
        state.openPicker = (state.openPicker === f) ? '' : f;
        renderKeepScroll();
      };
    });
    document.querySelectorAll('.pill-option').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var f = btn.getAttribute('data-field');
        var v = btn.getAttribute('data-value');
        state.openPicker = '';
        handleFieldChange(f, v);
      };
    });
    var micBtn = document.getElementById('micBtn');
    if (micBtn) micBtn.onclick = handleMicToggle;
  }

  function renderKeepFocus(){
    var caret = document.getElementById('searchInput') ? document.getElementById('searchInput').selectionStart : null;
    render();
    var s = document.getElementById('searchInput');
    if (s){
      s.focus();
      if (caret !== null) s.setSelectionRange(caret, caret);
    }
  }

  // Re-renders without visually jumping back to the top. render() rebuilds
  // the whole screen from scratch, which normally resets scroll position to
  // 0 -- jarring when it happens mid-save while looking at a customer's
  // remarks. This captures the outer page scroll, the detail drawer's own
  // scroll, and the remarks textarea's cursor position beforehand, then
  // restores all three right after.
  function renderKeepScroll(){
    var pageY = window.scrollY;
    // The drawer's actual scrollable element is .drawer itself (it has
    // overflow-y:auto) — NOT .drawer-body, which has no overflow set and
    // never scrolls on its own. Capturing .drawer-body here was a no-op,
    // which is why the dropdown/remarks drawer used to snap back to the
    // top on every click instead of staying where you were scrolled to.
    var drawerEl = document.querySelector('.drawer');
    var drawerY = drawerEl ? drawerEl.scrollTop : null;
    var ta = document.getElementById('remarksInput');
    var hadFocus = ta && document.activeElement === ta;
    var caretPos = hadFocus ? ta.selectionStart : null;

    render();

    window.scrollTo(0, pageY);
    var newDrawerEl = document.querySelector('.drawer');
    if (newDrawerEl && drawerY !== null){ newDrawerEl.scrollTop = drawerY; }
    var newTa = document.getElementById('remarksInput');
    if (newTa && hadFocus){
      newTa.focus();
      if (caretPos !== null) newTa.setSelectionRange(caretPos, caretPos);
    }
  }

  (async function init(){
    document.addEventListener('click', function(){
      if (state.openPicker){ state.openPicker = ''; renderKeepScroll(); }
    });
    loadNotifications();
    loadRemarksLog();
    await loadUrl();
    await loadReportsUrl();
    await loadSheetViewUrl();
    await loadPendingQueue();
    await loadReportsPendingQueue();
    // Show whatever was on-device immediately (with pending edits applied),
    // so reopening the app after being backgrounded/closed/offline never
    // starts from a blank screen while the network request is in flight.
    if (loadCachedBranches()){
      if (!state.branches.some(function(b){ return b.branch === state.activeBranch; })){
        state.activeBranch = state.branches[0].branch;
      }
      applyPendingToBranches();
      render();
    }
    if (state.url){
      await fetchData();
      flushQueue();
      flushReportsQueue();
    } else {
      render();
    }
    startClock();
  })();

  // Expose these to the AI Auditor script block below, which lives in its
  // own separate <script> tag (its own closure/scope) and therefore can't
  // see anything declared inside THIS closure otherwise. Without this,
  // clicking "AI Auditor" throws "state is not defined" immediately and
  // silently -- the panel never opens, no matter how many times it's
  // clicked. `state` is exposed by reference (never reassigned wholesale
  // anywhere in this file, only mutated via state.xxx = ...), so this
  // stays in sync automatically as the dashboard runs.
  window.__dash = {
    state: state,
    fetchWithTimeout: fetchWithTimeout,
    currentBranch: currentBranch,
    esc: esc,
    saveDraft: saveDraft,
    loadReportForm: loadReportForm,
    saveReportForm: saveReportForm,
    micSupported: micSupported,
    SpeechRecognitionCtor: SpeechRecognitionCtor,
    // Exposed so the logo/stamp toggle script (its own separate <script>
    // block/closure further down) can actually flip real app connectivity
    // instead of only changing the stamp icon, and so other script blocks
    // (e.g. the AI Auditor Assistant below) check the SAME effective
    // offline state as the rest of the app instead of re-deriving their
    // own from navigator.onLine directly.
    isOffline: isOffline,
    setManualOffline: setManualOffline,
    // Exposed so the AI Auditor's branch analysis can prioritize/summarize
    // by the SAME severity the dashboard rows are already colored by,
    // instead of re-guessing its own notion of "problematic" from scratch.
    getField: getField,
    rowSeverity: rowSeverity
  };
})();
</script>
<script>
  // ---- Logo online/offline toggle button ----
  // Tapping the logo in the top bar toggles a connection-status indicator:
  // green smoke puffs briefly when switching to "online", red smoke lingers
  // while "offline". It also follows the browser's real connectivity
  // automatically.
  //
  // FIX: this used to be purely cosmetic -- tapping it only changed the
  // stamp's icon/title, it never actually told the app anything. So the
  // dashboard kept saving straight to the sheet (no offline queueing, no
  // "You're offline" banner) even after someone tapped the logo to mark it
  // offline. Tapping the logo now also calls window.__dash.setManualOffline()
  // (see the main dashboard script above), which is the actual switch the
  // rest of the app checks via isOffline() -- so marking it offline here
  // really does make saves queue on-device instead of hitting the sheet,
  // and the header shows the real "You're offline" banner, until it's
  // tapped back to online (or the browser's real connectivity changes).
  //
  // IMPORTANT: applyVisual() below (icon/title only) is kept deliberately
  // separate from the app-state sync. It runs on every re-render (via the
  // MutationObserver, since the app wholesale-replaces #app's DOM and wipes
  // the data-conn attribute) -- if THAT also re-called setManualOffline()
  // every time, each call's own render() would retrigger the observer
  // again, forever. App state is only ever synced on an actual status
  // change: the initial load, a real user tap, or a genuine browser
  // online/offline event.
  (function () {
    var STATUS_KEY = 'logoConnStatus';

    function getInitialStatus() {
      try {
        var saved = window.sessionStorage.getItem(STATUS_KEY);
        if (saved === 'online' || saved === 'offline') return saved;
      } catch (e) {}
      return (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'offline' : 'online';
    }

    var currentStatus = getInitialStatus();

    // Purely cosmetic: updates the stamp's icon/title/animation and
    // persists the choice for this tab session. Never touches app state,
    // so it's safe to call as often as needed (e.g. after every re-render).
    function applyVisual(status, animate) {
      currentStatus = status;
      try { window.sessionStorage.setItem(STATUS_KEY, status); } catch (e) {}
      var stamps = document.querySelectorAll('.brand .stamp');
      stamps.forEach(function (el) {
        el.setAttribute('data-conn', status);
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-pressed', status === 'online' ? 'true' : 'false');
        el.setAttribute('title', status === 'online'
          ? 'Online — tap to mark offline'
          : 'Offline — tap to mark online');
        if (animate && status === 'online') {
          el.classList.remove('puff-green');
          void el.offsetWidth; // restart animation
          el.classList.add('puff-green');
          setTimeout(function () { el.classList.remove('puff-green'); }, 1200);
        }
      });
    }

    // The real switch: tells the dashboard to actually behave offline (or
    // stop forcing it). Safe to skip if the main script hasn't finished
    // setting up window.__dash yet for some reason.
    function syncAppState(status) {
      if (window.__dash && typeof window.__dash.setManualOffline === 'function') {
        window.__dash.setManualOffline(status === 'offline');
      }
    }

    // User-driven or load-time status change: updates the icon AND the
    // actual app behavior together.
    function applyStatus(status, animate) {
      applyVisual(status, animate);
      syncAppState(status);
    }

    function toggleStatus() {
      applyStatus(currentStatus === 'online' ? 'offline' : 'online', true);
    }

    document.addEventListener('click', function (e) {
      var stamp = e.target && e.target.closest ? e.target.closest('.brand .stamp') : null;
      if (!stamp) return;
      e.preventDefault();
      toggleStatus();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var stamp = e.target && e.target.closest ? e.target.closest('.brand .stamp') : null;
      if (!stamp) return;
      e.preventDefault();
      toggleStatus();
    });

    // Keep the icon honest with the browser's real connectivity too. The
    // main dashboard script has its own 'online'/'offline' listeners that
    // already update the real app state (and clear any manual override on
    // a genuine reconnect) -- this only needs to keep the stamp's look in
    // sync, not re-drive app state a second time.
    window.addEventListener('online', function () { applyVisual('online', true); });
    window.addEventListener('offline', function () { applyVisual('offline', false); });

    // The app re-renders #app wholesale on every state change, which wipes
    // out the data-conn attribute we set on .stamp. Re-apply (visual only)
    // whenever the DOM underneath #app changes.
    var appEl = document.getElementById('app');
    if (appEl && typeof MutationObserver !== 'undefined') {
      var mo = new MutationObserver(function () { applyVisual(currentStatus, false); });
      mo.observe(appEl, { childList: true, subtree: true });
    }

    // Apply the icon immediately, and honor a manually-forced-offline
    // status that survived from earlier in this tab session (sessionStorage)
    // by actually re-engaging offline mode on load -- not just redrawing
    // the icon as offline while the app itself saves online underneath it.
    applyStatus(currentStatus, false);
  })();
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function (err) {

      });

<script>
(function(){
