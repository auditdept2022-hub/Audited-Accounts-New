  function initialsFor(name){
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  // Tracks which row the drawer's entrance animation has already played
  // for. Every re-render rebuilds the .drawer/.overlay DOM nodes from
  // scratch (innerHTML replace), which used to retrigger their CSS
  // fade/slide-in animation EVERY time — on every dropdown click, every
  // remarks keystroke-triggered save, etc. That replaying animation was
  // the main visible "flicker/jump". Now the animation only plays the
  // first time a given customer's drawer opens; subsequent re-renders
  // while it's still open for the same row render it with animation
  // already-settled (no replay).
  var drawerAnimatedForRow = null;

  function drawerHtml(){
    if (!state.selected){ drawerAnimatedForRow = null; return '<div class="overlay" id="overlay"></div>'; }
    var r = state.selected;
    var isFreshOpen = drawerAnimatedForRow !== r._row;
    drawerAnimatedForRow = r._row;
    var b = currentBranch();
    var headers = (b ? b.headers : Object.keys(r)).slice();
    // 'Date of Audit' IS shown here, but only as a plain read-only field
    // (via the generic loop + fmtValue's date formatting below) -- it's
    // never editable from inside a customer's drawer. The only place it
    // can actually be set is the branch-wide picker in the topbar (see
    // topbarAuditDateHtml()), since one audit visit covers every
    // customer on the branch on the same date.
    var skip = {'Customer Name':1, 'Auditor Remarks':1, 'Old Remarks':1, 'Customer Status':1, 'Unit status':1, 'Payment mode':1, '_row':1};

    // Some sheets/branches spell this header slightly differently
    // ("Total Due this Month" vs "Total Due This Month"). Make sure the
    // field always shows up even if its exact casing isn't in b.headers.
    var hasDueThisMonth = headers.some(function(h){
      var hNorm = String(h).toLowerCase().replace(/\s+/g, ' ').trim();
      return TOTAL_DUE_ALIASES.some(function(alias){ return alias.toLowerCase() === hNorm; });
    });
    if (!hasDueThisMonth && getTotalDue(r) !== '') headers.push('Total Due this Month');

    var redFieldsNorm = {'outstanding balance':1};
    TOTAL_DUE_ALIASES.forEach(function(alias){ redFieldsNorm[alias.toLowerCase()] = 1; });
    function isRed(h){ return !!redFieldsNorm[String(h).toLowerCase().replace(/\s+/g, ' ').trim()]; }

    var fields = headers.filter(function(h){ return !skip[h] && h !== ''; }).map(function(h){
      return '<div class="field"><div class="k">' + esc(h) + '</div><div class="v' + (isRed(h) ? ' amount-red' : '') + '">' + esc(fmtValue(h, getField(r, h))) + '</div></div>';
    }).join('');

    // Quick-remark button: one tap drops a standard "already made a
    // payment" line into Auditor Remarks and saves it immediately (which
    // also triggers the sheet's green name-highlight, same as any other
    // remarks save). The auditor can still freely type/edit remarks
    // before or after tapping this — it only pre-fills a line, it never
    // locks the textarea. Shown as "already marked" (checked look) once
    // that line is present in the saved remarks, so it's obvious at a
    // glance without having to open the remarks box.
    var alreadyPaidMarked = ALREADY_PAID_MARKER_RE.test(String(r['Auditor Remarks'] || ''));
    var alreadyPaidIcon = alreadyPaidMarked
      ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
      : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="8"/></svg>';
    // Little calendar so the auditor can back-date the remark to when the
    // customer actually paid, instead of it always saying "today". Only
    // shown before marking -- once marked, the date is already baked into
    // the saved remark line, so this hides to avoid implying it's still
    // editable (undo first, then re-mark with a different date if needed).
    var alreadyPaidDateHtml = alreadyPaidMarked ? '' :
      '<div class="already-paid-date-row">' +
        '<label for="alreadyPaidDateInput" class="already-paid-date-label">Date paid</label>' +
        '<input type="date" class="already-paid-date-input" id="alreadyPaidDateInput" value="' +
          esc(state.alreadyPaidDate || todayISODate()) + '"' + (state.savingRemarks ? ' disabled' : '') + '>' +
      '</div>';

    var alreadyPaidBtnHtml =
      '<div class="field field-action">' +
        alreadyPaidDateHtml +
        '<button type="button" class="already-paid-btn' + (alreadyPaidMarked ? ' is-marked' : '') + '" id="alreadyPaidBtn"' + (state.savingRemarks ? ' disabled' : '') + '>' +
          '<span class="icon-badge">' + alreadyPaidIcon + '</span>' +
          '<span class="apb-text">' +
            (state.savingRemarks ? 'Saving...' : (alreadyPaidMarked ? 'Not made a payment' : 'Already made a payment')) +
            (alreadyPaidMarked && !state.savingRemarks ? '<span class="apb-hint">Tap to undo</span>' : '') +
          '</span>' +
        '</button>' +
      '</div>';

    // Date of Audit now lives as a global, branch-wide control in the
    // topbar (see topbarAuditDateHtml() and its usage in render()) instead
    // of inside each customer's drawer -- an audit visit covers a whole
    // branch on one date, so it isn't really a per-customer field. It's
    // still skipped from the generic fields loop above so it doesn't show
    // up as a stray read-only row here.

    var remarksSaveStatus = '';
    if (state.remarksMsg === 'ok') remarksSaveStatus = '<span class="save-status show"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Saved to Google Sheet</span>';
    else if (state.remarksMsg === 'queued') remarksSaveStatus = '<span class="save-status show queued"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><polyline points="12 6 12 12 16 14"/></svg>Saved on this device — will sync when back online</span>';
    else if (state.remarksMsg && state.remarksMsg.indexOf('err:') === 0) remarksSaveStatus = '<span class="save-status show err">Could not save: ' + esc(state.remarksMsg.slice(4)) + '</span>';

    var pendingBanner = rowHasPending(b.branch, r._row)
      ? '<div class="pending-banner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><polyline points="12 6 12 12 16 14"/></svg>This record has changes saved on this device that haven\'t synced to the Google Sheet yet.</div>'
      : '';

    var savedRemarks = r['Auditor Remarks'] || '';
    var draftRemarks = loadDraft(b.branch, r._row);
    var hasDraft = draftRemarks !== null && draftRemarks !== savedRemarks;
    var remarksBoxValue = hasDraft ? draftRemarks : savedRemarks;
    var draftStatus = hasDraft
      ? '<div class="draft-status"><span class="dot"></span>Draft — not saved yet. Your text stays here even if you go offline or close this.</div>'
      : '';

    return (
      '<div class="overlay open' + (isFreshOpen ? '' : ' no-anim') + '" id="overlay">' +
        '<div class="drawer' + (isFreshOpen ? '' : ' no-anim') + '">' +
          '<div class="drawer-head">' +
            '<button class="close" id="closeDrawer">✕</button>' +
            '<div class="head-text">' +
              '<h2>' + esc(r['Customer Name']) + '</h2>' +
              '<div class="sub">' + esc(b ? b.branch : '') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="drawer-perf"></div>' +
          '<div class="drawer-body">' +
            pendingBanner +
            '<div class="section-label">Account details</div>' +
            '<div class="field-grid">' + fields + alreadyPaidBtnHtml + '</div>' +
            dropdownFieldsHtml(r, b) +
            '<div class="section-label">Old remarks</div>' +
            '<div class="old-remarks">' + esc(r['Old Remarks'] || 'None.') + '</div>' +
            '<div class="section-label">Auditor remarks</div>' +
            '<div class="remarks-input-wrap">' +
              micButtonHtml() +
              '<textarea id="remarksInput" placeholder="Type remarks, or tap the mic to dictate...">' + esc(remarksBoxValue) + '</textarea>' +
            '</div>' +
            micToolbarHtml() +
            '<div class="mic-interim">' + (state.micInterim ? 'Hearing: "' + esc(state.micInterim) + '"' : '') + '</div>' +
            draftStatus +
            '<div class="save-row">' +
              '<button class="btn gold" id="saveBtn"' + (state.savingRemarks ? ' disabled' : '') + '>' + (state.savingRemarks ? 'Saving...' : 'Save remarks') + '</button>' +
              remarksSaveStatus +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // List of customers on the active branch that already have Auditor

    else if (state.addBranchMsg && state.addBranchMsg.indexOf('err:') === 0) msg = '<div class="errbox">' + esc(state.addBranchMsg.slice(4)) + '</div>';

              '<select id="addBranchSourceSelect">' + sourceOptions + '</select>'
            : '') +

            msg +

              '<button class="btn ghost" id="cancelAddBranchBtn">Cancel</button>' +

  // "Delete branch" -- lets someone remove a tab from the Google Sheet
  // straight from the branch filter dropdown, instead of having to open
  // the spreadsheet and delete it by hand. Always asks for confirmation
  // first, and refuses (both here and on the backend) to delete the last
  // remaining branch, since the dashboard needs at least one to show.
  function openDeleteBranchModal(branchName){
    state.menuOpen = false;
    state.branchDropdownOpen = false;
    state.deleteBranchTarget = branchName;
    state.deleteBranchMsg = '';
    state.deleteBranchOpen = true;
    render();
  }

  function deleteBranchModalHtml(){
    if (!state.deleteBranchOpen) return '';

    var target = state.branches.find(function(b){ return b.branch === state.deleteBranchTarget; });
    var rowCount = target ? target.rows.length : 0;
    var isLast = state.branches.length <= 1;

    var msg = '';
    if (state.deleteBranchMsg === 'ok') msg = '<div class="okbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Branch deleted.</div>';
    else if (state.deleteBranchMsg && state.deleteBranchMsg.indexOf('err:') === 0) msg = '<div class="errbox">' + esc(state.deleteBranchMsg.slice(4)) + '</div>';

    return (
      '<div class="settings-overlay open" id="deleteBranchOverlay">' +
        '<div class="settings-modal" style="max-width:420px;">' +
          '<div class="sm-head"><div><h3>Delete branch</h3><p>Removes the tab from your Google Sheet — this can\'t be undone.</p></div></div>' +
          '<div class="sm-body">' +
            (isLast ?
              '<div class="errbox">"' + esc(state.deleteBranchTarget) + '" is the only branch left — add another branch before deleting this one.</div>'
            :
              '<div class="sm-hint">You\'re about to permanently delete <strong>' + esc(state.deleteBranchTarget) + '</strong>' +
              (rowCount ? ', including its ' + rowCount + ' customer row' + (rowCount === 1 ? '' : 's') + '.' : ', which has no customer rows yet.') +
              ' This removes the tab from the Google Sheet itself, not just from this dashboard.</div>'
            ) +
            msg +
            '<div class="sm-actions">' +
              (!isLast ? '<button class="btn danger" id="confirmDeleteBranchBtn"' + (state.deleteBranchSaving ? ' disabled' : '') + '>' + (state.deleteBranchSaving ? 'Deleting...' : 'Delete branch') + '</button>' : '') +
              '<button class="btn ghost" id="cancelDeleteBranchBtn">' + (isLast ? 'Close' : 'Cancel') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  async function doDeleteBranch(){
    var branchName = state.deleteBranchTarget;
    if (!branchName) return;
    state.deleteBranchSaving = true; state.deleteBranchMsg = ''; render();
    try{
      var res = await fetchWithTimeout(state.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'deleteBranch', branchName: branchName })
      }, 30000);
      var data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not delete the branch.');
      state.deleteBranchMsg = 'ok';
      pushNotification('success', 'Branch deleted — ' + branchName, 'The "' + branchName + '" tab was removed from your Google Sheet.', { status: 'success' });
      await fetchData();
      // If the branch we just deleted was the active one, fall back to
      // whatever branch is now first in the list so the dashboard isn't
      // left pointing at a branch that no longer exists.
      if (state.activeBranch === branchName){
        state.activeBranch = (state.branches[0] && state.branches[0].branch) || '';
      }
      state.deleteBranchSaving = false;
      render();
      setTimeout(function(){ state.deleteBranchOpen = false; state.deleteBranchTarget = ''; state.deleteBranchMsg = ''; render(); }, 900);
      return;
    }catch(e){
      state.deleteBranchMsg = 'err:' + e.message;
      pushNotification('error', 'Could not delete branch — ' + branchName, e.message, {
        status: 'failed',
        cause: 'The dashboard reached the Google Sheet backend but the branch could not be deleted — usually because it was already removed, it\u2019s the last remaining branch, or the request timed out.',
        solution: 'Tap Sync now to refresh the branch list, or check your connection and try again.'
      });
    }
    state.deleteBranchSaving = false;
    render();
  }

  // ==== Draft Report ("Draft Report" button in the settings menu) ====
  // A branch audit checklist, modeled after the printed Motorlandia
  // template. The section headers (Branch, Cashier Transactions,

  // wording -- the auditor can fix a sentence, delete one that doesn't
  // apply, or use "+ Add item" to add a brand-new line. Findings/Concerns
  // works the same way (editable lines, add/remove). Saved to
  // localStorage per branch (key "report::<branch>"), latest only --
  // opening a branch's report again overwrites whatever was there
  // before (no history is kept, by design).
  var REPORT_SECTIONS = [
    { title: 'Branch', items: [
      { id: '1', text: 'The Motorlandia signage is visible.' },
      { id: '2', text: 'The branch is well-maintained and clean.' },
      { id: '3', text: 'All personnel were present on the day of the audit.' },
      { id: '4', text: 'All personnel were in proper uniform with ID.' },
      { id: '5', text: 'The branch roll-up and padlocks are in good condition.' }
    ] },
    { title: 'Cashier Transactions', items: [
      { id: '6', text: 'Deposit slips were attached and matched with the report.' },
      { id: '7', text: 'The change fund and cash on hand was reconciled based on the actual count.' },

  // ---- Plain-text summaries for the Google Sheet ----
  // The reports backend stores the whole form as a JSON blob so the app
  // can reload it on another device (see pullReportsFormFromCloud), but a
  // raw JSON blob is unreadable if someone opens the actual Google Sheet.
  // These build a clean, PDF-like plain-text rendition instead -- section
  // headings, numbered items, no braces/quotes/commas -- which gets sent
  // alongside the JSON and written into its own "Report" column so the
  // sheet itself is easy to read at a glance.
  function buildReportPlainText(f){
    var lines = ['Date: ' + (f.date || ''), ''];
    REPORT_SECTIONS.forEach(function(sec){
      var items = ((f.checklist && f.checklist[sec.title]) || []).filter(function(t){ return t && String(t).trim() !== ''; });
      if (!items.length) return;
      lines.push(sec.title.toUpperCase());
      items.forEach(function(t, i){ lines.push((i + 1) + '. ' + t); });
      lines.push('');
    });
    var findings = (f.findings || []).filter(function(t){ return t && String(t).trim() !== ''; });
    if (findings.length){
      lines.push('FINDINGS / CONCERNS');
      findings.forEach(function(t, i){ lines.push((i + 1) + '. ' + t); });
      lines.push('');
    }
    lines.push('Prepared by (Auditor): ' + (f.preparedBy || ''));
    lines.push('Received by: ' + (f.receivedBy || ''));
    return lines.join('\n');
  }

  function buildAuditSheetPlainText(f){
    var lines = ['Date: ' + (f.date || ''), ''];
    AUDIT_SHEET_SECTIONS.forEach(function(sec){
      if (sec.type === 'fields'){
        var filled = sec.fields.filter(function(fld){ return String((f.cash && f.cash[fld.id]) || '').trim() !== ''; });
        if (!filled.length) return;
        lines.push(sec.title.toUpperCase());
        filled.forEach(function(fld){ lines.push(fld.label + ': ' + f.cash[fld.id]); });
        lines.push('');
      } else if (sec.type === 'yesno'){
        lines.push(sec.title.toUpperCase());
        sec.items.forEach(function(text, li){
          var val = ((f.yesno && f.yesno[sec.id]) || [])[li] || '';
          var ans = val === 'yes' ? 'Yes' : (val === 'no' ? 'No' : 'Not yet answered');
          lines.push((li + 1) + '. ' + text + ' - ' + ans);
        });
        lines.push('');
      } else {
        lines.push(sec.title.toUpperCase());
        sec.items.forEach(function(label, li){
          var val = ((f.remarksList && f.remarksList[sec.id]) || [])[li] || '';
          lines.push((li + 1) + '. ' + label + (val ? ' - ' + val : ''));
        });
        lines.push('');
      }
    });
    var remarks = (f.remarks || []).filter(function(t){ return t && String(t).trim() !== ''; });
    if (remarks.length){
      lines.push('REMARKS (AUDIT FINDINGS OR CONCERNS)');
      remarks.forEach(function(t, i){ lines.push((i + 1) + '. ' + t); });
      lines.push('');
    }
    lines.push('Prepared by (Auditor): ' + (f.preparedBy || ''));
    lines.push('Received by: ' + (f.receivedBy || ''));
    return lines.join('\n');
  }

  function reportKey(branch){ return 'report::' + branch; }

  function defaultReportForm(branch){
    var checklist = {};
    REPORT_SECTIONS.forEach(function(sec){
      checklist[sec.title] = sec.items.map(function(it){ return it.text; });
    });
    return {
      branch: branch,
      date: todayISODate(),
      checklist: checklist, // sectionTitle -> array of editable sentence strings
      findings: new Array(REPORT_FINDINGS_LINES).fill(''),
      preparedBy: '',
      receivedBy: ''
    };
  }

  function loadReportForm(branch){
    var v = lsGet(reportKey(branch));
    var f = null;
    if (v){
      try{ f = JSON.parse(v); }catch(e){ f = null; }
    }
    if (!f) return defaultReportForm(branch);

    f.branch = branch;

    if (!f.checklist){
      // Migrate from an older saved shape (checkbox "items" + separate
      // "extra" free-text rows) into the new single editable-sentence
      // list per section: start from the fixed template wording, then
      // tack on any extra rows that were already added under the old
      // format so nothing the user typed gets lost.
      f.checklist = {};
      REPORT_SECTIONS.forEach(function(sec){
        var lines = sec.items.map(function(it){ return it.text; });
        if (f.extra && f.extra[sec.title]){
          f.extra[sec.title].forEach(function(v){
            if (v && String(v).trim() !== '') lines.push(v);
          });
        }
        f.checklist[sec.title] = lines;
      });
      delete f.items;
      delete f.extra;
    } else {
      // Make sure every section currently in the template exists on this
      // saved form too (e.g. the template gained a new section after
      // this report was first saved).
      REPORT_SECTIONS.forEach(function(sec){
        if (!f.checklist[sec.title]){
          f.checklist[sec.title] = sec.items.map(function(it){ return it.text; });
        }
      });
    }

    if (!f.findings || !f.findings.length) f.findings = new Array(REPORT_FINDINGS_LINES).fill('');
    if (!f.date) f.date = todayISODate();
    return f;
  }

  function saveReportForm(){
    if (!state.reportForm || !state.reportForm.branch) return;
    lsSet(reportKey(state.reportForm.branch), JSON.stringify(state.reportForm));
    // Best-effort, non-blocking: also push to the reports backend (if one
    // is configured in Connection settings) so this report is available
    // from any device, not just this one. Never awaited -- a slow or
    // unreachable backend must never make saving feel laggy.
    pushDraftReportToCloud(state.reportForm.branch, state.reportForm);
  }

  // ==== Draft Report: AI grammar / wording check ("polishReport") ====
  // Sends every non-empty line currently in the Draft Report (checklist
  // sections + Findings) to the Apps Script backend, which forwards it to
  // Gemini with instructions to fix grammar/spelling/phrasing and improve
  // wording while preserving every fact. Only lines the AI actually
  // changed are shown back to the auditor as suggestions -- nothing is
  // ever applied automatically, per how this dashboard's Draft Report is
  // meant to be reviewed line-by-line before it goes out.

  function collectReportLinesForPolish(f){
    var lines = [];
    REPORT_SECTIONS.forEach(function(sec, si){
      (f.checklist[sec.title] || []).forEach(function(text, li){
        if (text && String(text).trim() !== ''){
          lines.push({ id: 'sec:' + si + ':' + li, section: sec.title, text: text });
        }
      });
    });
    f.findings.forEach(function(text, idx){
      if (text && String(text).trim() !== ''){
        lines.push({ id: 'finding:' + idx, section: 'Findings / Concerns', text: text });
      }
    });
    return lines;
  }

  async function runReportPolish(){
    var f = state.reportForm;
    if (!f) return;
    var lines = collectReportLinesForPolish(f);
    if (!lines.length){
      state.reportPolishError = 'Nothing to check yet -- the draft report is empty.';
      render();
      return;
    }

    state.reportPolishBusy = true;
    state.reportPolishError = '';
    state.reportPolishResult = null;
    render();

    if (isOffline()){
      state.reportPolishError = 'You appear to be offline -- checking needs an internet connection.';
      state.reportPolishBusy = false;
      render();
      return;
    }

    try{
      var res = await fetchWithTimeout(state.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'ai',
          requestType: 'polishReport',
          context: { lines: lines.map(function(l){ return { id: l.id, text: l.text }; }) },
          prompt: ''
        })
      }, 30000);
      var data;
      try{ data = await res.json(); }
      catch(parseErr){ throw new Error('The AI backend returned an unreadable response.'); }
      if (!data.success) throw new Error(data.error || 'AI request failed.');
      if (data.raw || !data.result || !data.result.lines){
        throw new Error('The AI did not return results in the expected format. Try again.');
      }

      var byId = {};
      lines.forEach(function(l){ byId[l.id] = l; });
      var changed = [];
      data.result.lines.forEach(function(item){
        var orig = byId[item.id];
        if (!orig) return; // AI returned an id we didn't send -- ignore
        var newText = String(item.text || '').trim();
        if (newText && newText !== orig.text){
          changed.push({ id: orig.id, section: orig.section, oldText: orig.text, newText: newText });
        }
      });

      state.reportPolishResult = changed; // empty array = "checked, nothing to improve"
    }catch(e){
      state.reportPolishError = isOffline()
        ? 'You appear to be offline -- checking needs an internet connection.'
        : (e.message || 'Something went wrong talking to the AI service.');
    }
    state.reportPolishBusy = false;
    render();
  }

  // ==== Draft Report: "AI Report Review" ("reviewReport") ====
  // Unlike runReportPolish() above (which checks grammar/wording one line
  // at a time), this sends the WHOLE draft report -- every checklist
  // section together with Findings/Concerns -- and asks the AI to read it
  // as a document: is anything blank that shouldn't be, does a checklist
  // line describing a problem have no matching entry in Findings, what's
  // an auditor typically expected to note that's missing here, and an
  // overall risk read. This is what actually looks across the whole
  // report instead of judging each section in isolation.
  function collectReportSectionsForReview(f){
    var sections = REPORT_SECTIONS.map(function(sec){
      return {
        title: sec.title,
        items: (f.checklist[sec.title] || []).filter(function(t){ return t && String(t).trim() !== ''; })
      };
    });
    var findings = (f.findings || []).filter(function(t){ return t && String(t).trim() !== ''; });
    return { branch: f.branch, date: f.date || '', sections: sections, findings: findings };
  }

  async function runReportReview(){
    var f = state.reportForm;
    if (!f) return;
    var payload = collectReportSectionsForReview(f);
    var hasAnyContent = payload.sections.some(function(s){ return s.items.length; }) || payload.findings.length;
    if (!hasAnyContent){
      state.reportReviewError = 'Nothing to review yet -- the draft report is empty.';
      render();
      return;
    }

    state.reportReviewBusy = true;
    state.reportReviewError = '';
    state.reportReviewResult = null;
    render();

    if (isOffline()){
      state.reportReviewError = 'You appear to be offline -- reviewing needs an internet connection.';
      state.reportReviewBusy = false;
      render();
      return;
    }

    try{
      var res = await fetchWithTimeout(state.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'ai', requestType: 'reviewReport', context: payload, prompt: '' })
      }, 30000);
      var data;
      try{ data = await res.json(); }
      catch(parseErr){ throw new Error('The AI backend returned an unreadable response.'); }
      if (!data.success) throw new Error(data.error || 'AI request failed.');
      if (data.raw || !data.result){
        throw new Error('The AI did not return results in the expected format. Try again.');
      }
      state.reportReviewResult = data.result;
    }catch(e){
      state.reportReviewError = isOffline()
        ? 'You appear to be offline -- reviewing needs an internet connection.'
        : (e.message || 'Something went wrong talking to the AI service.');
    }
    state.reportReviewBusy = false;
    render();
  }

  // Writes one accepted suggestion back into the actual Draft Report data
  // (by its "sec:<si>:<li>" or "finding:<idx>" id) and removes it from the
  // pending suggestions list.
  function applyReportPolishLine(id){
    var f = state.reportForm;
    if (!f || !state.reportPolishResult) return;
    var item = state.reportPolishResult.find(function(x){ return x.id === id; });
    if (!item) return;

    var parts = id.split(':');
    if (parts[0] === 'sec'){
      var si = Number(parts[1]), li = Number(parts[2]);
      var sec = REPORT_SECTIONS[si];
      if (sec && f.checklist[sec.title] && f.checklist[sec.title][li] !== undefined){
        f.checklist[sec.title][li] = item.newText;
      }
    } else if (parts[0] === 'finding'){
      var idx = Number(parts[1]);
      if (f.findings[idx] !== undefined) f.findings[idx] = item.newText;
    }
    saveReportForm();
    state.reportPolishResult = state.reportPolishResult.filter(function(x){ return x.id !== id; });
    render();
  }

  function discardReportPolishLine(id){
    if (!state.reportPolishResult) return;
    state.reportPolishResult = state.reportPolishResult.filter(function(x){ return x.id !== id; });
    render();
  }

  function applyAllReportPolish(){
    if (!state.reportPolishResult) return;
    state.reportPolishResult.slice().forEach(function(item){ applyReportPolishLine(item.id); });
  }

  function discardAllReportPolish(){
    state.reportPolishResult = null;
    render();
  }

  // ==== Audit Sheet: form storage (same "latest only, per branch"
  // pattern as the Draft Report's reportKey/loadReportForm/saveReportForm
  // above, just under its own localStorage namespace and shape). ====
  function auditSheetKey(branch){ return 'auditsheet::' + branch; }

  function defaultAuditSheetForm(branch){
    var cash = {}, yesno = {}, remarksList = {};
    AUDIT_SHEET_SECTIONS.forEach(function(sec){
      if (sec.type === 'fields'){
        sec.fields.forEach(function(fld){ cash[fld.id] = ''; });
      } else if (sec.type === 'yesno'){
        yesno[sec.id] = sec.items.map(function(){ return ''; });
      } else if (sec.type === 'remarksList'){
        remarksList[sec.id] = sec.items.map(function(){ return ''; });
      }
    });
    return {
      branch: branch,
      date: todayISODate(),
      cash: cash,
      yesno: yesno, // sectionId -> array of '' | 'yes' | 'no', parallel to sec.items
      remarksList: remarksList, // sectionId -> array of free-text remarks, parallel to sec.items
      remarks: new Array(AUDIT_SHEET_REMARKS_LINES).fill(''),
      preparedBy: '',
      receivedBy: ''
    };
  }

  function loadAuditSheetForm(branch){
    var v = lsGet(auditSheetKey(branch));
    var f = null;
    if (v){
      try{ f = JSON.parse(v); }catch(e){ f = null; }
    }
    if (!f) return defaultAuditSheetForm(branch);

    f.branch = branch;
    if (!f.cash) f.cash = {};
    if (!f.yesno) f.yesno = {};
    if (!f.remarksList) f.remarksList = {};

    // Make sure every section/item currently in the template exists on
    // this saved form too (e.g. the template gained a section, or an
    // item count changed, after this sheet was first saved).
    AUDIT_SHEET_SECTIONS.forEach(function(sec){
      if (sec.type === 'fields'){
        sec.fields.forEach(function(fld){
          if (f.cash[fld.id] === undefined) f.cash[fld.id] = '';
        });
      } else if (sec.type === 'yesno'){
        if (!f.yesno[sec.id] || f.yesno[sec.id].length !== sec.items.length){
          f.yesno[sec.id] = sec.items.map(function(){ return ''; });
        }
      } else if (sec.type === 'remarksList'){
        if (!f.remarksList[sec.id] || f.remarksList[sec.id].length !== sec.items.length){
          f.remarksList[sec.id] = sec.items.map(function(){ return ''; });
        }
      }
    });

    if (!f.remarks || !f.remarks.length) f.remarks = new Array(AUDIT_SHEET_REMARKS_LINES).fill('');
    if (!f.date) f.date = todayISODate();
    if (f.preparedBy === undefined) f.preparedBy = '';
    if (f.receivedBy === undefined) f.receivedBy = '';
    return f;
  }

  function buildAuditSheetPdfBlob(f){
    return new Promise(function(resolve, reject){
      if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
        reject(new Error('PDF library did not load -- check your internet connection and try again.'));
        return;
      }
      var holder = document.createElement('div');
      holder.style.position = 'fixed';
      holder.style.left = '-10000px';
      holder.style.top = '0';
      holder.style.width = '794px';
      holder.innerHTML =
        '<img style="width:100%;display:block;" src="' + REPORT_LETTERHEAD_TOP + '" />' +
        '<div style="padding:16px 24px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#1a1a1a;">' +
          auditSheetDocBodyHtml(f, f.branch) +
        '</div>' +
        '<img style="width:100%;display:block;" src="' + REPORT_LETTERHEAD_BOTTOM + '" />';
      document.body.appendChild(holder);
      var cleanup = function(){ if (holder.parentNode) holder.parentNode.removeChild(holder); };
      html2canvas(holder, { scale: 2, useCORS: true }).then(function(canvas){
        cleanup();
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF('p', 'mm', 'a4');
        var pageWidth = 210, pageHeight = 297;
        var imgWidth = pageWidth;
        var imgHeight = canvas.height * imgWidth / canvas.width;
        var heightLeft = imgHeight;
        var position = 0;
        var imgData = canvas.toDataURL('image/jpeg', 0.92);
        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        while (heightLeft > 0){
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
        resolve(pdf.output('blob'));
      }).catch(function(err){ cleanup(); reject(err); });
    });
  }

      else if (state.reportCloudMsg && state.reportCloudMsg.indexOf('err:') === 0) msg += '<div class="errbox" style="margin-top:8px;">' + esc(state.reportCloudMsg.slice(4)) + '</div>';

      var polishHtml = '';
      if (state.reportPolishError){
        polishHtml += '<div class="errbox" style="margin-top:10px;">' + esc(state.reportPolishError) + '</div>';
      }
      if (state.reportPolishResult){
        if (!state.reportPolishResult.length){
          polishHtml += '<div class="okbox" style="margin-top:10px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Checked -- no grammar or wording issues found.</div>';
        } else {
          polishHtml +=
            '<div class="report-section ai-polish-section" style="border:1px solid rgba(23,179,163,0.35);border-radius:10px;padding:12px;margin-top:12px;">' +
              '<h4>\u2726 AI Suggestions (' + state.reportPolishResult.length + ')</h4>' +
              state.reportPolishResult.map(function(item){
                return '<div class="ai-polish-item" style="background:rgba(23,179,163,0.06);border-radius:8px;padding:10px;margin-bottom:8px;">' +
                  '<div style="font-size:12px;font-weight:600;opacity:.65;margin-bottom:4px;">' + esc(item.section) + '</div>' +
                  '<div style="font-size:13px;text-decoration:line-through;opacity:.55;margin-bottom:4px;">' + esc(item.oldText) + '</div>' +
                  '<div style="font-size:13px;margin-bottom:8px;">' + esc(item.newText) + '</div>' +
                  '<div class="sm-actions" style="margin:0;">' +
                    '<button type="button" class="btn gold" data-polish-apply="' + esc(item.id) + '">\u2713 Apply</button>' +
                    '<button type="button" class="btn ghost" data-polish-discard="' + esc(item.id) + '">Discard</button>' +
                  '</div>' +
                '</div>';
              }).join('') +
              '<div class="sm-actions" style="margin-top:4px;">' +
                '<button type="button" class="btn gold" id="reportPolishApplyAllBtn">Apply All</button>' +
                '<button type="button" class="btn ghost" id="reportPolishDiscardAllBtn">Discard All</button>' +
              '</div>' +
            '</div>';
        }
      }

      // "AI Report Review" -- a separate, holistic result panel from the
      // line-by-line grammar suggestions above. Read-only (nothing here
      // gets "Applied" into the report the way polish suggestions do,
      // since this is feedback about the report as a whole, not
      // line-level rewrites) -- it's meant to be read, then acted on by
      // the auditor filling in Findings/Concerns or a blank section.
      var reviewHtml = '';
      if (state.reportReviewError){
        reviewHtml += '<div class="errbox" style="margin-top:10px;">' + esc(state.reportReviewError) + '</div>';
      }
      if (state.reportReviewResult){
        var rr = state.reportReviewResult;
        var riskColor = rr.riskLevel === 'HIGH' ? '#c0392b' : (rr.riskLevel === 'MEDIUM' ? '#b8860b' : '#2f6b4f');
        var listBlock = function(title, arr){
          if (!arr || !arr.length) return '';
          return '<div style="margin-top:10px;"><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;opacity:.65;margin-bottom:4px;">' + esc(title) + '</div>' +
            '<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.5;">' +
              arr.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') +
            '</ul></div>';
        };
        reviewHtml +=
          '<div class="report-section ai-review-section" style="border:1px solid rgba(184,134,11,0.35);border-radius:10px;padding:12px;margin-top:12px;">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<h4 style="margin:0;">\u2726 AI Report Review</h4>' +
              (rr.riskLevel ? '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#fff;background:' + riskColor + ';padding:2px 8px;border-radius:999px;">' + esc(rr.riskLevel) + ' risk</span>' : '') +
            '</div>' +
            (rr.overallAssessment ? '<div style="font-size:13px;line-height:1.5;margin-top:8px;">' + esc(rr.overallAssessment) + '</div>' : '') +
            (rr.completeness ? '<div style="font-size:13px;line-height:1.5;margin-top:8px;"><b>Completeness:</b> ' + esc(rr.completeness) + '</div>' : '') +
            listBlock('Checklist items with no matching finding', rr.inconsistencies) +
            listBlock('Missing / worth documenting', rr.missingItems) +
            '<div class="sm-actions" style="margin-top:10px;">' +
              '<button type="button" class="btn ghost" id="reportReviewDismissBtn">Dismiss</button>' +
            '</div>' +
          '</div>';
      }

      body =
        '<div class="report-fields-row">' +
          '<div><label>Date</label><input type="date" id="reportDateInput" value="' + esc(f.date) + '" /></div>' +
        '</div>' +
        '<div class="sm-actions" style="margin:10px 0 0;flex-wrap:wrap;">' +
          '<button type="button" class="btn ghost" id="reportPolishBtn"' + (state.reportPolishBusy ? ' disabled' : '') + '>\u2726 ' + (state.reportPolishBusy ? 'Checking...' : 'Check Grammar & Wording') + '</button>' +
          '<button type="button" class="btn ghost" id="reportReviewBtn"' + (state.reportReviewBusy ? ' disabled' : '') + '>\u2726 ' + (state.reportReviewBusy ? 'Reviewing...' : 'AI Report Review') + '</button>' +
        '</div>' +
        polishHtml +
        reviewHtml +
        '<div style="height:1px;background:rgba(23,179,163,0.28);margin:14px 0;"></div>' +
        sectionsHtml +
        '<div class="report-section"><h4>Findings / Concerns</h4>' + findingsHtml + '</div>' +
        '<div class="report-fields-row">' +
          '<div><label>Prepared by (Auditor)</label><input type="text" id="reportPreparedByInput" value="' + esc(f.preparedBy) + '" placeholder="Auditor name" /></div>' +
          '<div><label>Received by</label><input type="text" id="reportReceivedByInput" value="' + esc(f.receivedBy) + '" placeholder="Name" /></div>' +
        '</div>' +
        msg;
    }

    return (
      '<div class="settings-overlay open" id="reportOverlay">' +
        '<div class="settings-modal report-modal">' +
          '<div class="sm-head"><div><h3>Draft Report</h3></div>' +
            '<button type="button" class="sm-close" id="closeReportBtnX" title="Close" aria-label="Close">\u00d7</button>' +
          '</div>' +
          '<div class="sm-body">' +
            '<label>Branch</label>' +
            '<select id="reportBranchSelect">' + branchOptions + '</select>' +
            '<div style="height:14px;"></div>' +
            body +
            '<div class="sm-actions">' +
              (f ? '<button class="btn gold" id="reportSaveCloudBtn"' + (state.reportCloudBusy ? ' disabled' : '') + '>\u2601 ' + (state.reportCloudBusy ? 'Saving...' : 'Save to Google Sheets') + '</button>' : '') +
              (f ? '<button class="btn ghost" id="reportPreviewBtn">\uD83D\uDC41 Preview</button>' : '') +
              (f ? '<button class="btn ghost" id="reportPrintBtn"' + (state.reportDownloadPdfBusy ? ' disabled' : '') + '>\uD83D\uDDB6 ' + (state.reportDownloadPdfBusy ? 'Preparing PDF...' : 'Download PDF') + '</button>' : '') +
              (f ? '<button class="btn ghost" id="reportDownloadWordBtn">\u2b73 Download Word</button>' : '') +
              '<button class="btn ghost" id="closeReportBtn">Close</button>' +
            '</div>' +
            (f ? (
              '<div class="section-label" style="margin-top:14px;">Share</div>' +
              '<div class="sm-actions">' +
                '<button class="btn ghost" id="reportShareMessengerBtn"' + (state.reportShareBusy ? ' disabled' : '') + '>\uD83D\uDCAC ' + (state.reportShareBusy === 'messenger' ? 'Preparing...' : 'Share via Messenger') + '</button>' +
                '<button class="btn ghost" id="reportSharePdfBtn"' + (state.reportShareBusy ? ' disabled' : '') + '>\uD83D\uDDB6 ' + (state.reportShareBusy === 'pdf' ? 'Preparing...' : 'Share as PDF') + '</button>' +
                '<button class="btn ghost" id="reportShareWordBtn"' + (state.reportShareBusy ? ' disabled' : '') + '>\u2b73 Share as Docs</button>' +
              '</div>'
            ) : '') +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // Builds the shared checklist body used by BOTH the print view and the
  // Word export, so the two outputs never drift apart. Does NOT include
  // the letterhead itself -- each caller (printDraftReport /
  // downloadReportAsWord) wraps this with its own header/footer banners,
  // since Word needs those as real header/footer parts (repeating on
  // every page) while the print view just places them as images around
  // the content.
  function reportDocBodyHtml(f, branchName){
    var sectionsHtml = REPORT_SECTIONS.map(function(sec){
      var lines = (f.checklist && f.checklist[sec.title]) || [];
      var itemsHtml = lines
        .filter(function(t){ return t && String(t).trim() !== ''; })
        .map(function(t, i){ return '<div style="margin:4px 0;">' + (i + 1) + '. ' + esc(t) + '</div>'; })
        .join('');
      return '<div style="margin-top:14px;"><div style="font-weight:bold;font-style:italic;">' + esc(sec.title) + '</div>' + itemsHtml + '</div>';
    }).join('');

    var findingsHtml = f.findings.map(function(val, idx){
      return '<div style="margin:4px 0;">' + (idx + 1) + '. ' + (val ? esc(val) : '') + '</div>';
    }).join('');

    return (
      '<div style="font-weight:bold;">BRANCH : ' + esc(branchName) + '</div>' +
      '<div style="font-weight:bold;margin-bottom:8px;">DATE : ' + esc(f.date) + '</div>' +
      sectionsHtml +
      '<div style="margin-top:14px;"><div style="font-weight:bold;font-style:italic;">Findings / Concerns</div>' + findingsHtml + '</div>' +
      '<div style="margin-top:36px;display:flex;justify-content:space-between;">' +
        '<div>Prepared by:<br/><br/><strong>' + esc(f.preparedBy || '') + '</strong><br/>Auditor</div>' +
        '<div>Received by:<br/><br/><strong>' + esc(f.receivedBy || '') + '</strong></div>' +
      '</div>'
    );
  }

  // Builds the HTML used for BOTH the on-screen Preview and the
  // Print/Download-PDF flow, so what the auditor previews is exactly
  // what gets printed. The letterhead banners are placed inside a
  // <thead>/<tfoot> of a full-page <table> -- this is the standard
  // browser trick that makes a header/footer genuinely REPEAT on every
  // printed page (unlike plain <img> tags floating before/after the
  // content, which only ever show once no matter how long the report
  // gets, and previously caused the header to be fine on page 1 but
  // missing -- or the footer to land in the middle of the page --
  // once Findings/Concerns grew past one page).
  function buildReportPrintHtml(f){
    return (
      '<!DOCTYPE html><html><head><meta charset="utf-8" />' +
      '<title>Draft Report - ' + esc(f.branch) + '</title>' +
      '<style>' +
        '*{ box-sizing:border-box; }' +
        'html,body{ margin:0; padding:0; }' +
        'body{ font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#1a1a1a; }' +
        'table.report-page{ width:100%; border-collapse:collapse; table-layout:fixed; }' +
        'table.report-page > thead{ display:table-header-group; }' +
        'table.report-page > tfoot{ display:table-footer-group; }' +
        '.letterhead-top, .letterhead-bottom{ width:100%; display:block; }' +
        '.letterhead-cell{ padding:0; }' +
        '.report-page-body{ padding:16px 18mm 8px; }' +
        '@page{ margin:0; size:auto; }' +
        '@media print{ .report-page-body{ padding:16px 18mm 8px; } }' +
      '</style>' +
      '</head><body>' +
        '<table class="report-page"><thead><tr><td class="letterhead-cell">' +
          '<img class="letterhead-top" src="' + REPORT_LETTERHEAD_TOP + '" alt="" />' +
        '</td></tr></thead>' +
        '<tfoot><tr><td class="letterhead-cell">' +
          '<img class="letterhead-bottom" src="' + REPORT_LETTERHEAD_BOTTOM + '" alt="" />' +
        '</td></tr></tfoot>' +
        '<tbody><tr><td>' +
          '<div class="report-page-body">' + reportDocBodyHtml(f, f.branch) + '</div>' +
        '</td></tr></tbody></table>' +
      '</body></html>'
    );
  }

  // "Download PDF" -- opens the same print-ready HTML used by Preview in
  // a new tab and triggers the browser's print dialog, where the auditor
  // picks "Save as PDF". This is deliberately a separate code path from
  // "Download Word" below: PDF always uses buildReportPrintHtml (image
  // letterhead + browser print), Word always uses buildReportWordHtml
  // (real mso header/footer) -- the two outputs are no longer produced
  // by the same function with minor tweaks, so a fix to one can't
  // accidentally break the other.
  // "Download PDF" -- builds a REAL PDF file (via buildReportPdfBlob,
  // same html2canvas + jsPDF pipeline already used by "Share as PDF")
  // and saves it straight to the auditor's downloads, with no extra
  // dialog in between. This used to open a print-ready tab and fire
  // window.print(), which just opened the browser's print dialog --
  // the auditor still had to manually pick "Save as PDF" themselves,
  // which didn't match what the "Download PDF" label promised. That
  // print-based flow is still available separately as "Print" if a
  // physical copy is ever needed.
  function printDraftReport(){
    if (!state.reportForm) return;
    var f = state.reportForm;
    state.reportDownloadPdfBusy = true; render();
    buildReportPdfBlob(f).then(function(blob){
      state.reportDownloadPdfBusy = false; render();
      downloadBlob(blob, 'Draft Report - ' + f.branch + '.pdf');
    }).catch(function(err){
      state.reportDownloadPdfBusy = false; render();
      pushNotification('error', 'Could not create the PDF', err.message || 'Something went wrong building the PDF.', { status: 'failed' });
    });
  }

  // Builds the .doc export with a REAL, repeating Word header/footer,
  // using Word's own mso-element:header / mso-element:footer markup
  // (referenced from an @page section rule via mso-header / mso-footer).
  // This is different from the PDF path on purpose: a plain <img> placed
  // in the body only ever appears once, but content registered as an
  // actual header/footer through this markup repeats on every page when
  // opened in Microsoft Word, matching the printed template exactly.
  // (LibreOffice/Google Docs render the first page correctly too; they
  // just don't replay the mso repeat-on-every-page behavior, which is a
  // limitation of those apps reading a Word-flavoured file, not of this
  // markup.)
  function buildReportWordHtml(f){
    return (
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8" />' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->' +
      '<style>' +
        '@page Section1{ size:8.5in 11.0in; margin:1.05in 0.6in 1.05in 0.6in; mso-header-margin:.4in; mso-footer-margin:.35in; mso-header:h1; mso-footer:f1; }' +
        'div.Section1{ page:Section1; }' +
        'body{ font-family:Calibri,Arial,sans-serif; font-size:12pt; margin:0; }' +
        '.letterhead-top, .letterhead-bottom{ width:100%; }' +
        'p.MsoHeader, p.MsoFooter{ margin:0; }' +
      '</style>' +
      '</head><body>' +
        // Registered header: repeats at the top of every page in Word.
        '<div style="mso-element:header;" id="h1">' +
          '<p class="MsoHeader"><img class="letterhead-top" src="' + REPORT_LETTERHEAD_TOP + '" /></p>' +
        '</div>' +
        // Registered footer: repeats at the bottom of every page in Word.
        '<div style="mso-element:footer;" id="f1">' +
          '<p class="MsoFooter"><img class="letterhead-bottom" src="' + REPORT_LETTERHEAD_BOTTOM + '" /></p>' +
        '</div>' +
        '<div class="Section1">' + reportDocBodyHtml(f, f.branch) + '</div>' +
      '</body></html>'
    );
  }

  function downloadReportAsWord(){
    if (!state.reportForm) return;
    var f = state.reportForm;
    var html = buildReportWordHtml(f);
    var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Draft Report - ' + f.branch + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // ==== Share (Messenger / PDF / Docs) ====
  // Browsers don't let a webpage hand a file straight to one named app
  // (Messenger has no web link that accepts an attached file) -- the
  // one real cross-app mechanism is the native Web Share API, which
  // opens the OS's own share sheet with the file already attached, and
  // the auditor picks Messenger (or Drive, Gmail, Bluetooth, etc.) from
  // there themselves. Where that API or file-sharing isn't supported
  // (desktop browsers, mostly), this falls back to just downloading the
  // file and telling the auditor to attach it manually.
  function shareOrDownloadFile(blob, filename, mimeType, title){
    var file;
    try{ file = new File([blob], filename, { type: mimeType }); }catch(e){ file = null; }
    if (file && typeof navigator !== 'undefined' && navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: title || filename }).catch(function(err){
        // AbortError just means the auditor closed the share sheet --
        // not a real failure, so don't fall back to a download in that
        // case (that would feel like the button "did something extra").
        if (err && err.name === 'AbortError') return;
        downloadBlob(blob, filename);
        pushNotification('error', 'Could not open the share sheet', 'The file was downloaded instead -- attach it manually from your downloads.', { status: 'failed' });
      });
      return;
    }
    downloadBlob(blob, filename);
    pushNotification('offline', 'Direct sharing isn\u2019t available on this browser', filename + ' was downloaded instead -- attach it manually in Messenger (or wherever you want to send it).', { status: 'resolved' });
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // Builds a real PDF Blob (not just a print dialog) so it can be
  // attached directly to a share-sheet action -- renders the same
  // report body used everywhere else onto an offscreen canvas via
  // html2canvas, then lays that image into a jsPDF document, splitting
  // it across as many pages as the content needs. The letterhead banner
  // only appears once at the top and bottom of this file (it isn't
  // repeated per page the way the true print/"Download PDF" output is)
  // -- this is meant as a quick, shareable copy, not the authoritative
  // printed record.
  function buildReportPdfBlob(f){
    return new Promise(function(resolve, reject){
      if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
        reject(new Error('PDF library did not load -- check your internet connection and try again.'));
        return;
      }
      var holder = document.createElement('div');
      holder.style.position = 'fixed';
      holder.style.left = '-10000px';
      holder.style.top = '0';
      holder.style.width = '794px'; // ~A4 at 96dpi
      holder.innerHTML =
        '<img style="width:100%;display:block;" src="' + REPORT_LETTERHEAD_TOP + '" />' +
        '<div style="padding:16px 24px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#1a1a1a;">' +
          reportDocBodyHtml(f, f.branch) +
        '</div>' +
        '<img style="width:100%;display:block;" src="' + REPORT_LETTERHEAD_BOTTOM + '" />';
      document.body.appendChild(holder);
      var cleanup = function(){ if (holder.parentNode) holder.parentNode.removeChild(holder); };
      html2canvas(holder, { scale: 2, useCORS: true }).then(function(canvas){
        cleanup();
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF('p', 'mm', 'a4');
        var pageWidth = 210, pageHeight = 297;
        var imgWidth = pageWidth;
        var imgHeight = canvas.height * imgWidth / canvas.width;
        var heightLeft = imgHeight;
        var position = 0;
        var imgData = canvas.toDataURL('image/jpeg', 0.92);
        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        while (heightLeft > 0){
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
        resolve(pdf.output('blob'));
      }).catch(function(err){ cleanup(); reject(err); });
    });
  }

  function shareReportAsPdf(){
    if (!state.reportForm) return;
    var f = state.reportForm;
    state.reportShareBusy = 'pdf'; render();
    buildReportPdfBlob(f).then(function(blob){
      state.reportShareBusy = ''; render();
      shareOrDownloadFile(blob, 'Draft Report - ' + f.branch + '.pdf', 'application/pdf', 'Draft Report - ' + f.branch);
    }).catch(function(err){
      state.reportShareBusy = ''; render();
      pushNotification('error', 'Could not create the PDF', err.message || 'Something went wrong building the PDF.', { status: 'failed' });
    });
  }

  function shareReportAsWord(){
    if (!state.reportForm) return;
    var f = state.reportForm;
    var html = buildReportWordHtml(f);
    var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    shareOrDownloadFile(blob, 'Draft Report - ' + f.branch + '.doc', 'application/msword', 'Draft Report - ' + f.branch);
  }

  // "Share via Messenger" -- Messenger's own web link (fb-messenger://
  // share) only accepts a URL, not an attached file, so there's no way
  // to deep-link straight into Messenger with this report already
  // attached. The PDF copy is the most universally-openable format, so
  // this builds that same PDF and hands it to the native share sheet,
  // where Messenger shows up as one of the apps to pick -- functionally
  // the same result, just one extra tap.
  function shareReportViaMessenger(){
    if (!state.reportForm) return;
    var f = state.reportForm;
    state.reportShareBusy = 'messenger'; render();
    buildReportPdfBlob(f).then(function(blob){
      state.reportShareBusy = ''; render();
      shareOrDownloadFile(blob, 'Draft Report - ' + f.branch + '.pdf', 'application/pdf', 'Draft Report - ' + f.branch);
    }).catch(function(err){
      state.reportShareBusy = ''; render();
      pushNotification('error', 'Could not create the PDF to share', err.message || 'Something went wrong building the PDF.', { status: 'failed' });
    });
  }

  // ---- Preview ----
  // Shows the exact PDF/print output (letterhead banners included)
  // inside the app, scaled to fit the screen, so the auditor can check
  // the header/footer BEFORE downloading anything. Uses an <iframe>
  // with the same HTML that "Download PDF" prints, so what's previewed
  // is guaranteed to match what gets downloaded.
  function openReportPreview(){
    if (!state.reportForm) return;
    state.reportPreviewOpen = true;
    openOverlay('reportPreviewOpen');
    render();
    var frame = document.getElementById('reportPreviewFrame');
    if (frame) frame.srcdoc = buildReportPrintHtml(state.reportForm);
  }

  function reportPreviewModalHtml(){
    if (!state.reportPreviewOpen) return '';
    return (
      '<div class="settings-overlay open" id="reportPreviewOverlay">' +
        '<div class="report-preview-modal">' +
          '<div class="report-preview-head">' +
            '<span>Preview \u2014 this is exactly what Download PDF / Download Word will produce</span>' +
            '<button class="btn ghost" id="closeReportPreviewBtn">Close</button>' +
          '</div>' +
          '<div class="report-preview-body">' +
            '<iframe id="reportPreviewFrame" class="report-preview-frame" title="Draft Report preview"></iframe>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  async function doCreateBranch(){
    var name = (state.addBranchName || '').trim();
    if (!name){ state.addBranchMsg = 'err:Please enter a branch name.'; render(); return; }
    if (/[\[\]\*\?\/\\:]/.test(name)){ state.addBranchMsg = 'err:Branch name cannot contain any of: [ ] * ? / \\ :'; render(); return; }
    if (state.branches.some(function(b){ return b.branch.toLowerCase() === name.toLowerCase(); })){
      state.addBranchMsg = 'err:A branch named "' + name + '" already exists.';
      render();
      return;
    }
    state.addBranchSaving = true; state.addBranchMsg = ''; render();
    try{
      var body = { action: 'createBranch', branchName: name };
      if (state.addBranchMode === 'duplicate' && state.addBranchSource) body.templateBranch = state.addBranchSource;
      var res = await fetchWithTimeout(state.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }, 30000);
      var data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not create the branch.');
      state.addBranchMsg = 'ok';
      pushNotification('success', 'Branch created — ' + name, 'A new tab named "' + name + '" was added to your Google Sheet.', { status: 'success' });
      await fetchData();
      state.activeBranch = name;
      state.addBranchSaving = false;
      render();
      setTimeout(function(){ state.addBranchOpen = false; state.addBranchName = ''; state.addBranchMsg=''; render(); }, 900);
      return;
    }catch(e){
      state.addBranchMsg = 'err:' + e.message;
      pushNotification('error', 'Could not create branch — ' + name, e.message, {
        status: 'failed',
        cause: 'The dashboard reached the Google Sheet backend but the branch could not be created — usually because the name is already in use, contains characters Google Sheets doesn\u2019t allow in a tab name, or the request timed out.',
        solution: 'Try a different name, or check your connection and tap Create branch again.'
      });
    }
    state.addBranchSaving = false;
    render();
  }

  function bindEvents(){
    var branchToggle = document.getElementById('branchDropdownToggle');
    if (branchToggle){
      branchToggle.onclick = function(e){
        e.stopPropagation();
        state.branchDropdownOpen = !state.branchDropdownOpen;
        if (state.branchDropdownOpen){ state.notifPanelOpen = false; state.menuOpen = false; }
        render();
      };
    }
    document.querySelectorAll('.branch-item-select').forEach(function(item){
      item.onclick = function(e){
        e.stopPropagation();
        state.activeBranch = item.getAttribute('data-branch');
        state.search = '';
        state.statusFilter = '';
        state.branchDropdownOpen = false;
        render();
      };
    });
    document.querySelectorAll('.branch-item-delete').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        openDeleteBranchModal(btn.getAttribute('data-branch'));
      };
    });
    var branchDropdownAddBtn = document.getElementById('branchDropdownAddBtn');
    if (branchDropdownAddBtn){
      branchDropdownAddBtn.onclick = function(e){
        e.stopPropagation();
        state.branchDropdownOpen = false;
        openAddBranchModal();
      };
    }
    if (state.branchDropdownOpen){
      // close the branch dropdown on any click outside it
      setTimeout(function(){
        document.addEventListener('click', function closeBranchDropdown(e){
          var wrap = document.getElementById('branchDropdown');
          if (wrap && !wrap.contains(e.target)){
            state.branchDropdownOpen = false;
            render();
          }
          document.removeEventListener('click', closeBranchDropdown);
        }, { once: true });
      }, 0);
    }
    var statusToggle = document.getElementById('statusDropdownToggle');
    if (statusToggle){
      statusToggle.onclick = function(e){
        e.stopPropagation();
        state.statusDropdownOpen = !state.statusDropdownOpen;
        render();
      };
    }
    document.querySelectorAll('.status-item-select').forEach(function(item){
      item.onclick = function(e){
        e.stopPropagation();
        state.statusFilter = item.getAttribute('data-status');
        state.statusDropdownOpen = false;
        render();
      };
    });
    if (state.statusDropdownOpen){
      // close the status dropdown on any click outside it
      setTimeout(function(){
        document.addEventListener('click', function closeStatusDropdown(e){
          var wrap = document.getElementById('statusDropdown');
          if (wrap && !wrap.contains(e.target)){
            state.statusDropdownOpen = false;
            render();
          }
          document.removeEventListener('click', closeStatusDropdown);
        }, { once: true });
      }, 0);
    }
    var s = document.getElementById('searchInput');
    if (s){
      s.oninput = function(e){ state.search = e.target.value; renderKeepFocus(); };
    }
    var refresh = document.getElementById('refreshBtn');
    if (refresh) refresh.onclick = function(){ flushQueue().then(fetchData); };
    var settings = document.getElementById('settingsBtn');
    if (settings) settings.onclick = function(e){
      e.stopPropagation();
      state.menuOpen = !state.menuOpen;
      // Opening the settings menu while the notifications panel is already
      // open used to leave BOTH panels rendered at once — on a narrow phone
      // screen the two dropdowns (each anchored to its own icon, just a few
      // pixels apart) landed on top of each other, looking like a jumble of
      // overlapping buttons/icons. Only one of these ever makes sense open
      // at a time, so opening one now always closes the others.
      if (state.menuOpen){ state.notifPanelOpen = false; state.branchDropdownOpen = false; }
      render();
    };

    var notifBell = document.getElementById('notifBellBtn');
    if (notifBell) notifBell.onclick = function(e){
      e.stopPropagation();
      state.notifPanelOpen = !state.notifPanelOpen;
      if (state.notifPanelOpen){
        state.menuOpen = false; // see comment on settingsBtn.onclick above
        state.branchDropdownOpen = false;
        // Mark everything read as soon as the panel is opened, so the badge
        // clears — the person has seen what's there.
        state.notifications.forEach(function(n){ n.read = true; });
        saveNotifications();
      }
      render();
    };
    if (state.notifPanelOpen){
      setTimeout(function(){
        document.addEventListener('click', function closeNotif(e){
          var wrap = document.querySelector('.notif-bell-wrap');
          if (wrap && !wrap.contains(e.target)){
            state.notifPanelOpen = false;
            render();
          }
          document.removeEventListener('click', closeNotif);
        }, { once: true });
      }, 0);
    }
    var clearNotifsBtn = document.getElementById('clearNotifsBtn');
