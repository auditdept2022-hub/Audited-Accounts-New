    return state.notifications.reduce(function(n, item){ return n + (item.read ? 0 : 1); }, 0);
  }

  function notifIconFor(type){
    if (type === 'error') return '⛔';
    if (type === 'warn') return '⚠';
    if (type === 'offline') return '📴';
    if (type === 'synced') return '🔄';
    return '✅';
  }

  // Human-readable label + pill class for a notification's status, when it
  // has one. Distinct from the notification "type" (error/warn/etc.) --
  // status tracks the current outcome of that specific event (still
  // failing, being retried automatically, or resolved/completed).
  function statusPillFor(status){
    if (status === 'failed') return { cls:'failed', label:'Failed' };
    if (status === 'retrying') return { cls:'retrying', label:'Retrying' };
    if (status === 'resolved') return { cls:'resolved', label:'Resolved' };
    if (status === 'success') return { cls:'success', label:'Completed' };
    return null;
  }

  function loadRemarksLog(){
    try{
      var raw = lsGet(REMARKS_LOG_STORAGE_KEY);
      state.remarksLog = raw ? JSON.parse(raw) : [];
    }catch(e){ state.remarksLog = []; }
  }

  function saveRemarksLog(){
    try{ lsSet(REMARKS_LOG_STORAGE_KEY, JSON.stringify(state.remarksLog.slice(0, 50))); }catch(e){}
  }

  // status: 'saved' (saved straight to the sheet) | 'queued' (saved on this
  // device only, waiting to sync) | 'synced' (was queued, now confirmed
  // saved to the sheet) | 'reverted' / 'reverted-queued' (written by the
  // "Undo" button, restoring a PRIOR value from this same log). wasOffline
  // flags entries that went through the offline path, so the "Recent saved
  // remarks" list can tell the two apart.
  // previousRemark: the Auditor Remarks text that was in place immediately
  // BEFORE this save, so the Activity list can show a before/after diff and
  // an "Undo" button can restore it. Pass null (not omit it) when the prior
  // value genuinely isn't known -- omitting it entirely would make it
  // `undefined`, which JSON.stringify() silently drops from localStorage,
  // so an entry reloaded from storage would look identical to one that
  // legitimately has no prior value. `null` survives the round trip and
  // both cases are treated the same way (Undo hidden) when rendering.
  function pushRemarksLogEntry(branch, row, customerName, remark, status, wasOffline, previousRemark){
    state.remarksLog.unshift({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      branch: branch,
      row: row,
      customerName: customerName || '',
      remark: remark || '',
      previousRemark: (previousRemark === undefined) ? null : previousRemark,
      status: status,
      wasOffline: !!wasOffline,
      ts: new Date().toISOString()
    });
    if (state.remarksLog.length > 50) state.remarksLog.length = 50;
    saveRemarksLog();
  }

  function customerNameFor(branch, row){
    var b = state.branches.find(function(x){ return x.branch === branch; });
    if (!b) return '';
    var r = b.rows.find(function(x){ return x._row === row; });
    return r ? (r['Customer Name'] || '') : '';
  }

  // Customer records that still need attention on this device: remarks
  // queued for sync once back online, or a typed draft that hasn't been
  // saved yet. Spans every branch, not just the one currently in view.
  function getPendingRemarksList(){
    var out = [];
    state.branches.forEach(function(b){
      b.rows.forEach(function(r){
        var queued = state.pendingQueue.some(function(i){
          return i.branch === b.branch && i.row === r._row && i.field === 'Auditor Remarks';
        });
        var savedVal = r['Auditor Remarks'] || '';
        var draftVal = loadDraft(b.branch, r._row);
        var hasDraft = draftVal !== null && draftVal !== savedVal;
        if (queued || hasDraft){
          out.push({
            branch: b.branch,
            row: r._row,
            customerName: r['Customer Name'],
            status: queued ? 'queued' : 'draft',
            value: queued ? savedVal : draftVal
          });
        }
      });
    });
    return out;
  }

  // Aging 2 categories we pull from the uploaded file, and the columns (A-H)
  // we keep for each customer row under those categories.
  var IMPORT_CATEGORIES = ['BNEW - OD', 'BNEW - DEL', 'REPO - OD', 'REPO - DEL', 'RSTR - OD', 'RSTR - DEL',
    'BNEW - ADV', 'BNEW - CU', 'REPO - ADV', 'REPO - CU', 'RSTR - ADV', 'RSTR - CU'];
  // Same set as IMPORT_CATEGORIES, but in the order rows should end up in —
  // OD/DEL rows first (the ones that matter most day-to-day), then ADV/CU
  // after. parseAgingWorkbook() sorts its output to this order regardless
  // of what order the categories appear in the uploaded file, so OD/DEL
  // rows land at the top both in this modal's preview AND in the Google
  // Sheet itself (Apps Script appends rows in the exact order sent).
  var CATEGORY_PRIORITY = ['BNEW - OD', 'BNEW - DEL', 'REPO - OD', 'REPO - DEL', 'RSTR - OD', 'RSTR - DEL',
    'BNEW - ADV', 'BNEW - CU', 'REPO - ADV', 'REPO - CU', 'RSTR - ADV', 'RSTR - CU'];
  // These must exactly match the header text used in the Google Sheet tabs,
  // so the Apps Script backend can slot each value into the right column
  // instead of dumping it into Auditor Remarks.
  var IMPORT_COLUMNS = ['Customer Name', 'SI Date', 'Model', 'Engine No', 'Due Day', 'Terms', 'MA', 'Beg Bal'];

  // Dropdown fields rendered as <select> in the drawer. Each entry's "field"
  // must exactly match the column header text in the Google Sheet (case-sensitive).
  // Options normally come from that column's existing data-validation list, sent
  // by the backend in branches[].dropdowns — "fallback" below is used instead
  // whenever the sheet has no validation list set (or the backend hasn't been
  // redeployed yet), so the dropdown still works out of the box. Changing a
  // value here saves straight back to that cell on the sheet.
  var DROPDOWN_UI_FIELDS = [
    { field: 'Customer Status', label: 'Customer status', id: 'statusSelect', placeholder: '— No classification —', fallback: [] },
    { field: 'Unit status', label: 'Unit status', id: 'unitStatusSelect', placeholder: '— Select unit status —',
      fallback: ['Good condition', 'Not Confirmed', 'Missing', 'Total wreck', 'Impounded', 'Pulled out', 'Tracing', 'Damage', 'Car-napped'] },
    { field: 'Payment mode', label: 'Payment mode', id: 'paymentModeSelect', placeholder: '— Select payment mode —',
      fallback: ['BRANCH', 'FIELD', 'N/A', 'IP', 'ONLINE'] }
  ];

  function clsForField(field, val){
    if (field === 'Unit status') return unitStatusClass(val);
    if (field === 'Payment mode') return paymentModeClass(val);
    return statusClass(val);
  }

  // Rows to ignore even under a matched category — subtotal / grand total
  // lines from the Aging 2 report, not real customer rows. Uses a whole-word
  // match (not a plain substring search) so a customer name that merely
  // CONTAINS "total" as part of a longer word isn't mistaken for a subtotal
  // line and silently dropped.
  function isTotalRow(col0){
    return /\btotal\b/i.test(col0);
  }

  function parseAgingWorkbook(arrayBuffer){
    var wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
    var sheet = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
    var out = [];
    var currentCategory = '';
    for (var i = 1; i < rows.length; i++){ // row 0 is the header row
      var r = rows[i];
      var col0 = String(r[0] || '').trim();
      // BUG (fixed, same root cause as the Aging 1 parser): this used to
      // only check r[1] (SI Date) for blankness. A real customer row whose
      // SI Date happened to be blank was wrongly treated as a category
      // label and silently dropped — never imported, never even shown as
      // "unmatched" since it never made it that far. A row now only counts
      // as a category label if EVERY other cell on it is blank.
      var isCategoryRow = col0 && isRowBlankAfterFirstCell(r);
      if (isCategoryRow){
        currentCategory = col0;
        continue;
      }
      if (!col0) continue;
      if (isTotalRow(col0)) continue; // skip "Total ...", "Grand Total", "Sub Total" lines
      if (IMPORT_CATEGORIES.indexOf(currentCategory) === -1) continue;
      out.push({
        category: currentCategory,
        'Customer Name': col0,
        'SI Date': r[1] || '',
        'Model': r[2] || '',
        'Engine No': r[3] || '',
        'Due Day': r[4] || '',
        'Terms': r[5] || '',
        'MA': r[6] || '',
        'Beg Bal': r[7] || ''
      });
    }
    // Re-order so OD/DEL rows always come first regardless of what order
    // their category headers appeared in the uploaded file (Aging 2
    // exports often list ADV/CU sections before OD/DEL) — .sort() is
    // stable, so rows within the same category keep their original order.
    out.sort(function(a, b){
      return CATEGORY_PRIORITY.indexOf(a.category) - CATEGORY_PRIORITY.indexOf(b.category);
    });
    return out;
  }

  function handleImportFile(file){
    state.importFileName = file.name;
    state.importRows = [];
    state.importCategoryFilter = '';
    state.importStatus = 'Reading file...';
    render();
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var rows = parseAgingWorkbook(e.target.result);
        state.importRows = rows;
        state.importStatus = rows.length ? '' : 'No matching rows found (looked for: ' + IMPORT_CATEGORIES.join(', ') + ').';
      }catch(err){
        state.importStatus = 'Could not read the file: ' + err.message;
      }
      render();
    };
    reader.onerror = function(){
      state.importStatus = 'Could not read the file.';
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  // Sending hundreds of rows (e.g. after adding the CU/ADV categories,
  // a single Aging 2 file can now produce 300+ rows) in one giant POST
  // is riskier than it needs to be: one slow/oversized request is more
  // likely to hit a network hiccup, a proxy/browser limit, or the Web
  // app's own execution time, and — worse — if that ONE request fails,
  // every row in it is retried from scratch even the ones that had
  // already gone through server-side. Splitting into smaller batches
  // means each request is quick and small, a failure only affects the
  // rows in that one batch (everything before it already landed in the
  // sheet), and retrying is safe either way since the backend's Engine
  // No dedupe skips anything already imported.
  var IMPORT_BATCH_SIZE = 100;

  function chunkArray(arr, size){
    var out = [];
    for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  async function doImport(){
    if (!state.importBranch){ state.importStatus = 'Choose which branch/tab this belongs to.'; render(); return; }
    if (!state.importRows.length){ state.importStatus = 'Nothing to import yet.'; render(); return; }
    state.importBusy = true;
    state.importStatus = 'Importing...';
    render();
    var rowsToSend = state.importRows.map(function(r){
      var out = {};
      IMPORT_COLUMNS.forEach(function(c){ out[c] = r[c]; });
      // Auto-set the status from the Aging 2 category the row was found
      // under (BNEW/REPO/RSTR combined with OD, DEL, ADV, or CU) instead
      // of writing anything to remarks. Sent under
      // both possible header names — the backend only fills whichever
      // column actually exists on that tab and ignores the other.
      out['Customer Status'] = r.category;
      out['Status'] = r.category;
      // Column H (Beg Bal) sent under several common header spellings —
      // the backend only fills whichever one actually exists on that tab.
      out['Beg Bal'] = r['Beg Bal'];
      out['Beginning Balance'] = r['Beg Bal'];
      out['Remaining Balance'] = r['Beg Bal'];
      out['Beginning Balance/Remaining Balance'] = r['Beg Bal'];
      return out;
    });

    var batches = chunkArray(rowsToSend, IMPORT_BATCH_SIZE);
    var totalImported = 0;
    var totalSkipped = 0;
    var totalSent = rowsToSend.length;

    try{
      for (var b = 0; b < batches.length; b++){
        if (batches.length > 1){
          state.importStatus = 'Importing batch ' + (b + 1) + ' of ' + batches.length +
            ' (' + totalImported + '/' + totalSent + ' done so far)...';
          render();
        }
        var batch = batches[b];
        try{
          var res = await fetchWithTimeout(state.url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'import', branch: state.importBranch, rows: batch })
          }, 30000);
          var data = await res.json();
          if (!data.success) throw new Error(data.error || 'Import failed.');
          totalImported += data.imported != null ? data.imported : batch.length;
          totalSkipped += data.skipped || 0;
        }catch(batchErr){
          // Everything in earlier batches already made it into the sheet —
          // only what's left (this batch onward) is still missing. Surface
          // exactly how much succeeded before stopping, and note that
          // re-running the import is safe (dedupe skips what's already in).
          var remaining = totalSent - totalImported - totalSkipped;
          throw new Error(
            (batches.length > 1
              ? 'Batch ' + (b + 1) + ' of ' + batches.length + ' failed after ' + totalImported +
                ' row(s) were already imported successfully. '
              : '') +
            batchErr.message +
            (batches.length > 1 ? ' (' + remaining + ' row(s) not yet imported.)' : '')
          );
        }
      }

      state.importStatus = 'Imported ' + totalImported +
        ' row(s)' + (totalSkipped ? ', skipped ' + totalSkipped + ' duplicate(s)' : '') + '.';
      // Verify the counts add up to what was sent — if not, something was
      // silently dropped server-side, which the bell should flag rather
      // than let pass as a quiet success.
      var accountedFor = totalImported + totalSkipped;
      if (accountedFor !== totalSent){
        pushNotification('warn', 'Aging 2 import: count mismatch on ' + state.importBranch,
          'Sent ' + totalSent + ' row(s), but only ' + accountedFor + ' were accounted for (imported + skipped). Some rows may not have made it into the sheet.',
          {
            status: 'failed',
            cause: 'The Google Sheet backend reported fewer imported + skipped rows than were actually sent, which usually means a row was rejected mid-import (bad data in a cell, a network hiccup during a batch, or the Apps Script hit its execution time limit).',
            solution: 'Re-open the same file and re-run the import for ' + state.importBranch + ' — duplicates are safely skipped, so it is safe to try again. If the mismatch keeps happening, check the source file for blank or malformed rows near the end.'
          });
      } else {
        pushNotification('success', 'Aging 2 import complete on ' + state.importBranch,
          totalImported + ' row(s) imported' + (totalSkipped ? ', ' + totalSkipped + ' duplicate(s) skipped' : '') +
          (batches.length > 1 ? ' across ' + batches.length + ' batch(es)' : '') + '.',
          { status: 'success' });
      }
      state.importRows = [];
      state.importBusy = false;
      await fetchData();
      render();
    }catch(err){
      state.importBusy = false;
      state.importStatus = 'Import failed: ' + err.message;
      pushNotification('error', 'Aging 2 import failed on ' + state.importBranch, err.message, {
        status: 'failed',
        cause: isOffline()
          ? 'Your device lost its internet connection while the file was uploading.'
          : 'The upload could not reach the Google Sheet, or the sheet rejected it — usually a network drop mid-upload, the Web app URL being wrong/outdated (edited Apps Script code must be redeployed as a "New version" under Manage deployments to take effect), the deployment access no longer set to "Anyone", or the source file having an unexpected format. Details: ' + err.message,
        solution: 'Check your internet connection, confirm the Web app URL in Connection settings matches your latest deployment and is set to "Anyone" access, then re-upload the same file for ' + state.importBranch + '. It is safe to retry — rows already imported are automatically skipped as duplicates.'
      });
      render();
    }
  }

  // ---- Aging 1 import ----
  // Unlike Aging 2, this file's columns are NOT fixed at specific letters —
  // different branch exports have put Engine No, Due This Month, Payment
  // (Adv), and Penalty Due in different positions. So instead of hardcoding
  // "column I", "column K", etc., we read the real header row (the row
  // whose first cell says "Customer Name") and match each field by its
  // header text, wherever it actually sits in that file. Matching against
  // customers already in the sheet (which came from Aging 2) is by Customer
  // Name; when two customers share a name we use Engine No to tell them
  // apart.
  function normAgingHeader(h){ return String(h || '').replace(/\s+/g, ' ').trim().toLowerCase(); }

  function findAging1HeaderRow(rows){
    for (var i = 0; i < Math.min(rows.length, 10); i++){
      if (normAgingHeader(rows[i][0]) === 'customer name') return i;
    }
    return -1;
  }

  function findAgingCol(headerRow, aliases){
    for (var c = 0; c < headerRow.length; c++){
      var h = normAgingHeader(headerRow[c]);
      if (aliases.indexOf(h) !== -1) return c;
    }
    return -1;
  }

  // A genuine category/section label row (e.g. "0-30 days") has ONLY its
  // first cell filled in — every other cell on that row is blank. Checking
  // the WHOLE row (not just one fixed column index) is what makes this
  // reliable for Aging 1 files, since — unlike Aging 2 — Aging 1's columns
  // are not fixed at specific letters; whatever happens to sit at index 1
  // varies file to file and is not a safe stand-in for "this row has data".
  function isRowBlankAfterFirstCell(r){
    for (var c = 1; c < r.length; c++){
      if (String(r[c] || '').trim() !== '') return false;
    }
    return true;
  }

  function parseAging1Workbook(arrayBuffer){
    var wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
    var sheet = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });

    var headerIdx = findAging1HeaderRow(rows);
    if (headerIdx === -1){
      throw new Error('Could not find a "Customer Name" header row in this file.');
    }
    var headerRow = rows[headerIdx];

    var colEngine = findAgingCol(headerRow, ['engine no', 'engine number', 'engine']);
    var colModel = findAgingCol(headerRow, ['model', 'unit model', 'unit']);
    var colDue = findAgingCol(headerRow, ['due this month']);
    var colAdv = findAgingCol(headerRow, ['payment (adv)', 'payment(adv)', 'payment adv', 'advance payment', 'payment advance']);
    var colPenalty = findAgingCol(headerRow, ['penalty due']);

    if (colDue === -1 && colAdv === -1 && colPenalty === -1){
      throw new Error('Could not find "Due This Month", "Payment (Adv)", or "Penalty Due" in this file\'s header row — check the column titles.');
    }

    var out = [];
    var currentCategory = '';
    for (var i = headerIdx + 1; i < rows.length; i++){
      var r = rows[i];
      var col0 = String(r[0] || '').trim();
      // BUG (fixed): this used to only check r[1] (the second column) for
      // blankness. That is correct for Aging 2, whose columns are fixed —
      // but Aging 1's columns move around file to file, so whatever data
      // happened to sit at index 1 was frequently blank even for a real
      // customer row, causing that customer to be wrongly treated as a
      // category label and dropped from the import entirely (never even
      // reaching the "unmatched" list — it just silently vanished). Now a
      // row only counts as a category label if EVERY other cell is blank.
      var isCategoryRow = col0 && isRowBlankAfterFirstCell(r);
      if (isCategoryRow){
        currentCategory = col0;
        continue;
      }
      if (!col0) continue;
      if (isTotalRow(col0)) continue; // skip "Total ...", "Grand Total", "Sub Total" lines
      out.push({
        category: currentCategory,
        'Customer Name': col0,
        'Engine No': colEngine !== -1 ? (r[colEngine] || '') : '',
        'Model': colModel !== -1 ? (r[colModel] || '') : '',
        'Due This Month': colDue !== -1 ? (r[colDue] || '') : '',
        'Payment (Adv)': colAdv !== -1 ? (r[colAdv] || '') : '',
        'Penalty Due': colPenalty !== -1 ? (r[colPenalty] || '') : ''
      });
    }
    return out;
  }

  function handleImportFile1(file){
    state.import1FileName = file.name;
    state.import1Rows = [];
    state.import1Status = 'Reading file...';
    render();
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var rows = parseAging1Workbook(e.target.result);
        state.import1Rows = rows;
        state.import1Status = rows.length ? '' : 'No customer rows found in this file.';
      }catch(err){
        state.import1Status = 'Could not read the file: ' + err.message;
      }
      render();
    };
    reader.onerror = function(){
      state.import1Status = 'Could not read the file.';
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  function normName(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
  function normEngine(s){ return String(s || '').trim().toLowerCase().replace(/[\s-]+/g, ''); }
  function normModel(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }

  // Matches each parsed Aging 1 row against the target branch's existing
  // customers by name. When a name is shared by more than one customer
  // (e.g. two "DELA CRUZ, JUAN" on the same tab), Engine No is checked
  // first to tell them apart; if that still doesn't land on exactly one
  // customer (blank/missing Engine No on either side, or no engine match
  // among the candidates), Model is checked next as a second
  // disambiguator. Returns { matched: [{importRow, sheetRow}], unmatched: [...] }
  function matchAging1Rows(branchName){
    var b = state.branches.find(function(x){ return x.branch === branchName; });
    var matched = [], unmatched = [];
    if (!b){ return { matched: matched, unmatched: state.import1Rows.slice() }; }
    var byName = {};
    b.rows.forEach(function(r){
      var key = normName(r['Customer Name']);
      if (!key) return;
      (byName[key] = byName[key] || []).push(r);
    });
    state.import1Rows.forEach(function(ir){
      var candidates = byName[normName(ir['Customer Name'])] || [];
      var target = null;
      if (candidates.length === 1){
        target = candidates[0];
      } else if (candidates.length > 1){
        var eng = normEngine(ir['Engine No']);
        if (eng){
          target = candidates.find(function(c){ return normEngine(c['Engine No']) === eng; }) || null;
        }
        if (!target){
          var mdl = normModel(ir['Model']);
          if (mdl){
            target = candidates.find(function(c){ return normModel(c['Model']) === mdl; }) || null;
          }
        }
      }
      if (target) matched.push({ importRow: ir, sheetRow: target });
      else unmatched.push(ir);
    });
    return { matched: matched, unmatched: unmatched };
  }

  // Turns a list of unmatched import rows into a readable "Name 1, Name 2,
  // and N more" string for notifications, so the auditor can see exactly
  // WHO didn't match instead of only a count. Capped at 20 named entries so
  // a big mismatched batch (e.g. wrong branch selected) doesn't produce an
  // unreadably long notification.
  function formatUnmatchedNames(list, cap){
    cap = cap || 20;
    var names = list.map(function(u){
      var name = String(u['Customer Name'] || '').trim();
      if (!name) return '';
      // Tag with the section/category the row was found under (e.g. "0-30
      // days") so an entry that turns out NOT to be a real customer name
      // (e.g. a stray number picked up from the source file) can still be
      // traced back to roughly where it sits in the uploaded file.
      return u.category ? (name + ' [' + u.category + ']') : name;
    }).filter(Boolean);
    if (!names.length) return '';
    if (names.length > cap){
      return names.slice(0, cap).join(', ') + ', and ' + (names.length - cap) + ' more';
    }
    return names.join(', ');
  }

  async function doImport1(){
    if (!state.import1Branch){ state.import1Status = 'Choose which branch/tab this belongs to.'; render(); return; }
    if (!state.import1Rows.length){ state.import1Status = 'Nothing to import yet.'; render(); return; }
    state.import1Busy = true;
    state.import1Status = 'Matching customers...';
    render();

    var result = matchAging1Rows(state.import1Branch);
    if (!result.matched.length){
      state.import1Busy = false;
      state.import1Status = 'No customers from this file matched anyone already in "' + state.import1Branch + '". Nothing was imported. Not found: ' + formatUnmatchedNames(result.unmatched) + '.';
      pushNotification('error', 'Aging 1 import: no matches on ' + state.import1Branch, 'None of the customers in the file matched anyone already in this branch. Nothing was imported.', {
        status: 'failed',
        cause: 'The customer names/engine numbers in the uploaded file did not match any customer already on the "' + state.import1Branch + '" sheet — usually because the wrong branch was selected, or the file has extra spacing, misspellings, or a different naming format than the sheet. Not found: ' + formatUnmatchedNames(result.unmatched) + '.',
        solution: 'Double-check that "' + state.import1Branch + '" is the correct branch for this file, then re-open the import and try again. If names still don\u2019t match, compare the spelling of a customer name in the file against the sheet.'
      });
      render();
      return;
    }

    var fields = ['Due This Month', 'Payment (Adv)', 'Penalty Due'];
    var total = result.matched.length;
    // Customers per request, and how many requests run at the same time.
    // Bigger chunks + several in flight together is what actually cuts
    // wall-clock time — waiting for one request to finish before starting
    // the next was the slow part, not the size of each request.
    var CHUNK_ROWS = 40;
    var CONCURRENCY = 4;

    // Update the local table immediately for every matched row, so the
    // screen reflects the import right away regardless of how long the
    // Google Sheet save takes in the background.
    var chunks = [];
    for (var start = 0; start < result.matched.length; start += CHUNK_ROWS){
      chunks.push(result.matched.slice(start, start + CHUNK_ROWS));
    }
    chunks.forEach(function(chunk){
      chunk.forEach(function(m){
        var row = m.sheetRow._row;
        fields.forEach(function(field){
          updateLocalField(state.import1Branch, row, field, m.importRow[field]);
        });
      });
    });

    var completedRows = 0, failedCount = 0, queuedCount = 0;
    var rejectedReasons = {}; // columns the backend couldn't find/save, deduped
    var offlineNow = isOffline();

    state.import1Status = 'Importing 0 of ' + total + ' customer(s)...';
    render();

    async function runChunk(chunk){
      var updates = [];
      chunk.forEach(function(m){
        var row = m.sheetRow._row;
        fields.forEach(function(field){
          updates.push({ row: row, field: field, value: m.importRow[field] });
        });
      });

      var wentOffline = offlineNow;
      if (!wentOffline){
        try{
          var bulkResult = await attemptRemoteBulkSave(state.import1Branch, updates);
          // The backend can respond success:true for the request as a whole
          // while still silently skipping individual columns it couldn't
          // find on this tab (e.g. header text doesn't match) — those show
          // up in bulkResult.rejected. Without checking this, the dashboard
          // would report "Updated" even though nothing was actually written
          // to the sheet for that column.
          (bulkResult && bulkResult.rejected || []).forEach(function(r){ rejectedReasons[r] = true; });
          updates.forEach(function(u){ unqueueWrite(state.import1Branch, u.row, u.field); });
        }catch(e){
          if (e.isNetworkError){
            state.online = false;
            offlineNow = true;
            wentOffline = true;
          } else {
            failedCount += chunk.length;
          }
        }
      }
      if (wentOffline){
        updates.forEach(function(u){ queueWrite(state.import1Branch, u.row, u.field, u.value, u.field); });
        queuedCount += chunk.length;
      }

      completedRows += chunk.length;
      // Live progress — updates as each chunk finishes, in whatever order
      // they land (several are running at once).
      state.import1Status = 'Importing ' + Math.min(completedRows, total) + ' of ' + total + ' customer(s)...';
      render();
    }

    // Small worker pool: up to CONCURRENCY chunks in flight at once, each
    // worker picking up the next unclaimed chunk as soon as it's free.
    var nextChunkIdx = 0;
    async function worker(){
      while (nextChunkIdx < chunks.length){
        var mine = chunks[nextChunkIdx++];
        await runChunk(mine);
      }
    }
    var workers = [];
    for (var w = 0; w < Math.min(CONCURRENCY, chunks.length); w++){ workers.push(worker()); }
    await Promise.all(workers);

    state.import1Busy = false;
    var rejectedList = Object.keys(rejectedReasons);
    state.import1Status = 'Updated ' + completedRows + ' customer(s)' +
      (result.unmatched.length ? ', ' + result.unmatched.length + ' not found in "' + state.import1Branch + '"' : '') +
      (queuedCount ? ', ' + queuedCount + ' saved on this device — will sync later' : '') +
      (failedCount ? ', ' + failedCount + ' field save(s) failed' : '') + '.' +
      (result.unmatched.length ? ' Not found: ' + formatUnmatchedNames(result.unmatched) + '.' : '') +
      (rejectedList.length
        ? ' ⚠ NOT actually saved to the sheet — ' + rejectedList.join(', ') +
          '. The column header text on the "' + state.import1Branch + '" tab doesn\'t match what the dashboard expects; fix the header (or the alias list in Code.gs) and re-import.'
        : '');
    (function(){
      var notifDetail = completedRows + ' of ' + total + ' customer(s) updated' +
        (result.unmatched.length ? ', ' + result.unmatched.length + ' not found' : '') +
        (queuedCount ? ', ' + queuedCount + ' queued offline' : '') +
        (failedCount ? ', ' + failedCount + ' failed' : '') +
        (rejectedList.length ? '. Rejected columns: ' + rejectedList.join(', ') : '') + '.';
      if (rejectedList.length || failedCount){
        pushNotification('error', 'Aging 1 import had problems on ' + state.import1Branch, notifDetail, {
          status: 'failed',
          cause: rejectedList.length
            ? 'The Google Sheet\u2019s "' + state.import1Branch + '" tab has column header text that doesn\u2019t match what the dashboard expects, so these fields could not be located: ' + rejectedList.join(', ') + '.'
            : (failedCount + ' individual field save(s) were rejected by the backend, or the request timed out for those rows.'),
          solution: rejectedList.length
            ? 'Fix the header text for ' + rejectedList.join(', ') + ' on the "' + state.import1Branch + '" tab so it matches the expected column names, then re-import the same file.'
            : 'Re-open the file and re-run the import for ' + state.import1Branch + ' — already-saved rows will just be overwritten with the same values, so it is safe to retry.'
        });
      } else if (queuedCount || result.unmatched.length){
        pushNotification('warn', 'Aging 1 import finished with notes on ' + state.import1Branch, notifDetail, {
          status: queuedCount ? 'retrying' : 'resolved',
          cause: queuedCount
            ? (queuedCount + ' row(s) could not reach the Google Sheet at the time of import, likely due to a dropped connection, and were saved on this device instead.')
            : (result.unmatched.length + ' customer(s) in the file did not match anyone already on "' + state.import1Branch + '": ' + formatUnmatchedNames(result.unmatched) + '.'),
          solution: queuedCount
            ? 'These will sync automatically the next time this device is online. You can check progress any time from this notifications panel.'
            : 'Double check the spelling of the unmatched customer names above against the sheet, or confirm they belong to a different branch.'
        });
      } else {
        pushNotification('success', 'Aging 1 import complete on ' + state.import1Branch, notifDetail, { status: 'success' });
      }
    })();
    state.import1Rows = [];
    // Re-pull from the sheet so the table reflects what was ACTUALLY saved,
    // not just the optimistic local update — if a column was rejected above,
    // this will show it reverting/blank instead of silently looking "saved".
    await fetchData();
    render();
  }

  // ---- Add Remarks import ----
  // Same idea as Aging 1 import: read a "Customer Name" header row wherever
  // it sits in the uploaded file, match rows against the target branch's
  // existing customers by name (using Engine No to tell duplicate names
  // apart), then bulk-save into Old Remarks (col S) — instead of Due This
  // Month / Payment (Adv) / Penalty Due.
  //
  // A customer is often audited more than once, and each check can have
  // its own remarks. So this import does NOT overwrite Old Remarks: each
  // matched row's new remarks are dated (using a Date column in the file
  // if one exists, otherwise today's date) and added ON TOP of whatever
  // is already saved in that customer's Old Remarks — see
  // mergeOldRemarksEntry() below. That way Old Remarks builds up into a
  // running history (most recent check first), so re-importing later data
  // for the same customer never loses what happened on an earlier check.
  // Unlike findAging1HeaderRow/findAgingCol above (which only ever look at
  // COLUMN A for "Customer Name", because that's how the Aging exports are
  // always laid out), a multi-branch workbook like AUDITED_ACCOUNTS.xlsx
  // puts Customer Name in a different column on almost every tab (A, B,
  // sometimes further right), and a few tabs don't even call it "Customer
  // Name" (e.g. "Acct Type/Status\nCustomer"). So remarks import gets its
  // own, more permissive column-resolution pass that scans every column of
  // the header row, not just the first — see resolveRemarksNameCol() below.
  //
  // "Engine No" is used as the row anchor instead of "Customer Name",
  // because every branch tab we've seen calls it exactly that, in some
  // column, even the handful of tabs with a nonstandard name column.
  var REMARKS_ENGINE_ALIASES = ['engine no', 'engine no.', 'engine number', 'engine #'];
  var REMARKS_NAME_EXACT_ALIASES = ['customer name', 'name of customer', 'client name'];
  var REMARKS_DATE_ALIASES = ['date of audit', 'audit date', 'check date', 'date checked', 'date audited', 'inspection date', 'remarks date', 'date'];
  // Sheets aren't excluded by name — a sheet simply isn't usable if no
  // "Engine No"-style column can be found on it (e.g. a "List of
  // Collectors" summary tab has no such column and is skipped naturally).

  function findRemarksHeaderRow(rows){
    var scanRows = Math.min(rows.length, 10);
    for (var r = 0; r < scanRows; r++){
      var row = rows[r] || [];
      for (var c = 0; c < row.length; c++){
        if (REMARKS_ENGINE_ALIASES.indexOf(normAgingHeader(row[c])) !== -1) return r;
      }
    }
    return -1;
  }

  function resolveRemarksAnyCol(headerRow, aliases){
    for (var c = 0; c < headerRow.length; c++){
      if (aliases.indexOf(normAgingHeader(headerRow[c])) !== -1) return c;
    }
    return -1;
  }

  function resolveRemarksNameCol(headerRow){
    var exact = resolveRemarksAnyCol(headerRow, REMARKS_NAME_EXACT_ALIASES);
    if (exact !== -1) return exact;
    // Fallback for tabs like "Acct Type/Status\nCustomer": accept a header
    // whose LAST word is "customer", but never "Customer Status".
    for (var c = 0; c < headerRow.length; c++){
      var h = normAgingHeader(headerRow[c]);
      if (!h || h === 'customer status') continue;
      var words = h.split(' ');
      if (words[words.length - 1] === 'customer') return c;
    }
    return -1;
  }

  // Any header containing "remark" is treated as a remarks column, however
  // that particular branch tab happens to label it — Auditor Remarks,
  // Audit Remarks (no "or"), C&C Remarks, Old Remarks, Last Audit Remarks,
  // etc. A tab can have more than one; the person picks which one to
  // import from in the "Remarks column" dropdown (see the modal below).
  function resolveRemarksCols(headerRow){
    var out = [];
    for (var c = 0; c < headerRow.length; c++){
      var raw = String(headerRow[c] == null ? '' : headerRow[c]).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (raw && normAgingHeader(raw).indexOf('remark') !== -1) out.push({ label: raw, col: c });
    }
    return out;
  }

  // Parses EVERY usable sheet in the uploaded workbook (not just the
  // first) into { name, headerIdx, nameCol, engineCol, modelCol, dateCol,
  // remarkCols, rows }. A sheet with no resolvable "Engine No" column is
  // skipped — that's what naturally excludes non-customer tabs like a
  // "List of Collectors" summary without needing to hardcode sheet names.
  function parseRemarksWorkbook(arrayBuffer){
    var wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: false });
    var sheets = [];

    wb.SheetNames.forEach(function(sheetName){
      var ws = wb.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      if (!rows.length) return;

      var headerIdx = findRemarksHeaderRow(rows);
      if (headerIdx === -1) return;
      var headerRow = rows[headerIdx];

      var engineCol = resolveRemarksAnyCol(headerRow, REMARKS_ENGINE_ALIASES);
      if (engineCol === -1) return;
      var nameCol = resolveRemarksNameCol(headerRow);
      var modelCol = resolveRemarksAnyCol(headerRow, ['model', 'unit model', 'unit']);
      var dateCol = resolveRemarksAnyCol(headerRow, REMARKS_DATE_ALIASES);
      var remarkCols = resolveRemarksCols(headerRow);
      if (!remarkCols.length) return; // nothing to import from this tab

      sheets.push({
        name: sheetName,
        headerIdx: headerIdx,
        nameCol: nameCol,
        engineCol: engineCol,
        modelCol: modelCol,
        dateCol: dateCol,
        remarkCols: remarkCols, // [{label, col}, ...]
        rows: rows.slice(headerIdx + 1)
      });
    });

    if (!sheets.length){
      throw new Error('Could not find any sheet with a recognizable "Engine No" and remarks column in this file.');
    }
    return sheets;
  }

  // Turns the currently-selected sheet + remarks column into the flat
  // { 'Customer Name', 'Engine No', 'Model', 'Old Remarks', 'Date' } row
  // shape that matchRemarksRows()/doImportRemarks() already expect —
  // keeping the rest of the Add Remarks pipeline (matching, merging,
  // saving) exactly as it was. Re-run whenever the file, the chosen sheet,
  // or the chosen remarks column changes.
  function recomputeImportRemarksRows(){
    var sheet = state.importRemarksSheets.find(function(s){ return s.name === state.importRemarksSourceSheet; });
    if (!sheet || !state.importRemarksSourceCol){ state.importRemarksRows = []; return; }
    var remarkCol = sheet.remarkCols.find(function(rc){ return rc.label === state.importRemarksSourceCol; });
    if (!remarkCol){ state.importRemarksRows = []; return; }

    var out = [];
    sheet.rows.forEach(function(r){
      var nameVal = sheet.nameCol !== -1 ? String(r[sheet.nameCol] || '').trim() : '';
      var engineVal = String(r[sheet.engineCol] || '').trim();
      if (!nameVal && !engineVal) return; // blank/padding row
      if (isTotalRow(nameVal)) return; // "Total ...", "Grand Total", etc.
      var remarksVal = r[remarkCol.col];
      if (String(remarksVal || '').trim() === '') return; // nothing to save for this row
      out.push({
        'Customer Name': nameVal,
        'Engine No': engineVal,
        'Model': sheet.modelCol !== -1 ? (r[sheet.modelCol] || '') : '',
        'Old Remarks': remarksVal,
        'Date': sheet.dateCol !== -1 ? (r[sheet.dateCol] || '') : ''
      });
    });
    state.importRemarksRows = out;
  }

  // Preference order for auto-picking which remarks column to default to
  // on a freshly-selected sheet — "Auditor Remarks" is what the dashboard
  // itself calls this field, so it's preferred when present.
  var REMARKS_COL_PREFERENCE = ['auditor remarks', 'audit remarks', 'remarks', 'remark', 'c&c remarks', 'old remarks', 'last audit remarks'];

  function pickDefaultRemarksCol(sheet){
    if (!sheet || !sheet.remarkCols.length) return '';
    for (var p = 0; p < REMARKS_COL_PREFERENCE.length; p++){
      var hit = sheet.remarkCols.find(function(rc){ return normAgingHeader(rc.label) === REMARKS_COL_PREFERENCE[p]; });
      if (hit) return hit.label;
    }
    return sheet.remarkCols[0].label;
  }

  // Tries to line up a sheet inside the uploaded file with the dashboard
  // branch/tab chosen to import INTO — most of the time they share the
  // same name (e.g. a sheet called "ANGELES" for the "ANGELES" branch). If
  // nothing matches and the file only has one usable sheet at all, that
  // one is used regardless of its name (keeps old single-sheet remarks
  // files working exactly as before). Otherwise it's left for the person
  // to pick from the "Sheet in file" dropdown.
  function autoPickRemarksSheet(){
    var sheets = state.importRemarksSheets;
    if (!sheets.length) return '';
    if (state.importRemarksBranch){
      var wanted = normName(state.importRemarksBranch);
      var hit = sheets.find(function(s){ return normName(s.name) === wanted; });
      if (hit) return hit.name;
    }
    if (sheets.length === 1) return sheets[0].name;
    return '';
  }

  function handleImportRemarksFile(file){
    state.importRemarksFileName = file.name;
    state.importRemarksSheets = [];
    state.importRemarksSourceSheet = '';
    state.importRemarksSourceCol = '';
    state.importRemarksRows = [];
    state.importRemarksStatus = 'Reading file...';
    render();
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var sheets = parseRemarksWorkbook(e.target.result);
        state.importRemarksSheets = sheets;
        state.importRemarksSourceSheet = autoPickRemarksSheet();
        var chosenSheet = sheets.find(function(s){ return s.name === state.importRemarksSourceSheet; });
        state.importRemarksSourceCol = pickDefaultRemarksCol(chosenSheet);
        recomputeImportRemarksRows();
        state.importRemarksStatus = state.importRemarksSourceSheet
          ? (state.importRemarksRows.length ? '' : 'No rows with remarks found in "' + state.importRemarksSourceSheet + '".')
          : (sheets.length + ' branch tab(s) found in this file — choose which one to import from below.');
      }catch(err){
        state.importRemarksStatus = 'Could not read the file: ' + err.message;
      }
      render();
    };
    reader.onerror = function(){
      state.importRemarksStatus = 'Could not read the file.';
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  // Matches each parsed remarks row against the target branch's existing
  // customers, same rule as Aging 1: by name, then by engine number, then
  // by model when a name is shared by more than one customer and engine
  // number alone doesn't resolve it.
  function matchRemarksRows(branchName){
    var b = state.branches.find(function(x){ return x.branch === branchName; });
    var matched = [], unmatched = [];
    if (!b){ return { matched: matched, unmatched: state.importRemarksRows.slice() }; }
    var byName = {};
    b.rows.forEach(function(r){
      var key = normName(r['Customer Name']);
      if (!key) return;
      (byName[key] = byName[key] || []).push(r);
    });
    state.importRemarksRows.forEach(function(ir){
      var candidates = byName[normName(ir['Customer Name'])] || [];
      var target = null;
      if (candidates.length === 1){
        target = candidates[0];
      } else if (candidates.length > 1){
        var eng = normEngine(ir['Engine No']);
        if (eng){
          target = candidates.find(function(c){ return normEngine(c['Engine No']) === eng; }) || null;
        }
        if (!target){
          var mdl = normModel(ir['Model']);
          if (mdl){
            target = candidates.find(function(c){ return normModel(c['Model']) === mdl; }) || null;
          }
        }
      }
      if (target) matched.push({ importRow: ir, sheetRow: target });
      else unmatched.push(ir);
    });
    return { matched: matched, unmatched: unmatched };
  }

  // Formats a stamp for a new Old Remarks entry — uses the row's own Date
  // column from the uploaded file when present and parseable, otherwise
  // falls back to today (the date this file is being imported).
  //
  // IMPORTANT: parseRemarksWorkbook() reads the workbook with
  // cellDates:false, so a date cell comes through as a raw Excel/Sheets
  // serial NUMBER (e.g. 46127 for 2026-04-15), not a JS Date. That number
  // must be converted the same way fmtDatePretty() does elsewhere in this
  // file (days since 1899-12-30) — this used to go straight into
  // `new Date(String(rawDate))` instead, which doesn't understand serial
  // numbers and silently misreads a 5-digit one as a literal YEAR (month
  // defaults to January, day to 1) — that's the exact "[January 1, 46127]"
  // bug: 46127 is the correct serial number, just never converted.
  function remarksImportDateStamp(rawDate){
    var d = null;
    if (rawDate){
      if (Object.prototype.toString.call(rawDate) === '[object Date]' && !isNaN(rawDate.getTime())){
        d = rawDate;
      } else if (typeof rawDate === 'number' && isFinite(rawDate)){
        d = excelSerialToDate(rawDate);
      } else {
        var s = String(rawDate).trim();
        if (/^\d+(\.\d+)?$/.test(s)){
          // Numeric string (e.g. the cell came through as text) — same
          // serial-number case as above, just not already a JS number.
          d = excelSerialToDate(Number(s));
        } else {
          var parsed = new Date(s);
          if (!isNaN(parsed.getTime())) d = parsed;
        }
      }
    }
    if (!d || isNaN(d.getTime())) d = new Date();
    return d.toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // Excel/Google Sheets serial date -> JS Date. Same formula as
  // fmtDatePretty() above (days since 1899-12-30).
  function excelSerialToDate(serial){
    return new Date(Math.round((serial - 25569) * 86400 * 1000));
  }

  // A saved Old Remarks entry always starts its own line with a
  // "[Month Day, Year] " stamp (see mergeOldRemarksEntry below) — used to
  // split the field back into individual dated entries even though a
  // single entry's own remark text may itself contain line breaks.
  var OLD_REMARKS_ENTRY_START_RE = /^\[[A-Za-z]+ \d{1,2}, \d{1,7}\] /;

  function splitOldRemarksEntries(text){
    var t = String(text || '').trim();
    if (!t) return [];
    return t.split(/\n(?=\[[A-Za-z]+ \d{1,2}, \d{1,7}\] )/);
  }

  // One-time repair for entries saved by the broken date logic above: a
  // stamp like "[January 1, 46127]" is recognizable because it's always
  // exactly "January 1" with a year far outside any real year — and that
  // "year" is, digit for digit, the original (unconverted) serial number.
  // So the fix is just running that same number back through
  // excelSerialToDate() to recover the real date. Leaves any entry that
  // doesn't match this exact broken shape untouched.
  var BROKEN_STAMP_RE = /^\[January 1, (\d{5,7})\] /;
  function repairOldRemarksBlock(block){
    var m = BROKEN_STAMP_RE.exec(block);
    if (!m) return block;
    var fixedDate = excelSerialToDate(Number(m[1]));
    if (isNaN(fixedDate.getTime())) return block;
    var fixedStamp = '[' + fixedDate.toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' }) + '] ';
    return fixedStamp + block.slice(m[0].length);
  }

  // Strips a block's leading "[Date] " stamp (if any) so two entries can
  // be compared by their actual remark text alone, regardless of date.
  function oldRemarksBlockContent(block){
    return String(block || '').replace(OLD_REMARKS_ENTRY_START_RE, '').trim();
  }

  // Builds the value that actually gets saved into Old Remarks for a
  // matched import row: the new remarks, dated, added ON TOP of whatever
  // is already in that customer's Old Remarks — never replacing it. This
  // is what lets a customer who's been audited more than once keep every
  // past check's remarks visible (most recent first), instead of each
  // new "Add Remarks" import wiping out the last one.
  //
  // Also, on every call: (1) repairs any already-saved entry still
  // carrying the broken "[January 1, <serial>]" stamp from before the fix
  // above, and (2) skips adding the new entry if its remark text (ignoring
  // the date) already matches an existing entry, so re-importing the same
  // file — or a file whose remarks for a customer didn't actually change —
  // never stacks a duplicate line.
  function mergeOldRemarksEntry(existingVal, newVal, rawDate){
    var cleanNew = String(newVal || '').trim();
    var repaired = splitOldRemarksEntries(existingVal).map(repairOldRemarksBlock);
    // Drop any entry already sitting in the field more than once (keeps the
    // first/most-recent occurrence, discards later repeats) — cleans up
    // duplicates that got saved before this fix existed, not just ones this
    // call would otherwise add.
    var seen = {};
    var existingBlocks = repaired.filter(function(b){
      var key = oldRemarksBlockContent(b).toLowerCase();
      if (seen[key]) return false;
      seen[key] = true;
      return true;
    });
    if (!cleanNew) return existingBlocks.join('\n');
    var alreadyPresent = !!seen[cleanNew.toLowerCase()];
    if (alreadyPresent) return existingBlocks.join('\n');
    var entry = '[' + remarksImportDateStamp(rawDate) + '] ' + cleanNew;
    return existingBlocks.length ? (entry + '\n' + existingBlocks.join('\n')) : entry;
  }

  async function doImportRemarks(){
    if (!state.importRemarksBranch){ state.importRemarksStatus = 'Choose which branch/tab this belongs to.'; render(); return; }
    if (!state.importRemarksRows.length){ state.importRemarksStatus = 'Nothing to import yet.'; render(); return; }
    state.importRemarksBusy = true;
    state.importRemarksStatus = 'Matching customers...';
    render();

    var result = matchRemarksRows(state.importRemarksBranch);
    if (!result.matched.length){
      state.importRemarksBusy = false;
      state.importRemarksStatus = 'No customers from this file matched anyone already in "' + state.importRemarksBranch + '". Nothing was imported.';
      pushNotification('error', 'Remarks import: no matches on ' + state.importRemarksBranch, 'None of the customers in the file matched anyone already in this branch. Nothing was imported.', {
        status: 'failed',
        cause: 'The customer names/engine numbers in the uploaded file did not match any customer already on the "' + state.importRemarksBranch + '" sheet — usually because the wrong branch was selected, or the file has extra spacing, misspellings, or a different naming format than the sheet.',
        solution: 'Double-check that "' + state.importRemarksBranch + '" is the correct branch for this file, then re-open the import and try again. If names still don\u2019t match, compare the spelling of a customer name in the file against the sheet.'
      });
      render();
      return;
    }

    var fields = ['Old Remarks'];
    var CHUNK_ROWS = 40;
    var CONCURRENCY = 4;

    // A single uploaded file can contain more than one audit visit for the
    // SAME customer — same Customer Name/Engine No, but a different Date
    // of Audit and different remarks each time (matchRemarksRows() above
    // matches every such row to the same target sheet row). Group those
    // together here so each customer gets exactly ONE save, built by
    // merging every visit's remarks (each dated) on top of whatever was
    // already in Old Remarks — oldest visit first, so after each is
    // prepended in turn, the most recent visit ends up at the very top.
    // Without this grouping, two file rows for the same customer would
    // either silently overwrite each other (only the last-processed one
    // surviving) or, worse, become two separate saves to the same cell
    // racing each other across parallel chunks.
    function entryTimeMs(rawDate){
      if (!rawDate) return -Infinity; // undated visits sort as "oldest" so dated ones stay in real order
      var d;
      // BUG (fixed): this used to always do `new Date(String(rawDate))`,
      // which is the exact same broken path documented on
      // remarksImportDateStamp() above — parseRemarksWorkbook() reads dates
      // as raw Excel serial numbers (e.g. 46127), and `new Date("46127")` is
      // an Invalid Date, not a real date. That fix was applied to the
      // DISPLAYED stamp but missed here, so when a file had more than one
      // visit for the same customer, they were silently sorted by their
      // row order in the file instead of by actual date — "most recent
      // visit ends up on top" wasn't reliably true. Now handled the same
      // way as remarksImportDateStamp().
      if (Object.prototype.toString.call(rawDate) === '[object Date]'){
        d = rawDate;
      } else if (typeof rawDate === 'number' && isFinite(rawDate)){
        d = excelSerialToDate(rawDate);
      } else {
        var s = String(rawDate).trim();
        d = /^\d+(\.\d+)?$/.test(s) ? excelSerialToDate(Number(s)) : new Date(s);
      }
      return isNaN(d.getTime()) ? -Infinity : d.getTime();
    }
    var byTargetRow = {}; // sheetRow._row -> { sheetRow, entries: [{value, rawDate}] }
    result.matched.forEach(function(m){
      var key = m.sheetRow._row;
      if (!byTargetRow[key]) byTargetRow[key] = { sheetRow: m.sheetRow, entries: [] };
      byTargetRow[key].entries.push({ value: m.importRow['Old Remarks'], rawDate: m.importRow['Date'] });
    });
    var dedupedMatched = Object.keys(byTargetRow).map(function(key){
      var g = byTargetRow[key];
      g.entries.sort(function(a, b){ return entryTimeMs(a.rawDate) - entryTimeMs(b.rawDate); });
      var merged = g.sheetRow['Old Remarks'];
      g.entries.forEach(function(e){ merged = mergeOldRemarksEntry(merged, e.value, e.rawDate); });
      return { sheetRow: g.sheetRow, importRow: { 'Old Remarks': merged } };
    });
    var total = dedupedMatched.length;

    // Update the local table immediately for every matched row, so the
    // screen reflects the import right away regardless of how long the
    // Google Sheet save takes in the background.
    var chunks = [];
    for (var start = 0; start < dedupedMatched.length; start += CHUNK_ROWS){
      chunks.push(dedupedMatched.slice(start, start + CHUNK_ROWS));
    }
    chunks.forEach(function(chunk){
      chunk.forEach(function(m){
        var row = m.sheetRow._row;
        fields.forEach(function(field){
          updateLocalField(state.importRemarksBranch, row, field, m.importRow[field]);
        });
      });
    });

    var completedRows = 0, failedCount = 0, queuedCount = 0;
    var rejectedReasons = {};
    var offlineNow = isOffline();

    state.importRemarksStatus = 'Importing 0 of ' + total + ' customer(s)...';
    render();

    async function runChunk(chunk){
      var updates = [];
      chunk.forEach(function(m){
        var row = m.sheetRow._row;
        fields.forEach(function(field){
          updates.push({ row: row, field: field, value: m.importRow[field] });
        });
      });

      var wentOffline = offlineNow;
      if (!wentOffline){
        try{
          var bulkResult = await attemptRemoteBulkSave(state.importRemarksBranch, updates);
          (bulkResult && bulkResult.rejected || []).forEach(function(r){ rejectedReasons[r] = true; });
          updates.forEach(function(u){ unqueueWrite(state.importRemarksBranch, u.row, u.field); });
        }catch(e){
          if (e.isNetworkError){
            state.online = false;
            offlineNow = true;
            wentOffline = true;
          } else {
            failedCount += chunk.length;
          }
        }
      }
      if (wentOffline){
        updates.forEach(function(u){ queueWrite(state.importRemarksBranch, u.row, u.field, u.value, u.field); });
        queuedCount += chunk.length;
      }

      completedRows += chunk.length;
      state.importRemarksStatus = 'Importing ' + Math.min(completedRows, total) + ' of ' + total + ' customer(s)...';
      render();
    }

    var nextChunkIdx = 0;
    async function worker(){
      while (nextChunkIdx < chunks.length){
        var mine = chunks[nextChunkIdx++];
        await runChunk(mine);
      }
    }
    var workers = [];
    for (var w = 0; w < Math.min(CONCURRENCY, chunks.length); w++){ workers.push(worker()); }
    await Promise.all(workers);

    state.importRemarksBusy = false;
    var rejectedList = Object.keys(rejectedReasons);
    state.importRemarksStatus = 'Updated ' + completedRows + ' customer(s)' +
      (result.unmatched.length ? ', ' + result.unmatched.length + ' not found in "' + state.importRemarksBranch + '"' : '') +
      (queuedCount ? ', ' + queuedCount + ' saved on this device — will sync later' : '') +
      (failedCount ? ', ' + failedCount + ' field save(s) failed' : '') + '.' +
      (rejectedList.length
        ? ' ⚠ NOT actually saved to the sheet — ' + rejectedList.join(', ') +
          '. The column header text on the "' + state.importRemarksBranch + '" tab doesn\'t match what the dashboard expects; fix the header (or the alias list in Code.gs) and re-import.'
        : '');
    (function(){
      var notifDetail = completedRows + ' of ' + total + ' customer(s) updated' +
        (result.unmatched.length ? ', ' + result.unmatched.length + ' not found' : '') +
        (queuedCount ? ', ' + queuedCount + ' queued offline' : '') +
        (failedCount ? ', ' + failedCount + ' failed' : '') +
        (rejectedList.length ? '. Rejected columns: ' + rejectedList.join(', ') : '') + '.';
      if (rejectedList.length || failedCount){
        pushNotification('error', 'Remarks import had problems on ' + state.importRemarksBranch, notifDetail, {
          status: 'failed',
          cause: rejectedList.length
            ? 'The Google Sheet\u2019s "' + state.importRemarksBranch + '" tab has column header text that doesn\u2019t match what the dashboard expects, so these fields could not be located: ' + rejectedList.join(', ') + '.'
            : (failedCount + ' individual field save(s) were rejected by the backend, or the request timed out for those rows.'),
          solution: rejectedList.length
            ? 'Fix the header text for ' + rejectedList.join(', ') + ' on the "' + state.importRemarksBranch + '" tab so it matches the expected column names, then re-import the same file.'
            : 'Re-open the file and re-run the import for ' + state.importRemarksBranch + ' — each import now ADDS a new dated entry to Old Remarks rather than overwriting it, so retrying is safe for rows that failed. If some rows already succeeded before the failure, re-running the whole file will add a second (duplicate) dated entry for those — check Old Remarks for any customer you re-import if you\'re not sure whether it already went through.'
        });
      } else if (queuedCount || result.unmatched.length){
        pushNotification('warn', 'Remarks import finished with notes on ' + state.importRemarksBranch, notifDetail, {
          status: queuedCount ? 'retrying' : 'resolved',
          cause: queuedCount
            ? (queuedCount + ' row(s) could not reach the Google Sheet at the time of import, likely due to a dropped connection, and were saved on this device instead.')
            : (result.unmatched.length + ' customer(s) in the file did not match anyone already on "' + state.importRemarksBranch + '".'),
          solution: queuedCount
            ? 'These will sync automatically the next time this device is online. You can check progress any time from this notifications panel.'
            : 'Double check the spelling of the unmatched customer names against the sheet, or confirm they belong to a different branch.'
        });
      } else {
        pushNotification('success', 'Remarks import complete on ' + state.importRemarksBranch, notifDetail, { status: 'success' });
      }
    })();
    state.importRemarksRows = [];
    await fetchData();
    render();
  }

  // ---- Download current branch as a spreadsheet ----
  // Only rows whose Customer Status is one of BNEW-OD, BNEW-DEL, REPO-OD,
  // REPO-DEL, RSTR-OD, RSTR-DEL are included in the download — same
  // category list as LANDING_DEFAULT_CATEGORIES below, so this stays in
  // sync automatically if that list ever changes. ADV/CU rows,
  // unclassified rows, and any other status are left out of the file.
  function downloadCurrentBranch(){
    var b = currentBranch();
    if (!b || !b.rows.length){
      alert('No rows to download for this branch.');
      return;
    }
    var rows = b.rows.filter(function(r){
      var status = String(r['Customer Status'] || '').replace(/\s+/g, ' ').trim().toUpperCase();
      return LANDING_DEFAULT_CATEGORIES.indexOf(status) !== -1;
    });
    if (!rows.length){
      alert('No rows to download for this branch (none match BNEW-OD, BNEW-DEL, REPO-OD, REPO-DEL, RSTR-OD, RSTR-DEL).');
      return;
    }
    var headers = (b.headers || []).filter(function(h){ return h && h !== '_row'; });
    rows = rows.map(function(r){
      var out = {};
      headers.forEach(function(h){ out[h] = r[h] !== undefined ? r[h] : ''; });
      return out;
    });
    var ws = XLSX.utils.json_to_sheet(rows, { header: headers });
    var wb = XLSX.utils.book_new();
    var sheetName = (b.branch || 'Branch').substring(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    var fileName = (b.branch || 'branch').replace(/[^a-z0-9]+/gi, '_') + '_export.xlsx';
    XLSX.writeFile(wb, fileName);
  }

  // ---- Print current branch (Customer Name / Model / Engine No / Due Day /
  // Terms / MA / Beg Bal / Auditor Remarks) as a plain printable table ----
  var PRINT_COLUMNS = ['Customer Name', 'Model', 'Engine No', 'Due Day', 'Terms', 'MA', 'Beg Bal', 'Auditor Remarks'];
  // Rows whose Customer Status is one of these are left out of the printed
  // table — the print output should only ever show BNEW-OD, BNEW-DEL,
  // REPO-OD, REPO-DEL, RSTR-OD, RSTR-DEL. Uppercased once here so the
  // comparison in printCurrentBranch() below is case/spacing-insensitive
  // (matches "BNEW - Adv", "bnew-adv", etc. just in case).
  var PRINT_EXCLUDE_CATEGORIES = ['BNEW - ADV', 'BNEW - CU', 'REPO - ADV', 'REPO - CU', 'RSTR - ADV', 'RSTR - CU']
    .map(function(c){ return c.toUpperCase(); });

  // Statuses shown on the landing view (no explicit status filter picked
  // yet) — BNEW/REPO/RSTR x OD/DEL only. ADV/CU rows and blank-status rows
  // are left out of this initial list so the table has fewer rows to build
  // and paint on first load; picking a specific status from the dropdown or
  // a pill (including an ADV/CU one, or "— Unclassified —") still works as
  // before and overrides this default. Uppercased/space-normalized once
  // here so the comparison in filteredRows() is case/spacing-insensitive
  // (matches "Bnew-OD", "bnew - od", etc.).
  var LANDING_DEFAULT_CATEGORIES = ['BNEW - OD', 'BNEW - DEL', 'REPO - OD', 'REPO - DEL', 'RSTR - OD', 'RSTR - DEL']
    .map(function(c){ return c.toUpperCase(); });

  function printCurrentBranch(){
    var b = currentBranch();
    var rows = filteredRows().filter(function(r){
      var status = String(r['Customer Status'] || '').replace(/\s+/g, ' ').trim().toUpperCase();
      return PRINT_EXCLUDE_CATEGORIES.indexOf(status) === -1;
    });
    if (!b || !rows.length){
      alert('No rows to print for this branch.');
      return;
    }

    var theadHtml = '<tr>' + PRINT_COLUMNS.map(function(c){
      return '<th>' + esc(c) + '</th>';
    }).join('') + '</tr>';

    var tbodyHtml = rows.map(function(r){
      return '<tr>' + PRINT_COLUMNS.map(function(c){
        var v = c === 'Beg Bal' ? getBegBal(r) : (r[c] !== undefined && r[c] !== null ? r[c] : '');
        if (c === 'MA' || c === 'Beg Bal') v = fmtValue(c, v) || v;
        return '<td>' + esc(v) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    var today = new Date();
    var dateStr = (today.getMonth()+1) + '/' + today.getDate() + '/' + today.getFullYear();

    var win = window.open('', '_blank');
    if (!win){
      alert('Please allow pop-ups to print.');
      return;
    }
    win.document.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(b.branch || 'Branch') + ' - Audited Accounts</title>' +
      '<style>' +
        '@page{ size: landscape; margin:14mm; }' +
        'body{ font-family: Arial, Helvetica, sans-serif; color:#000; margin:0; padding:0 16px; }' +
        'h1{ font-size:16px; margin:0 0 2px; }' +
        '.meta{ font-size:11px; color:#333; margin:0 0 12px; }' +
        'table{ border-collapse:collapse; width:100%; }' +
        'th, td{ border:1px solid #000; padding:5px 8px; font-size:11.5px; text-align:left; vertical-align:top; }' +
        'th{ background:#f0f0f0; font-weight:bold; text-transform:none; }' +
        'tbody tr:nth-child(even){ background:#fafafa; }' +
        '@media print{ tbody tr:nth-child(even){ background:#fafafa; -webkit-print-color-adjust:exact; print-color-adjust:exact; } }' +
      '</style></head><body>' +
      '<h1>' + esc(b.branch || 'Branch') + ' — Audited Accounts</h1>' +
      '<p class="meta">Printed ' + dateStr + (state.statusFilter ? (' &middot; Filter: ' + esc(state.statusFilter)) : '') + (state.search ? (' &middot; Search: "' + esc(state.search) + '"') : '') + '</p>' +
      '<table><thead>' + theadHtml + '</thead><tbody>' + tbodyHtml + '</tbody></table>' +
      '</body></html>'
    );
    win.document.close();
    win.focus();
    setTimeout(function(){ win.print(); }, 300);
  }

  // ---- Auto-save for Auditor Remarks ----
  // Instead of requiring a tap on "Save", once the user pauses typing for
  // a short moment (and we're online) the remarks are saved automatically
  // in the background, same as the other dropdown fields already do. The
  // manual Save button still works too, for anyone who wants to save
  // immediately without waiting for the pause.
  var remarksAutoSaveTimer = null;
  var REMARKS_AUTOSAVE_DELAY_MS = 900;
  // Used by the "Already made a payment" quick-remark button: detects
  // whether that standard line is already present in the saved remarks
  // (so the button can show as "marked"), and stops a second tap from
  // stacking a duplicate line on top of an existing one.
  // Today's date as 'YYYY-MM-DD', for the <input type="date"> next to the
  // "Already made a payment" button (that input format is the one thing
  // <input type="date"> requires).
  function todayISODate(){
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  var ALREADY_PAID_MARKER_RE = /already made a payment/i;

  // Auto-generated "Unit status / Payment mode" remarks line. Whenever
  // either dropdown is changed, a single summary line is added/updated/
  // removed at the top of Auditor Remarks so the auditor doesn't have to
  // type it by hand. No prefix -- the line just reads "unit status is
  // ..." and/or "payment mode is ...". Identified via AUTO_FIELD_REMARK_RE
  // below (matches a line starting with either of those phrases) so it
  // can be found and replaced without touching anything typed by hand
  // elsewhere in the box -- same idea as ALREADY_PAID_MARKER_RE above.
  var AUTO_FIELD_REMARK_RE = /^(unit status is|payment mode is).*$/im;

  function autoFieldRemarkLine(r){
    var unitStatus = String((r && r['Unit status']) || '').trim();
    var paymentMode = String((r && r['Payment mode']) || '').trim();
    if (!unitStatus && !paymentMode) return '';
    var parts = [];
    if (unitStatus) parts.push('unit status is ' + unitStatus);
    if (paymentMode) parts.push('payment mode is ' + paymentMode);
    return parts.join(', ') + '.';
  }

  // Strips out only the auto-generated line(s) (case: none, one, or a
  // stray extra), keeping every other line -- including manually typed
  // remarks -- untouched.
  function stripAutoFieldRemarkLine(text){
    return String(text || '')
      .split('\n')
      .filter(function(line){ return !AUTO_FIELD_REMARK_RE.test(line); })
      .join('\n')
      .replace(/^\n+/, '');
  }

  // Called after Unit status or Payment mode is changed via the drawer's
  // dropdowns. Rebuilds the auto line from the row's current values and
  // saves it into Auditor Remarks the same way the "Already made a
  // payment" button does (drops it into the textarea, then runs the
  // normal remarks save path -- online save, offline queue, and the
  // "Recent saved remarks" log all keep working exactly as before).
  async function syncAutoFieldRemarkLine(){
    if (!state.selected || state.savingRemarks) return;
    var b = currentBranch();
    var row = state.selected._row;
    var ta = document.getElementById('remarksInput');
    var current = ta ? ta.value : (state.selected['Auditor Remarks'] || '');
    var rest = stripAutoFieldRemarkLine(current);
    var line = autoFieldRemarkLine(state.selected);
    var updated = line ? (rest.trim() ? (line + '\n' + rest) : line) : rest;
    if (updated === current) return; // nothing to do -- avoid a redundant save
    if (ta) ta.value = updated;
    if (b && state.selected) saveDraft(b.branch, row, updated);
    await handleSaveRemarks();
  }

  function scheduleRemarksAutoSave(){
    if (remarksAutoSaveTimer) clearTimeout(remarksAutoSaveTimer);
    remarksAutoSaveTimer = setTimeout(function(){
      remarksAutoSaveTimer = null;
      if (isOffline() || !state.selected || state.savingRemarks) return;
      var ta = document.getElementById('remarksInput');
      var b = currentBranch();
      if (!ta || !b) return;
      var savedVal = state.selected['Auditor Remarks'] || '';
      if (ta.value === savedVal) return; // nothing changed since last save
      handleSaveRemarks();
    }, REMARKS_AUTOSAVE_DELAY_MS);
  }

  // ---- Speech-to-text for Auditor Remarks ----
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micSupported = !!SpeechRecognitionCtor;
  var micRecognizer = null;
  var micBaseText = ''; // remarks text as it was when recording started

  function micToolbarHtml(){
    if (!micSupported){
      return '<div class="mic-hint err mic-standalone-hint">Voice dictation isn\'t supported in this browser. Try Chrome or Edge.</div>';
    }
    var hint = '';
    if (state.micRecording) hint = '<div class="mic-hint mic-standalone-hint">Listening… speak naturally, tap the mic to stop.</div>';
    else if (state.micError) hint = '<div class="mic-hint err mic-standalone-hint">' + esc(state.micError) + '</div>';
    return hint;
  }

  // Small round mic icon embedded inside the remarks textarea itself
  // (top-left corner) instead of a separate full-width button above it.
  function micButtonHtml(){
    if (!micSupported) return '';
    var label = state.micRecording ? 'Stop dictation' : 'Dictate remarks';
    return (
      '<button type="button" class="mic-btn-embedded' + (state.micRecording ? ' recording' : '') + '" id="micBtn" title="' + esc(label) + '" aria-label="' + esc(label) + '">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>' +
      '</button>'
    );
  }

  function stopMic(){
    if (micRecognizer){
      try{ micRecognizer.stop(); }catch(e){}
    }
    state.micRecording = false;
    state.micInterim = '';
    releaseMicStream();
  }

  var micStream = null; // keeps the getUserMedia track open while dictating

  function micPermissionDeniedMessage(){
    // file:// pages can't show a permission prompt at all in most browsers —
    // give a message that explains that instead of a generic "blocked" one.
    if (location.protocol === 'file:'){
      return 'This page was opened directly from a file, so the browser won\'t show a mic permission prompt. Open it through a web address (http/https) instead, then allow the mic when asked.';
    }
    return 'Microphone access was blocked. Click the padlock/site-info icon next to the address bar, allow Microphone for this page, then tap the mic again.';
  }

  function startMic(){
    if (!micSupported){
      state.micError = 'Voice dictation isn\'t supported in this browser.';
      renderKeepScroll();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      state.micError = micPermissionDeniedMessage();
      renderKeepScroll();
      return;
    }

    state.micError = '';
    renderKeepScroll();

    // Explicitly ask for mic permission first. This is what actually triggers
    // the browser's "Allow microphone?" prompt on a direct tap; some browsers
    // won't reliably show that prompt from SpeechRecognition.start() alone.
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        micStream = stream;
        beginRecognition();
      })
      .catch(function(err){
        state.micRecording = false;
        if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')){
          state.micError = micPermissionDeniedMessage();
        } else if (err && err.name === 'NotFoundError'){
          state.micError = 'No microphone was found on this device.';
        } else {
          state.micError = 'Could not access the microphone (' + (err && err.name ? err.name : 'unknown error') + ').';
        }
        renderKeepScroll();
      });
  }

  function beginRecognition(){
    var ta = document.getElementById('remarksInput');
    micBaseText = ta ? ta.value : '';
    if (micBaseText && !/\s$/.test(micBaseText)) micBaseText += ' ';

    micRecognizer = new SpeechRecognitionCtor();
    micRecognizer.lang = 'en-PH';
    micRecognizer.continuous = true;
    micRecognizer.interimResults = true;

    micRecognizer.onresult = function(event){
      var finalChunk = '';
      var interimChunk = '';
      for (var i = event.resultIndex; i < event.results.length; i++){
        var res = event.results[i];
        if (res.isFinal) finalChunk += res[0].transcript;
        else interimChunk += res[0].transcript;
      }
      if (finalChunk){
        micBaseText += finalChunk.trim() + ' ';
      }
      var taEl = document.getElementById('remarksInput');
      if (taEl) taEl.value = micBaseText;
      var micB = currentBranch();
      if (micB && state.selected) saveDraft(micB.branch, state.selected._row, micBaseText);
      state.micInterim = interimChunk.trim();
      var interimDiv = document.querySelector('.mic-interim');
      if (interimDiv) interimDiv.textContent = state.micInterim ? ('Hearing: "' + state.micInterim + '"') : '';
    };

    micRecognizer.onerror = function(event){
      state.micRecording = false;
      state.micInterim = '';
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        state.micError = micPermissionDeniedMessage();
      } else if (event.error === 'no-speech'){
        state.micError = 'No speech detected — tap the mic and try again.';
      } else {
        state.micError = 'Dictation stopped (' + event.error + ').';
      }
      releaseMicStream();
      renderKeepScroll();
    };

    micRecognizer.onend = function(){
      // Browsers auto-stop after a pause; restart seamlessly if the user hasn't pressed Stop.
      if (state.micRecording){
        try{ micRecognizer.start(); }catch(e){}
      } else {
        releaseMicStream();
        renderKeepScroll();
      }
    };

    try{
      micRecognizer.start();
      state.micRecording = true;
      state.micError = '';
      state.micInterim = '';
      renderKeepScroll();
    }catch(e){
      state.micError = 'Could not start the microphone.';
      releaseMicStream();
      renderKeepScroll();
    }
  }

  function releaseMicStream(){
    if (micStream){
      try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      micStream = null;
    }
  }

  function handleMicToggle(){
    if (state.micRecording) stopMic();
    else startMic();
    renderKeepScroll();
  }

  function esc(s){
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Grows a .report-line-textarea to fit its current content instead of
  // scrolling internally, so a long checklist line / finding / remark is
  // always fully visible (no dragging left-right the way the old
  // single-line <input> forced you to). Reset height to 'auto' first so
  // shrinking (e.g. after deleting text) is picked up too, not just growth.
  function autoGrowTextarea(el){
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // Looks up a value on a row object by name, tolerating differences in
  // capitalization/spacing between the code's expected field name and the
  // actual column header text that came from the sheet (e.g. "Total Due
  // this Month" vs "Total Due This Month"). Falls back to the exact key
  // first (fast path), then does a normalized case-insensitive match.
  function getField(r, name){
    if (!r) return '';
    if (r.hasOwnProperty(name)) return r[name];
    var norm = String(name).toLowerCase().replace(/\s+/g, ' ').trim();
    for (var k in r){
      if (!r.hasOwnProperty(k)) continue;
      if (String(k).toLowerCase().replace(/\s+/g, ' ').trim() === norm) return r[k];
    }
    return '';
  }

  // "Beg Bal" is imported under several possible header spellings
  // (see doImport) because different branch tabs use different column
  // names for it. Try them all so the value doesn't go missing just
  // because a hardcoded 'Beg Bal' lookup doesn't match that tab's header.
  var BEG_BAL_ALIASES = ['Beg Bal', 'Beginning Balance', 'Remaining Balance', 'Beginning Balance/Remaining Balance'];
  function getBegBal(r){
    for (var i = 0; i < BEG_BAL_ALIASES.length; i++){
      var v = getField(r, BEG_BAL_ALIASES[i]);
      if (v !== '' && v !== undefined && v !== null) return v;
    }
    return '';
  }

  // The monthly-due amount is imported into a column literally titled
  // "Due This Month" (see doImport, col I) — not "Total Due this Month".
  // The drawer happens to work regardless because it just lists whatever
