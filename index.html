  // headers exist on the sheet, but the table looked up the wrong exact
  // name and always showed "—". Try every spelling actually in use so the
  // table stops losing this value.
  var TOTAL_DUE_ALIASES = ['Total Due this Month', 'Total Due This Month', 'Due This Month', 'Due this Month'];
  function getTotalDue(r){
    for (var i = 0; i < TOTAL_DUE_ALIASES.length; i++){
      var v = getField(r, TOTAL_DUE_ALIASES[i]);
      if (v !== '' && v !== undefined && v !== null) return v;
    }
    return '';
  }

  // Turns a raw date value (Date object, "2026-05-09", or a serial number
  // from a spreadsheet) into a short, readable "May 9, 2026" style string.
  // Falls back to the original value untouched if it can't be parsed.
  function fmtDatePretty(val){
    var d = null;
    if (val instanceof Date){
      d = val;
    } else if (typeof val === 'number'){
      // Google Sheets/Excel serial date (days since 1899-12-30)
      d = new Date(Math.round((val - 25569) * 86400 * 1000));
    } else {
      var s = String(val).trim();
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      else {
        var parsed = new Date(s);
        if (!isNaN(parsed.getTime())) d = parsed;
      }
    }
    if (!d || isNaN(d.getTime())) return val;
    return d.toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });
  }

  // Same parsing rules as fmtDatePretty() above (Date object, serial
  // number, or a string), but returns 'YYYY-MM-DD' -- the one format
  // <input type="date"> actually accepts -- instead of a display string.
  // Used to seed the Date of Audit picker from whatever's already saved.
  function toISODateForInput(val){
    if (val === undefined || val === null || val === '') return '';
    var d = null;
    if (val instanceof Date){
      d = val;
    } else if (typeof val === 'number'){
      d = new Date(Math.round((val - 25569) * 86400 * 1000));
    } else {
      var s = String(val).trim();
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      else {
        var parsed = new Date(s);
        if (!isNaN(parsed.getTime())) d = parsed;
      }
    }
    if (!d || isNaN(d.getTime())) return '';
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  var DATE_FIELD_NAMES = {'si date':1, 'date of audit':1, 'last payment':1};

  function fmtValue(key, val){
    if (val === undefined || val === null || val === '') return '—';
    var kNorm = String(key).toLowerCase().replace(/\s+/g, ' ').trim();
    if (DATE_FIELD_NAMES[kNorm]) return fmtDatePretty(val);
    if (kNorm === 'terms'){
      var n = Number(val);
      if (!isNaN(n) && String(val).trim() !== ''){
        return n.toLocaleString('en-PH') + ' month' + (n === 1 ? '' : 's');
      }
      return val;
    }
    var k = kNorm;
    // "Due Day" is a calendar day-of-month (e.g. the 30th), not an
    // amount — exclude it explicitly before the general "due" match
    // below, or it would wrongly get a peso sign.
    if (k === 'due day'){
      return typeof val === 'number' ? val.toLocaleString('en-PH') : val;
    }
    // Beg Bal (and the other amount columns) sometimes arrive as real
    // numbers and sometimes as plain strings straight from the sheet
    // (e.g. "5000" or "5,000.00") depending on how that branch's tab was
    // typed, and its header can itself be spelled a few different ways
    // ("Beg Bal", "Beg. Bal", "BegBal", "Beginning Balance", ...). Match
    // loosely on the letters alone (whitespace/punctuation stripped) so
    // any of those spellings is still recognized as a money field, then
    // parse either a number or a numeric-looking string into one so the
    // ₱ sign always gets applied.
    var kBare = k.replace(/[^a-z]/g, '');
    var isMoneyField = k.indexOf('balance') > -1 || k.indexOf('due') > -1 || k.indexOf('payment') > -1 ||
        k.indexOf('advance') > -1 || k.indexOf('penalty') > -1 || k === 'ma' ||
        kBare === 'begbal' || kBare === 'beginningbalance' || kBare === 'remainingbalance';
    if (isMoneyField){
      var num = typeof val === 'number' ? val : Number(String(val).replace(/[₱,\s]/g, ''));
      if (!isNaN(num) && String(val).trim() !== ''){
        return '₱' + num.toLocaleString('en-PH', {maximumFractionDigits:2});
      }
      return val;
    }
    if (typeof val === 'number'){
      return val.toLocaleString('en-PH');
    }
    return val;
  }

  function statusClass(val){
    if (!val) return 'default';
    var v = String(val).toLowerCase();
    if (v.indexOf('good') > -1 || v.indexOf('paid') > -1 || v.indexOf('current') > -1) return 'good';
    if (v.indexOf('bad') > -1 || v.indexOf('delay') > -1 || v.indexOf('overdue') > -1 || v.indexOf('default') > -1) return 'bad';
    return 'default';
  }

  function unitStatusClass(val){
    if (!val) return 'default';
    var v = String(val).toLowerCase();
    if (v.indexOf('good') > -1) return 'unit-good';
    if (v.indexOf('not confirmed') > -1) return 'unit-notconfirmed';
    if (v.indexOf('missing') > -1) return 'unit-missing';
    if (v.indexOf('total wreck') > -1) return 'unit-wreck';
    if (v.indexOf('impounded') > -1) return 'unit-impounded';
    if (v.indexOf('pulled out') > -1) return 'unit-pulledout';
    if (v.indexOf('tracing') > -1) return 'unit-tracing';
    if (v.indexOf('car-napped') > -1 || v.indexOf('carnapped') > -1) return 'unit-carnapped';
    if (v.indexOf('damage') > -1) return 'unit-damage';
    return 'default';
  }

  // ---- Auditor-remarks row-highlight severity ----
  // Once a customer has an Auditor Remark saved, the whole row gets
  // tinted (see the .sev-* CSS rules) so a supervisor can scan the
  // list and immediately see which accounts need attention.
  //
  // Since remarks only ever get written on already-problematic
  // accounts (OD/DEL/RSTR — never on BNEW-CU/BNEW-ADV), the category
  // alone can't tell "not so bad" from "very bad": almost every row
  // would land in the same bucket. So the color is driven mainly by
  // the Outstanding Balance amount, with a few automatic overrides
  // for things that are serious no matter the balance:
  //   'red'    - Unit status says missing/wreck/impounded/tracing/
  //              car-napped/damage/pulled out, OR status is DEL
  //              (delinquent) or REPO (repossessed), OR Outstanding
  //              Balance is at/above BALANCE_HIGH_THRESHOLD.
  //   'orange' - Outstanding Balance is between the two thresholds
  //              (moderate arrears).
  //   'green'  - Outstanding Balance is at/below BALANCE_LOW_THRESHOLD
  //              (zero, negative/credit, or just a small amount) —
  //              i.e. technically overdue but not really a problem.
  //   ''       - none of the above signals are present; row stays
  //              the default white even if remarks exist.
  //
  // Adjust the two numbers below to match what actually counts as
  // "high" vs "low" balance for your branches.
  var BALANCE_HIGH_THRESHOLD = 5000; // ≥ this => red ("mataas ang balance")
  var BALANCE_LOW_THRESHOLD  = 2000; // ≤ this => green ("hindi masyadong problematic")
  var UNIT_STATUS_RED_RE = /missing|total wreck|impounded|tracing|car-?napped|damage|pulled out/i;
  function parseAmountLoose(val){
    if (val === undefined || val === null || val === '') return NaN;
    if (typeof val === 'number') return val;
    return Number(String(val).replace(/[₱,\s]/g, ''));
  }
  function rowSeverity(r){
    var custStatus = String(r['Customer Status'] || '').toUpperCase().trim();
    var unitStatus = String(getField(r, 'Unit status') || '');
    // Serious regardless of balance.
    if (UNIT_STATUS_RED_RE.test(unitStatus)) return 'red';
    if (/-\s*DEL\b/.test(custStatus) || /^REPO\s*-/.test(custStatus)) return 'red';

    var bal = parseAmountLoose(getField(r, 'Outstanding Balance'));
    if (!isNaN(bal)){
      if (bal >= BALANCE_HIGH_THRESHOLD) return 'red';
      if (bal <= BALANCE_LOW_THRESHOLD) return 'green';
      return 'orange';
    }
    // No usable balance figure on this row -- fall back to category alone.
    if (/-\s*OD\b/.test(custStatus) || /^RSTR\s*-/.test(custStatus)) return 'orange';
    if (/^BNEW\s*-\s*(ADV|CU)\b/.test(custStatus)) return 'green';
    return '';
  }

  function paymentModeClass(val){
    if (!val) return 'default';
    var v = String(val).toLowerCase();
    if (v.indexOf('branch') > -1) return 'pay-branch';
    if (v.indexOf('field') > -1) return 'pay-field';
    if (v === 'n/a' || v.indexOf('n/a') > -1) return 'pay-na';
    if (v === 'ip') return 'pay-ip';
    if (v.indexOf('online') > -1) return 'pay-online';
    return 'default';
  }

  function fmtClock(d){
    return d.toLocaleTimeString('en-PH', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true }) +
      ' · ' + d.toLocaleDateString('en-PH', { month:'short', day:'numeric' });
  }

  function fmtSyncAgo(d){
    if (!d) return 'Not synced yet';
    var diffSec = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
    if (diffSec < 5) return 'Synced just now';
    if (diffSec < 60) return 'Synced ' + diffSec + 's ago';
    var diffMin = Math.round(diffSec / 60);
    if (diffMin < 60) return 'Synced ' + diffMin + 'm ago';
    var diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return 'Synced ' + diffHr + 'h ago';
    return 'Synced ' + d.toLocaleDateString('en-PH', { month:'short', day:'numeric' });
  }

  function syncAgeClass(d){
    if (!d) return '';
    var diffMin = (Date.now() - d.getTime()) / 60000;
    if (diffMin < 2) return 'fresh';
    if (diffMin < 15) return 'ok';
    return 'stale';
  }

  function fmtFullTimestamp(d){
    return d.toLocaleString('en-PH', { dateStyle:'medium', timeStyle:'medium' });
  }

  function qkey(branch, row, field){ return branch + '::' + row + '::' + field; }

  function rowHasPending(branch, row){
    return state.pendingQueue.some(function(i){ return i.branch === branch && i.row === row; });
  }

  // ---- Local persistence layer ----
  // Uses real browser localStorage so data survives page reloads, the
  // back button, closing the tab/app, or losing connectivity — none of
  // which a page-memory-only store would survive. Falls back to an
  // in-memory object if localStorage is unavailable (e.g. private mode
  // with storage disabled), so the app never throws.
  var LS_PREFIX = 'auditDashboard::';
  var memoryFallback = {};
  function lsGet(key){
    try{
      var v = window.localStorage.getItem(LS_PREFIX + key);
      return v === null ? undefined : v;
    }catch(e){
      return memoryFallback[key];
    }
  }
  function lsSet(key, value){
    try{ window.localStorage.setItem(LS_PREFIX + key, value); return true; }
    catch(e){ memoryFallback[key] = value; return false; }
  }

  async function persistPendingQueue(){
    lsSet('pending-writes', JSON.stringify(state.pendingQueue));
  }

  // ---- Full dataset persistence ----
  // Whatever was last successfully loaded from the Google Sheet is saved to
  // localStorage, so that closing/backgrounding the app (even long enough
  // for Android to kill it) and reopening it -- with or without a
  // connection -- shows the last-known data immediately instead of a blank
  // "you're offline" screen. Pending local edits are re-applied on top so
  // nothing typed while offline is ever lost or overwritten by stale data.
  function saveCachedBranches(){
    try{
      lsSet('cached-branches', JSON.stringify(state.branches));
      lsSet('cached-branches-time', new Date().toISOString());
    }catch(e){ /* storage full or unavailable - safe to ignore, in-memory data still works */ }
  }
  function loadCachedBranches(){
    var v = lsGet('cached-branches');
    if (!v) return false;
    try{
      var parsed = JSON.parse(v);
      if (Array.isArray(parsed) && parsed.length){
        state.branches = parsed;
        var t = lsGet('cached-branches-time');
        if (t){ state.lastSynced = new Date(t); }
        return true;
      }
    }catch(e){}
    return false;
  }

  // ---- Remarks draft persistence ----
  // Whatever the auditor types into the remarks box is saved to localStorage
  // on every keystroke, separate from the "Save remarks" action. This means
  // that if the tab is closed, the app is backgrounded, or the connection
  // drops before the auditor taps Save, the typed text is still there the
  // next time this record is opened -- online or offline. The draft is only
  // cleared once "Save remarks" is actually pressed.
  function draftKey(branch, row){ return 'draft::' + branch + '::' + row; }
  function saveDraft(branch, row, value){ lsSet(draftKey(branch, row), value); }
  function loadDraft(branch, row){
    var v = lsGet(draftKey(branch, row));
    return (v === undefined) ? null : v;
  }
  function clearDraft(branch, row){
    try{ window.localStorage.removeItem(LS_PREFIX + draftKey(branch, row)); }
    catch(e){ delete memoryFallback[draftKey(branch, row)]; }
  }

  async function loadPendingQueue(){
    var v = lsGet('pending-writes');
    if (v){ try{ state.pendingQueue = JSON.parse(v) || []; }catch(e){ state.pendingQueue = []; } }
  }

  function queueWrite(branch, row, field, value, label, previousValue){
    var key = qkey(branch, row, field);
    state.pendingQueue = state.pendingQueue.filter(function(i){ return qkey(i.branch, i.row, i.field) !== key; });
    state.pendingQueue.push({ branch:branch, row:row, field:field, value:value, label:label, ts:Date.now(), previousValue: previousValue });
    persistPendingQueue();
    // Try to sync immediately instead of waiting for the next timer tick —
    // this is what makes changes go out fast when the connection is fine.
    if (!isOffline()) flushQueue();
  }

  // expectedTs (optional): when provided, only removes the queued entry if
  // its ts still matches the one that was actually sent to the sheet. This
  // matters because flushQueue() takes a snapshot of the queue before its
  // network requests go out — if the same branch/row/field gets edited
  // again (a new queueWrite(), with a new ts) while the earlier value for
  // that same key is still in flight, that earlier request finishing
  // successfully must NOT delete the newer, not-yet-synced edit sitting in
  // state.pendingQueue. Callers that save the CURRENT value directly
  // (not from a stale snapshot) can omit expectedTs and keep the old
  // remove-by-key-only behavior, since there's no staleness risk there.
  function unqueueWrite(branch, row, field, expectedTs){
    var key = qkey(branch, row, field);
    state.pendingQueue = state.pendingQueue.filter(function(i){
      if (qkey(i.branch, i.row, i.field) !== key) return true; // keep, different field
      if (expectedTs !== undefined && i.ts !== expectedTs) return true; // keep, superseded by a newer edit
      return false; // remove, this is the entry that was just synced
    });
    persistPendingQueue();
  }

  // ---- Reports queue (Draft Report / Audit Sheet cloud autosave) ----
  // Same idea as pendingQueue/queueWrite/unqueueWrite above, but for the
  // separate "reports backend" (state.reportsUrl). Before this, a failed
  // autosave push (offline, weak mobile signal, a slow/cold Apps Script
  // deployment, etc.) just silently gave up -- the form stayed safe in
  // localStorage on THIS device, but nothing ever retried sending it to
  // Google Sheets on its own; it only synced again the next time the
  // auditor happened to type another character (triggering a fresh
  // autosave) while actually online. Now a failed push is queued here,
  // keyed by (type, branch) so only the LATEST snapshot of a given
  // report is ever kept pending -- a burst of keystrokes while offline
  // doesn't pile up dozens of stale queue entries, just one up-to-date one.
  function rqkey(type, branch){ return type + '::' + branch; }

  async function persistReportsQueue(){
    lsSet('pending-reports-writes', JSON.stringify(state.reportsPendingQueue));
  }
  async function loadReportsPendingQueue(){
    var v = lsGet('pending-reports-writes');
    if (v){ try{ state.reportsPendingQueue = JSON.parse(v) || []; }catch(e){ state.reportsPendingQueue = []; } }
  }
  function queueReportsWrite(type, branch, form){
    var key = rqkey(type, branch);
    state.reportsPendingQueue = state.reportsPendingQueue.filter(function(i){ return rqkey(i.type, i.branch) !== key; });
    state.reportsPendingQueue.push({ type: type, branch: branch, form: form, ts: Date.now() });
    persistReportsQueue();
    if (!isOffline()) flushReportsQueue();
  }
  function unqueueReportsWrite(type, branch, expectedTs){
    var key = rqkey(type, branch);
    state.reportsPendingQueue = state.reportsPendingQueue.filter(function(i){
      if (rqkey(i.type, i.branch) !== key) return true;
      if (expectedTs !== undefined && i.ts !== expectedTs) return true; // superseded by a newer autosave
      return false;
    });
    persistReportsQueue();
  }

  // Closes the customer detail view by walking browser history back one
  // step (consuming the entry pushed when it was opened) rather than
  // clearing state directly. This keeps history and what's on screen in
  // sync, so the back button/gesture and the on-screen X/overlay-tap all
  // behave the same way.
  function closeDetail(){
    if (state.selected){ history.back(); }
  }

  // ---- Overlay/modal back-button fix ----
  // Modals like Draft Report, Audit Sheet, and their Preview panes used
  // to just be shown/hidden by flipping a state flag, with no matching
  // browser-history entry. On a phone, pressing the hardware/gesture
  // back button while one of these was open had no history entry of
  // its own to consume -- so the OS handed the back action to the app
  // shell itself, which closed/reloaded the whole app instead of just
  // dismissing the modal. This mirrors the same pushState/popstate
  // pattern already used for the customer detail view (closeDetail
  // above), generalized with a small stack so nested modals (e.g. the
  // Preview pane opened on top of Draft Report) unwind one layer at a
  // time.
  //
  // openOverlay(flagName): call right after setting state[flagName] =
  // true, so the browser now has a history entry to "consume" for that
  // layer.
  // closeOverlay(flagName): call from every UI close action (X button,
  // "Close" button, tap-outside) INSTEAD of setting the flag to false
  // directly -- it asks the browser to go back one step, and the
  // popstate handler below is what actually flips the flag off. This
  // keeps a UI-triggered close and a physical back-button close
  // perfectly in sync, so neither one leaves a stale history entry or
  // closes the wrong layer.
  function openOverlay(flagName){
    state.overlayStack.push(flagName);
    try { history.pushState({ overlay: flagName }, ''); } catch(e){}
  }
  function closeOverlay(flagName){
    var idx = state.overlayStack.lastIndexOf(flagName);
    if (idx === -1){
      // Already closed/out of sync somehow -- just flip it off directly
      // so the UI never gets stuck.
      state[flagName] = false; render();
      return;
    }
    history.back();
  }
  window.addEventListener('popstate', function(){
    if (state.selected){
      stopMic();
      state.selected = null;
      state.openPicker = '';
      render();
      return;
    }
    if (state.overlayStack.length){
      var flagName = state.overlayStack.pop();
      state[flagName] = false;
      render();
    }
  });


  function applyPendingToBranches(){
    state.pendingQueue.forEach(function(item){
      var b = state.branches.find(function(x){ return x.branch === item.branch; });
      if (!b) return;
      var r = b.rows.find(function(x){ return x._row === item.row; });
      if (r) r[item.field] = item.value;
    });
  }

  function syncStatusInfo(){
    if (!state.online){
      return {
        dotClass: 'stale',
        text: 'Offline' + (state.pendingQueue.length ? ' · ' + state.pendingQueue.length + ' pending' : ''),
        title: state.pendingQueue.length
          ? state.pendingQueue.length + ' change(s) saved on this device — will sync once you\'re back online.'
          : 'No internet connection right now.'
      };
    }
    if (state.pendingQueue.length){
      return {
        dotClass: 'syncing',
        text: 'Syncing ' + state.pendingQueue.length + ' change' + (state.pendingQueue.length > 1 ? 's' : '') + '...',
        title: 'Sending changes saved on this device to your Google Sheet.'
      };
    }
    return {
      dotClass: syncAgeClass(state.lastSynced),
      text: fmtSyncAgo(state.lastSynced),
      title: state.lastSynced ? 'Last updated ' + fmtFullTimestamp(state.lastSynced) : ''
    };
  }

  function tickClock(){
    var clockEl = document.getElementById('liveClock');
    if (clockEl) clockEl.textContent = fmtClock(new Date());
    var agoEl = document.getElementById('syncAgo');
    var dotEl = document.getElementById('syncDot');
    var dotMobileEl = document.getElementById('syncDotMobile');
    if (agoEl || dotEl || dotMobileEl){
      var info = syncStatusInfo();
      if (agoEl){ agoEl.textContent = info.text; agoEl.title = info.title; }
      if (dotEl) dotEl.className = 'sync-dot ' + info.dotClass;
      // Mobile-only dot under the logo (replaces the clock/date row there —
      // see .mobile-sync-indicator) carries the same title text as the
      // desktop one, so tapping/holding it still explains the status.
      if (dotMobileEl){ dotMobileEl.className = 'sync-dot ' + info.dotClass; dotMobileEl.title = info.text + (info.title ? ' — ' + info.title : ''); }
    }
  }

  var clockStarted = false;
  var tickCount = 0;
  function startClock(){
    if (clockStarted) return;
    clockStarted = true;
    tickClock();
    setInterval(function(){
      // FIX: `state.online` used to only get refreshed from the browser's
      // native 'online'/'offline' events, or from the visibilitychange/
      // pageshow handlers below -- never on a plain timer. On a phone with
      // a weak/flaky cellular signal, navigator.onLine almost always stays
      // TRUE the whole time (the OS still sees an active connection; it's
      // just that requests are slow or intermittently fail), so the native
      // 'online' event never fires again once a save attempt has already
      // set state.online = false after a timeout/network error. If the
      // auditor then just leaves the tab open and in the foreground
      // (never backgrounds/reopens it, which is the only other thing that
      // re-checks this), NOTHING was resetting state.online back to true
      // -- which in turn meant the automatic retry two lines below
      // (`tickCount % 2 === 0 && state.online && ...`) could never fire
      // again on its own. A queued remark/status change would then just
      // sit there forever, only going out if the auditor happened to tap
      // "Sync now", background/reopen the app, or reload the page -- easy
      // to miss, especially mid-audit in a low-signal area. Re-deriving
      // state.online from the SAME authoritative check (isOffline(), via
      // syncOnlineState()) every single tick makes it self-healing: it can
      // never stay stuck stale for more than ~1 second, with or without an
      // explicit browser event.
      var wasOnline = state.online;
      syncOnlineState();
      if (state.online !== wasOnline) render(); // keep the "You're offline" banner in sync even when nothing else triggers a re-render

      tickClock();
      tickCount++;
      // Retry every 2s instead of 4s/15s so queued changes go out faster.
      if (tickCount % 2 === 0 && state.online && state.pendingQueue.length){ flushQueue(); }
      if (tickCount % 2 === 0 && state.online && state.reportsPendingQueue.length){ flushReportsQueue(); }
      var readyToRefresh = state.online && !state.loading && !state.selected && document.visibilityState === 'visible';
      if (state._syncWasFailing){
        // While a sync is actively failing, retry sooner than the normal
        // 30s cadence (5s, then 10s, then 20s, capped at 30s) so a fixed
        // Web app URL / access setting / temporary network blip recovers
        // quickly instead of leaving a stale "Sync failed" state sitting
        // around for up to half a minute.
        if (!state._retryDelayMs) state._retryDelayMs = 5000;
        if (readyToRefresh && (tickCount % Math.round(state._retryDelayMs / 1000)) === 0){
          state._retryDelayMs = Math.min(state._retryDelayMs * 2, 30000);
          fetchData({ silent: true });
        }
      } else if (tickCount % 30 === 0 && readyToRefresh){
        // Light background refresh every 30s so everyone sees fresh data
        // without tapping the sync button — silent (no spinner, no rebuild
        // unless data actually changed) so it doesn't cause the periodic
        // full-page flicker. Skipped while a record is open so it doesn't
        // interrupt someone mid-edit, and while offline.
        fetchData({ silent: true });
      }
    }, 1000);
  }

  // A genuine browser reconnect always wins over a manual "go offline"
  // tap -- there's no point staying in forced-offline mode once the
  // device is verifiably back online, so this also clears manualOffline.
  window.addEventListener('online', function(){
    state.manualOffline = false;
    syncOnlineState();
    flushQueue();
    flushReportsQueue();
    fetchData();
    render();
  });
  window.addEventListener('offline', function(){
    syncOnlineState(); // isOffline() already returns true here regardless of manualOffline
    render();
  });

  // Mobile browsers suspend timers when a tab/app is backgrounded, so the
  // 4s retry above can stall for a while. Catch back up the moment the
  // page becomes visible again (switching apps, unlocking the phone,
  // coming back from the browser's back/forward cache) or regains focus.
  // IMPORTANT: this must go through isOffline()/syncOnlineState() rather
  // than reading navigator.onLine directly -- otherwise a manual "go
  // offline" tap got silently wiped out the instant the tab regained
  // visibility (e.g. switching apps and back), even though nothing about
  // real connectivity had changed. That was the actual bug: the logo said
  // "Offline" but the very next visibility/focus tick quietly forced
  // state.online back to true.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){
      syncOnlineState();
      if (state.online){ flushQueue(); flushReportsQueue(); fetchData(); }
      render();
    }
  });
  window.addEventListener('pageshow', function(){
    syncOnlineState();
    if (state.online){ flushQueue(); flushReportsQueue(); fetchData(); }
    render();
  });
  // FIX: this used to check the (possibly stale) `state.online` directly
  // instead of re-deriving it via syncOnlineState() first, unlike the
  // visibilitychange/pageshow handlers right above it. In practice the 1s
  // tick in startClock() now keeps state.online fresh regardless (see the
  // comment there), so this was mostly latent, but re-syncing here too
  // keeps all three "the app just became active again" handlers
  // consistent and correct even if that tick is ever changed later.
  window.addEventListener('focus', function(){
    var wasOnline = state.online;
    syncOnlineState();
    if (state.online !== wasOnline) render();
    if (state.online){ flushQueue(); flushReportsQueue(); }
  });
  // Best-effort final attempt if the page is closed/backed-out of while a
  // save is still in flight or queued.
  window.addEventListener('pagehide', function(){
    if (!isOffline()){
      if (state.pendingQueue.length) flushQueue();
      if (state.reportsPendingQueue.length) flushReportsQueue();
    }
  });

  async function loadUrl(){
    var v = lsGet('apps-script-url');
    if (v) state.url = v;
    else await saveUrl(DEFAULT_URL);
  }
  async function saveUrl(u){
    lsSet('apps-script-url', u);
  }

  // ---- Reports backend (Draft Report / Audit Sheet) URL ----
  async function loadReportsUrl(){
    var v = lsGet('reports-script-url');
    if (v) state.reportsUrl = v;
    else await saveReportsUrl(DEFAULT_REPORTS_URL);
  }
  async function saveReportsUrl(u){
    state.reportsUrl = u || '';
    lsSet('reports-script-url', u || '');
  }

  // ---- Google Sheet "preview" link ----
  // The app only talks to the Apps Script Web app URL, which isn't
  // something a person can open in a browser to see the actual sheet.
  // This stores the real Google Sheet URL (the one from the browser's
  // address bar when the sheet itself is open) purely so the Preview
  // button below can open it in a new tab.
  async function loadSheetViewUrl(){
    var v = lsGet('sheet-view-url');
    if (v) state.sheetViewUrl = v;
  }
  async function saveSheetViewUrl(u){
    lsSet('sheet-view-url', u);
  }

  async function fetchData(opts){
    var silent = !!(opts && opts.silent);
    if (isOffline()){
      syncOnlineState();
      if (!state.branches.length){
        // No cache and no connection - genuinely nothing to show yet.
        state.error = 'You appear to be offline and no data has been loaded on this device yet. Connect to the internet once to load data, then it will keep working offline from then on.';
      } else {
        // We have last-known data (from this session or from the on-device
        // cache) - show it instead of an error, with any pending edits
        // already applied.
        state.error = '';
      }
      renderKeepScroll();
      return;
    }
    // Silent (background) refreshes don't flip on the loading spinner or
    // force a re-render before the fetch even starts — that pre-fetch
    // render was one of the main causes of the periodic full-page flicker,
    // since it fired every ~20s even when nothing on the sheet had changed.
    if (!silent){ state.loading = true; state.error = ''; renderKeepScroll(); }
    try{
      // cache:'no-store' plus a unique timestamp query param stop the
      // browser (and any service worker) from silently reusing an old
      // response for this same URL — without this, "Sync now" could look
      // like it did nothing because it was served a stale cached reply
      // instead of actually hitting the Apps Script backend.
      var fetchUrl = state.url + (state.url.indexOf('?') === -1 ? '?' : '&') + '_ts=' + Date.now();
      var res = await fetchWithTimeout(fetchUrl, { method:'GET', cache:'no-store' }, FETCH_TIMEOUT_MS);
      var data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not load data.');
      var newBranches = data.branches || [];
      // Skip the (expensive, flicker-causing) full re-render entirely when
      // the freshly-fetched data is identical to what's already on screen —
      // which, for a silent background refresh, is true most of the time.
      var changed = JSON.stringify(newBranches) !== JSON.stringify(state.branches);
      state.branches = newBranches;
      if (state.branches.length && !state.branches.some(function(b){ return b.branch === state.activeBranch; })){
        state.activeBranch = state.branches[0].branch;
        changed = true;
      }
      applyPendingToBranches();
      state.lastSynced = new Date();
      state.online = true;
      saveCachedBranches();
      if (state._syncWasFailing){
        // The previous sync attempt(s) had failed and this one succeeded —
        // let the bell reflect that the problem has resolved itself
        // instead of leaving the last-seen status stuck on "Failed".
        state._syncWasFailing = false;
        state._retryDelayMs = 0;
        resolveNotificationsByTitle('Sync failed');
        pushNotification('synced', 'Sync restored', 'Data loaded successfully from the Google Sheet after an earlier connection problem.', { status: 'resolved' });
      }
      if (silent && !changed){
        // Nothing visibly changed — just quietly update the "synced Xs ago"
        // label instead of rebuilding the whole screen.
        tickClock();
        return;
      }
    }catch(e){
      syncOnlineState();
      if (state.branches.length){
        // Keep showing the data we already have rather than replacing it with an error screen.
        state.error = '';
      } else {
        state.error = 'Could not connect to the Google Sheet. Make sure the Web app URL is correct and access is set to "Anyone". (' + e.message + ')';
      }
      state._syncWasFailing = true;
      if (!silent){
        var offlineNow = isOffline();
        pushNotification('error', 'Sync failed', 'Could not load data from the Google Sheet: ' + e.message, {
          status: 'failed',
          cause: offlineNow
            ? 'Your device currently has no internet connection.'
            : 'The dashboard could not reach the Google Sheet Web app — this usually means the Web app URL is wrong, the deployment\u2019s access isn\u2019t set to "Anyone", the Apps Script deployment was updated/redeployed without refreshing the URL here, or a temporary network problem. Details: ' + e.message,
          solution: offlineNow
            ? 'Reconnect to the internet, then tap the sync (refresh) button, or wait — the dashboard will keep retrying automatically and will sync as soon as you\u2019re back online.'
            : 'Open Connection settings and confirm the Web app URL matches the current Apps Script deployment with access set to "Anyone", then tap the sync (refresh) button to try again.'
        });
      }
    }
    state.loading = false;
    renderKeepScroll();
  }

  function updateLocalField(branch, row, field, value){
    var b = state.branches.find(function(x){ return x.branch === branch; });
    if (b){
      var r = b.rows.find(function(x){ return x._row === row; });
      if (r) r[field] = value;
    }
    if (state.selected && state.selected._row === row) state.selected[field] = value;
  }

  async function attemptRemoteSave(branch, row, field, value){
    var res;
    try{
      res = await fetchWithTimeout(state.url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ branch:branch, row:row, field:field, value:value }),
        keepalive: true
      }, FETCH_TIMEOUT_MS);
    }catch(networkErr){
      var e1 = new Error('offline');
      e1.isNetworkError = true;
      throw e1;
    }
    var data;
    try{ data = await res.json(); }catch(parseErr){
      var e2 = new Error('offline');
      e2.isNetworkError = true;
      throw e2;
    }
    if (!data.success) throw new Error(data.error || 'Could not save.');
    return true;
  }

  // Saves many {row, field, value} writes in a single request instead of
  // one request per field — this is what makes bulk imports (e.g. Aging 1)
  // fast, since the backend applies the whole batch in one Apps Script
  // execution instead of us waiting on hundreds of round trips.
  async function attemptRemoteBulkSave(branch, updates){
    var res;
    try{
      res = await fetchWithTimeout(state.url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'bulkUpdate', branch:branch, updates:updates }),
        keepalive: true
      }, 20000);
    }catch(networkErr){
      var e1 = new Error('offline');
      e1.isNetworkError = true;
      throw e1;
    }
    var data;
    try{ data = await res.json(); }catch(parseErr){
      var e2 = new Error('offline');
      e2.isNetworkError = true;
      throw e2;
    }
    if (!data.success) throw new Error(data.error || 'Could not save.');
    return data;
  }

  // Guards against re-entrancy: flushQueue() is called from many places
  // (the 2s retry tick, the 'online'/'focus'/'visibilitychange'/'pageshow'
  // events, queueWrite() itself, and the manual refresh button) with no
  // coordination between them. Without this flag, two of those calls could
  // run at the same time, each snapshot the queue independently, and both
  // send a request for the same item — wasteful at best, and combined with
  // an in-flight edit it's what let a newer, not-yet-synced value get
  // deleted out from under itself. Only one flush runs at a time now; a
  // trigger that fires while a flush is already in progress just no-ops,
  // since the in-progress flush's own tail call (or the next tick) will
  // pick up anything queued after it started.
  var flushInProgress = false;
  async function flushQueue(){
    if (flushInProgress) return;
    if (!state.pendingQueue.length) return;
    if (isOffline()) return;
    flushInProgress = true;
    try{
      await flushQueueOnce();
    } finally {
      flushInProgress = false;
    }
  }

  async function flushQueueOnce(){
    var queue = state.pendingQueue.slice();
    for (var i = 0; i < queue.length; i++){
      var item = queue[i];
      try{
        await attemptRemoteSave(item.branch, item.row, item.field, item.value);
        // Pass item.ts so a field edited again (new ts) while THIS request
        // was still in flight is never deleted — only the exact snapshot
        // we just sent gets removed; the newer, still-unsynced edit stays
        // queued and will go out on the next flush.
        unqueueWrite(item.branch, item.row, item.field, item.ts);
        if (item.field === 'Auditor Remarks'){
          var syncedName = customerNameFor(item.branch, item.row);
          pushRemarksLogEntry(item.branch, item.row, syncedName, item.value, 'synced', true, item.previousValue);
          pushNotification(
            'synced',
            'Offline remarks synced — ' + (syncedName || 'customer'),
            item.branch + ' • Saved to your Google Sheet.',
            { branch: item.branch, row: item.row, status: 'resolved' }
          );
        }
        if (state.selected && state.selected._row === item.row) render();
      }catch(e){
        if (e.isNetworkError){
          state.online = false;
          break;
        } else {
          // The device is online and reached the backend, but the sheet
          // itself rejected this particular save (bad data, a locked
          // sheet, a stale row, etc.) -- surface it instead of silently
          // discarding the queued change, since it can no longer sync on
          // its own.
          unqueueWrite(item.branch, item.row, item.field, item.ts);
          var failedName = customerNameFor(item.branch, item.row) || 'customer';
          pushNotification('error', 'Could not sync saved change — ' + failedName, item.branch + ' • ' + item.field + ': ' + e.message, {
            branch: item.branch, row: item.row,
            status: 'failed',
            cause: 'The change was saved on this device while offline, but once reconnected the Google Sheet backend rejected it — usually because the row or column no longer exists, the sheet is locked/protected, or the value is no longer valid. Details: ' + e.message,
            solution: 'Open this customer\u2019s record, check the ' + item.field + ' field, and re-enter/save it manually so it isn\u2019t lost.'
          });
        }
      }
    }
    render();
  }

  // ---- Reports queue flush (Draft Report / Audit Sheet) ----
  // Same shape as flushQueue/flushQueueOnce above, kept as its own
  // function (and its own in-flight guard) since it talks to a different
  // URL (state.reportsUrl) with a different payload -- a whole form, not
  // a single field -- and must never block on, or be blocked by, the main
  // sheet queue's flush.
  async function attemptRemoteReportsSave(type, branch, form, timeoutMs){
    var text = (type === 'saveDraftReport') ? buildReportPlainText(form) : buildAuditSheetPlainText(form);
    var res;
    try{
      res = await fetchWithTimeout(state.reportsUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: type, branch: branch, form: form, text: text })
      }, timeoutMs || 15000);
    }catch(networkErr){
      var e1 = new Error('offline');
      e1.isNetworkError = true;
      throw e1;
    }
    var data;
    try{ data = await res.json(); }catch(parseErr){
      var e2 = new Error('offline');
      e2.isNetworkError = true;
      throw e2;
    }
    if (!data.success) throw new Error(data.error || 'Could not save.');
    return true;
  }

  var reportsFlushInProgress = false;
  async function flushReportsQueue(){
    if (reportsFlushInProgress) return;
    if (!state.reportsPendingQueue.length) return;
    if (isOffline()) return;
    if (!state.reportsUrl) return; // nothing configured to sync to
    reportsFlushInProgress = true;
    try{ await flushReportsQueueOnce(); } finally { reportsFlushInProgress = false; }
  }

  async function flushReportsQueueOnce(){
    var queue = state.reportsPendingQueue.slice();
    for (var i = 0; i < queue.length; i++){
      var item = queue[i];
      var label = item.type === 'saveDraftReport' ? 'Draft Report' : 'Audit Sheet';
      try{
        await attemptRemoteReportsSave(item.type, item.branch, item.form);
        unqueueReportsWrite(item.type, item.branch, item.ts);
        // If this exact report is open right now, flip its "Saved to
        // Google Sheets" indicator on too, same as the explicit
        // handleSaveReportToSheet()/handleSaveAuditSheetToSheet() buttons
        // do -- otherwise the auditor would only ever see this sync
        // reflected in the Activity/notifications list, not on the
        // screen they're actually looking at.
        if (item.type === 'saveDraftReport' && state.reportForm && state.reportForm.branch === item.branch){
          state.reportCloudMsg = 'ok';
          setTimeout(function(){ if (state.reportCloudMsg === 'ok'){ state.reportCloudMsg = ''; render(); } }, 2500);
        }
        if (item.type === 'saveAuditSheet' && state.auditSheetForm && state.auditSheetForm.branch === item.branch){
          state.auditSheetCloudMsg = 'ok';
          setTimeout(function(){ if (state.auditSheetCloudMsg === 'ok'){ state.auditSheetCloudMsg = ''; render(); } }, 2500);
        }
        pushNotification(
          'synced',
          label + ' synced — ' + item.branch,
          item.branch + ' • Saved to Google Sheets after reconnecting.',
          { status: 'resolved' }
        );
      }catch(e){
        if (e.isNetworkError){
          state.online = false;
          break;
        } else {
          // Reachable but rejected (bad data, missing tab, locked sheet,
          // etc.) -- retrying the identical payload won't fix itself, so
          // surface it instead of quietly discarding it.
          unqueueReportsWrite(item.type, item.branch, item.ts);
          pushNotification('error', 'Could not sync ' + label + ' — ' + item.branch, item.branch + ' • ' + e.message, {
            status: 'failed',
            cause: 'The device is online and reached the reports backend, but it rejected the save — usually because the branch tab no longer exists there, the sheet is locked/protected, or the request timed out. Details: ' + e.message,
            solution: 'Open the ' + label + ' for ' + item.branch + ' and tap "Save to Google Sheets" again.'
          });
        }
      }
    }
    render();
  }

  async function handleSaveRemarks(){
    if (remarksAutoSaveTimer){ clearTimeout(remarksAutoSaveTimer); remarksAutoSaveTimer = null; }
    var val = document.getElementById('remarksInput').value;
    var b = currentBranch();
    var row = state.selected._row;
    // Snapshot the value as it was BEFORE this save overwrites it locally,
    // so the Activity log can show a before/after diff and offer "Undo".
    var prevVal = state.selected ? (state.selected['Auditor Remarks'] || '') : '';
    clearDraft(b.branch, row);
    state.savingRemarks = true; renderKeepScroll();
    updateLocalField(b.branch, row, 'Auditor Remarks', val);
    var custName = state.selected ? (state.selected['Customer Name'] || '') : '';
    try{
      if (isOffline()){ throw Object.assign(new Error('offline'), { isNetworkError:true }); }
      await attemptRemoteSave(b.branch, row, 'Auditor Remarks', val);
      unqueueWrite(b.branch, row, 'Auditor Remarks');
      state.remarksMsg = 'ok';
      state.online = true;
      // Saved straight to the sheet while online -- no notification needed
      // here since auto-save already covers that case, but it still goes
      // into the "Recent saved remarks" log for easy review.
      pushRemarksLogEntry(b.branch, row, custName, val, 'saved', false, prevVal);
    }catch(e){
      if (e.isNetworkError){
        state.online = false;
        queueWrite(b.branch, row, 'Auditor Remarks', val, 'Auditor remarks', prevVal);
        state.remarksMsg = 'queued';
        pushRemarksLogEntry(b.branch, row, custName, val, 'queued', true, prevVal);
        pushNotification(
          'offline',
          'Remarks saved offline — ' + (custName || 'customer'),
          b.branch + ' • Will sync automatically once you\'re back online.',
          {
            branch: b.branch, row: row,
            status: 'retrying',
            cause: 'This device had no internet connection at the moment of saving, so the remarks could not reach the Google Sheet.',
            solution: 'Nothing to do — the change is safely stored on this device and will sync automatically the next time you\u2019re online. You can check its status any time from this notifications panel.'
          }
        );
      } else {
        state.remarksMsg = 'err:' + e.message;
        pushNotification('error', 'Could not save remarks — ' + (custName || 'customer'), b.branch + ' • ' + e.message, {
          branch: b.branch, row: row,
          status: 'failed',
          cause: 'The device is online and reached the Google Sheet backend, but it rejected the save — usually because the row or column no longer exists, the sheet is locked/protected, or the request timed out. Details: ' + e.message,
          solution: 'Try saving again in a moment. If it keeps failing, check that the "' + b.branch + '" sheet tab and its Auditor Remarks column still exist and aren\u2019t locked, then retry.'
        });
      }
    }
    state.savingRemarks = false;
    renderKeepScroll();
    setTimeout(function(){ state.remarksMsg=''; renderKeepScroll(); }, 3500);
  }

  // ---- Undo (from the Activity list) ----
  // Restores the Auditor Remarks value a log entry had BEFORE it was
  // saved (entry.previousRemark), reusing the exact same online/offline
  // save path handleSaveRemarks() uses so an undo behaves identically —
  // it goes straight to the sheet when online, or queues and syncs later
  // when offline. The undo itself is then logged as its own new entry
  // (status 'reverted' / 'reverted-queued') so the Activity list stays an
  // honest, append-only history instead of rewriting/removing the past —
  // this also means an undo can itself be undone, any number of times.
  async function undoRemarksLogEntry(entryId){
    if (state.undoingEntryId) return; // one undo in flight at a time
    var entry = state.remarksLog.find(function(e){ return e.id === entryId; });
    if (!entry || typeof entry.previousRemark !== 'string' || entry.previousRemark === entry.remark) return;

    var branch = entry.branch, row = entry.row;
    var val = entry.previousRemark;
    var custName = entry.customerName || customerNameFor(branch, row) || '';

    state.undoingEntryId = entryId;
    renderKeepScroll();

    updateLocalField(branch, row, 'Auditor Remarks', val);
    // If this customer's drawer happens to be open right now, keep its
    // textarea (and any unsaved draft) in sync so the undo is visible
    // there immediately too, not just in the table/Activity list.
    var openBranch = currentBranch();
    if (state.selected && state.selected._row === row && openBranch && openBranch.branch === branch){
      var ta = document.getElementById('remarksInput');
      if (ta) ta.value = val;
      clearDraft(branch, row);
    }

    try{
      if (isOffline()){ throw Object.assign(new Error('offline'), { isNetworkError:true }); }
      await attemptRemoteSave(branch, row, 'Auditor Remarks', val);
      unqueueWrite(branch, row, 'Auditor Remarks');
      state.online = true;
      pushRemarksLogEntry(branch, row, custName, val, 'reverted', false, entry.remark);
    }catch(e){
      if (e.isNetworkError){
        state.online = false;
        queueWrite(branch, row, 'Auditor Remarks', val, 'Auditor remarks', entry.remark);
        pushRemarksLogEntry(branch, row, custName, val, 'reverted-queued', true, entry.remark);
        pushNotification(
          'offline',
          'Undo saved offline — ' + (custName || 'customer'),
          branch + ' • Will sync automatically once you\'re back online.',
          {
            branch: branch, row: row,
            status: 'retrying',
            cause: 'This device had no internet connection at the moment of undoing, so the reverted remarks could not reach the Google Sheet.',
            solution: 'Nothing to do — the change is safely stored on this device and will sync automatically the next time you\u2019re online.'
          }
        );
      } else {
        pushNotification('error', 'Could not undo change — ' + (custName || 'customer'), branch + ' • ' + e.message, {
          branch: branch, row: row,
          status: 'failed',
          cause: 'The device is online and reached the Google Sheet backend, but it rejected the undo — usually because the row or column no longer exists, the sheet is locked/protected, or the request timed out. Details: ' + e.message,
          solution: 'Open this customer\u2019s record and edit Auditor Remarks manually, then try Undo again from the Activity list.'
        });
      }
    }
    state.undoingEntryId = null;
    renderKeepScroll();
  }

  // "Already made a payment" quick-remark button. Now a real toggle:
  // tapping it when unmarked drops a standard, dated line into the
  // remarks box and saves right away — this is what triggers the
  // Auditor Remarks save path, which also makes the customer's name
  // turn green on the Google Sheet (see syncRemarksHighlight() on the
  // Apps Script side). Tapping it again when already marked UNDOES
  // it — the auto-added line is stripped back out and the remaining
  // remarks are saved as-is, so an accidental tap (or a tap made in
  // error) is never a one-way trip. Typed remarks are never touched
  // either way: only the exact auto-added line is added or removed.
  async function handleAlreadyPaid(){
    if (!state.selected || state.savingRemarks) return;
    var ta = document.getElementById('remarksInput');
    if (!ta) return;
    var current = ta.value || '';
    if (ALREADY_PAID_MARKER_RE.test(current)){
      // Undo: drop only the auto-added marker line(s), keep everything else.
      var lines = current.split('\n').filter(function(line){
        return !ALREADY_PAID_MARKER_RE.test(line);
      });
      ta.value = lines.join('\n').replace(/^\n+/, '');
    } else {
      // Uses the date picked in the little calendar next to this button
      // (defaults to today) rather than always assuming "right now", since
      // the auditor is often logging a payment that actually happened a
      // few days earlier.
      var pickedDate = state.alreadyPaidDate || todayISODate();
      var d = new Date(pickedDate + 'T00:00:00');
      var stamp = isNaN(d.getTime())
        ? new Date().toLocaleDateString('en-PH', { month:'long', day:'numeric', year:'numeric' })
        : d.toLocaleDateString('en-PH', { month:'long', day:'numeric', year:'numeric' });
      var line = 'Customer already made a payment on ' + stamp + '.';
      ta.value = current.trim() ? (line + '\n' + current) : line;
    }
    var b = currentBranch();
    if (b && state.selected) saveDraft(b.branch, state.selected._row, ta.value);
    await handleSaveRemarks();
  }

  async function handleFieldChange(field, newVal){
    var b = currentBranch();
    var row = state.selected._row;
    updateLocalField(b.branch, row, field, newVal);
    renderKeepScroll();
    if (field === 'Unit status' || field === 'Payment mode'){
      // Runs independently of the field save below (different backend
      // column, its own save/queue/error path) -- so the remarks line
      // updates right away instead of waiting on the field's network call.
      syncAutoFieldRemarkLine();
    }
    try{
      if (isOffline()){ throw Object.assign(new Error('offline'), { isNetworkError:true }); }
      await attemptRemoteSave(b.branch, row, field, newVal);
      unqueueWrite(b.branch, row, field);
      state.fieldMsg[field] = 'ok';
      state.online = true;
    }catch(e){
      if (e.isNetworkError){
        state.online = false;
        queueWrite(b.branch, row, field, newVal, field);
        state.fieldMsg[field] = 'queued';
      } else {
        state.fieldMsg[field] = 'err:' + e.message;
      }
    }
    renderKeepScroll();
    setTimeout(function(){ state.fieldMsg[field]=''; renderKeepScroll(); }, 3000);
  }

  // Date of Audit is a same-day thing: an auditor visits a whole branch
  // on one date, so picking that date for any one customer sets it for
  // EVERY customer on the currently active branch, and saves them all
  // to the Google Sheet in a single bulkUpdate request (the same fast
  // grouped-by-column path the Aging 1 import uses) instead of one
  // request per row. Falls back to per-row offline queuing (same as
  // handleFieldChange) so nothing is lost if the device is offline --
  // each row is queued individually and flushQueue() syncs them one at
  // a time once back online.
  async function handleAuditDateChangeAllCustomers(newVal){
    var field = 'Date of Audit';
    var b = currentBranch();
    if (!b || !b.rows.length) return;

    var rows = b.rows.slice();
    rows.forEach(function(r){ updateLocalField(b.branch, r._row, field, newVal); });
    renderKeepScroll();

    var updates = rows.map(function(r){ return { row: r._row, field: field, value: newVal }; });

    try{
      if (isOffline()){ throw Object.assign(new Error('offline'), { isNetworkError:true }); }
      var result = await attemptRemoteBulkSave(b.branch, updates);
      rows.forEach(function(r){ unqueueWrite(b.branch, r._row, field); });
      state.online = true;
      var rejectedList = (result && result.rejected) || [];
      if (rejectedList.length){
        // success:true from the backend, but it couldn't actually locate
        // the "Date of Audit" column on this tab -- nothing was written.
        state.fieldMsg[field] = 'err:Not saved — ' + rejectedList.join(', ');
        pushNotification('error', 'Date of Audit not saved — column not found', b.branch + ' • ' + rejectedList.join(', '), {
          branch: b.branch,
          status: 'failed',
          cause: 'The "' + b.branch + '" tab has column header text that doesn\u2019t match what the dashboard expects for Date of Audit.',
          solution: 'Add a "Date of Audit" column (or a similarly-named date column) on the "' + b.branch + '" tab, then pick the date again.'
        });
      } else {
        state.fieldMsg[field] = 'ok';
        pushNotification(
          'synced',
          'Date of Audit set for all customers',
          b.branch + ' • ' + newVal + ' saved for ' + rows.length + ' customer' + (rows.length === 1 ? '' : 's') + ' on this branch.',
          { branch: b.branch, status: 'resolved' }
        );
      }
    }catch(e){
      if (e.isNetworkError){
        state.online = false;
        rows.forEach(function(r){ queueWrite(b.branch, r._row, field, newVal, field); });
        state.fieldMsg[field] = 'queued';
        pushNotification(
          'offline',
          'Date of Audit saved offline — all customers',
          b.branch + ' • Will sync automatically for every customer once you\'re back online.',
          {
            branch: b.branch,
            status: 'retrying',
            cause: 'This device had no internet connection at the moment of saving, so the date could not reach the Google Sheet.',
            solution: 'Nothing to do — the change is safely stored on this device and will sync automatically the next time you\u2019re online.'
          }
        );
      } else {
        state.fieldMsg[field] = 'err:' + e.message;
        pushNotification('error', 'Could not save Date of Audit for all customers', b.branch + ' • ' + e.message, {
          branch: b.branch,
          status: 'failed',
          cause: 'The device is online and reached the Google Sheet backend, but it rejected the bulk save — usually because the "Date of Audit" column no longer exists on this tab, the sheet is locked/protected, or the request timed out. Details: ' + e.message,
          solution: 'Try picking the date again in a moment. If it keeps failing, check that the "' + b.branch + '" sheet tab still has (or can resolve to) a Date of Audit column.'
        });
      }
    }
    renderKeepScroll();
    setTimeout(function(){ state.fieldMsg[field]=''; renderKeepScroll(); }, 3000);
  }

  async function handleSaveUrl(){
    var v = (state.urlDraft || '').trim();
    if (!v){ state.urlSaveMsg = 'err:Please paste your Apps Script Web app URL.'; render(); return; }
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)){
      state.urlSaveMsg = 'err:That doesn\'t look like an Apps Script Web app URL. It should end in /exec.';
      render();
      return;
    }
    state.savingUrl = true; state.urlSaveMsg = ''; render();
    var previousUrl = state.url;
    state.url = v;
    try{
      await saveUrl(v);
      await fetchData();
      if (state.error){
        state.url = previousUrl;
        await saveUrl(previousUrl);
        state.urlSaveMsg = 'err:' + state.error;
        state.error = '';
      } else {
        state.urlSaveMsg = 'ok';
        state.savingUrl = false;
        render();
        setTimeout(function(){ state.settingsOpen = false; state.urlSaveMsg=''; render(); }, 900);
        return;
      }
    }catch(e){
      state.url = previousUrl;
      state.urlSaveMsg = 'err:' + e.message;
    }
    state.savingUrl = false;
    render();
  }

  // Saves (or clears, if left blank) the second Apps Script Web app URL
  // used only for Draft Report / Audit Sheet cloud storage. Unlike the
  // main Web app URL, this one is optional, so an empty value is valid
  // (it just means "stay on this device only") and isn't tested against
  // fetchData() -- that endpoint doesn't speak the branch-data protocol.
  async function handleSaveReportsUrl(){
    var v = (state.reportsUrlDraft || '').trim();
    if (v && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)){
      state.reportsUrlSaveMsg = 'err:That doesn\'t look like an Apps Script Web app URL. It should end in /exec.';
      render();
      return;
    }
    state.savingReportsUrl = true; state.reportsUrlSaveMsg = ''; render();
    try{
      await saveReportsUrl(v);
      state.reportsUrl = v;
      state.reportsUrlSaveMsg = 'ok';
    }catch(e){
      state.reportsUrlSaveMsg = 'err:' + e.message;
    }
    state.savingReportsUrl = false;
    render();
    if (state.reportsUrlSaveMsg === 'ok'){
      setTimeout(function(){ state.reportsUrlSaveMsg=''; render(); }, 1500);
    }
  }

  // ---- Reports backend sync helpers (best-effort, never blocks the UI) ----
  // Pushing a save never throws into the caller -- a Draft Report / Audit
  // Sheet edit must still save locally (lsSet) even if the cloud copy is
  // unreachable; the next successful pull/push reconciles it.
  //
  // FIX: this used to swallow a failed push completely (offline, weak
  // mobile signal, a slow/cold reports backend, etc.) with nothing
  // retrying it afterwards -- the form stayed safe on THIS device, but
  // never made it to Google Sheets unless the auditor happened to type
  // another character (triggering a fresh autosave) while actually
  // online again. A failed push is now queued (see queueReportsWrite /
  // flushReportsQueue above), the same "keep retrying automatically
  // until it goes through" treatment Auditor Remarks already had.
  async function pushDraftReportToCloud(branch, form){
    if (!state.reportsUrl || !branch) return;
    try{
      await attemptRemoteReportsSave('saveDraftReport', branch, form);
      unqueueReportsWrite('saveDraftReport', branch);
    }catch(e){
      queueReportsWrite('saveDraftReport', branch, form);
    }
  }
  async function pushAuditSheetToCloud(branch, form){
    if (!state.reportsUrl || !branch) return;
    try{
      await attemptRemoteReportsSave('saveAuditSheet', branch, form);
      unqueueReportsWrite('saveAuditSheet', branch);
    }catch(e){
      queueReportsWrite('saveAuditSheet', branch, form);
    }
  }

  // ---- Explicit "Save to Google Sheets" button handlers ----
  // pushDraftReportToCloud/pushAuditSheetToCloud above fire silently on
  // every keystroke and swallow errors on purpose (the form must still
  // save locally even if the cloud is unreachable). These two, in
  // contrast, are wired to the visible "Save to Google Sheets" button:
  // they show a spinner while the request is in flight and report back
  // whether it actually reached the sheet, so the auditor isn't left
  // guessing.
  async function handleSaveReportToSheet(){
    if (!state.reportForm || !state.reportForm.branch) return;
    var branch = state.reportForm.branch;
    if (!state.reportsUrl){
      state.reportCloudMsg = 'err:No reports backend connected yet. Open the menu (\u2699) > Connection settings and paste the Reports backend URL first.';
      showToast('error', 'Reports backend isn\u2019t connected yet.');
      render();
      return;
    }
    state.reportCloudBusy = true; state.reportCloudMsg = ''; render();
    try{
      await attemptRemoteReportsSave('saveDraftReport', branch, state.reportForm, 20000);
      unqueueReportsWrite('saveDraftReport', branch); // this manual save supersedes any stale queued autosave
      state.reportCloudMsg = 'ok';
      showToast('success', 'Draft Report saved to Google Sheets.');
      pushNotification('success', 'Draft Report saved \u2014 ' + branch, 'Saved to Google Sheets just now.', { status: 'success' });
    }catch(e){
      if (e.isNetworkError){
        // Couldn't reach the backend right now (offline, weak mobile
        // signal, a slow/cold deployment, etc.) -- queue this exact
        // snapshot so it still goes out automatically once the
        // connection recovers, instead of only ever retrying if the
        // auditor happens to tap this button again themselves.
        queueReportsWrite('saveDraftReport', branch, state.reportForm);
        state.reportCloudMsg = 'err:Couldn\u2019t reach Google Sheets right now \u2014 queued, and will sync automatically once you\u2019re back online.';
        showToast('error', 'Queued \u2014 will sync automatically once online.');
      } else {
        state.reportCloudMsg = 'err:' + e.message;
        showToast('error', 'Could not save the Draft Report.');
        pushNotification('error', 'Could not save Draft Report \u2014 ' + branch, e.message, { status: 'failed' });
      }
    }
    state.reportCloudBusy = false;
    render();
    if (state.reportCloudMsg === 'ok'){
      setTimeout(function(){ if (state.reportCloudMsg === 'ok'){ state.reportCloudMsg = ''; render(); } }, 2500);
    }
  }
  async function handleSaveAuditSheetToSheet(){
    if (!state.auditSheetForm || !state.auditSheetForm.branch) return;
    var branch = state.auditSheetForm.branch;
    if (!state.reportsUrl){
      state.auditSheetCloudMsg = 'err:No reports backend connected yet. Open the menu (\u2699) > Connection settings and paste the Reports backend URL first.';
      showToast('error', 'Reports backend isn\u2019t connected yet.');
      render();
      return;
    }
    state.auditSheetCloudBusy = true; state.auditSheetCloudMsg = ''; render();
    try{
      await attemptRemoteReportsSave('saveAuditSheet', branch, state.auditSheetForm, 20000);
      unqueueReportsWrite('saveAuditSheet', branch); // this manual save supersedes any stale queued autosave
      state.auditSheetCloudMsg = 'ok';
      showToast('success', 'Audit Sheet saved to Google Sheets.');
      pushNotification('success', 'Audit Sheet saved \u2014 ' + branch, 'Saved to Google Sheets just now.', { status: 'success' });
    }catch(e){
      if (e.isNetworkError){
        queueReportsWrite('saveAuditSheet', branch, state.auditSheetForm);
        state.auditSheetCloudMsg = 'err:Couldn\u2019t reach Google Sheets right now \u2014 queued, and will sync automatically once you\u2019re back online.';
        showToast('error', 'Queued \u2014 will sync automatically once online.');
      } else {
        state.auditSheetCloudMsg = 'err:' + e.message;
        showToast('error', 'Could not save the Audit Sheet.');

    }

  // Pulls the latest saved copy for one branch from the reports backend.
  // Returns null on any failure (offline, not configured, nothing saved
  // yet for this branch) so the caller just keeps the localStorage copy.
  async function pullReportsFormFromCloud(type, branch){
    if (!state.reportsUrl || !branch) return null;
    try{
      var sep = state.reportsUrl.indexOf('?') === -1 ? '?' : '&';
      var url = state.reportsUrl + sep + 'action=' + encodeURIComponent(type) +
        '&branch=' + encodeURIComponent(branch) + '&_ts=' + Date.now();
      var res = await fetchWithTimeout(url, { method: 'GET' }, 15000);
      var data = await res.json();
      if (data && data.success && data.form) return data.form;
    }catch(e){ /* best-effort */ }
    return null;
  }
  // Refreshes an already-open Draft Report from the cloud copy (if any and
  // if newer-looking), re-rendering only if something actually changed.
  // Called right after openReportModal() so the modal opens instantly from
  // localStorage/template and then quietly catches up to the cloud.
  async function refreshReportFormFromCloud(branch){
    var cloudForm = await pullReportsFormFromCloud('loadDraftReport', branch);
    if (!cloudForm) return;
    if (!state.reportForm || state.reportForm.branch !== branch) return; // modal moved on
    cloudForm.branch = branch;
    state.reportForm = cloudForm;
    lsSet(reportKey(branch), JSON.stringify(cloudForm));
    render();
  }
  async function refreshAuditSheetFormFromCloud(branch){
    var cloudForm = await pullReportsFormFromCloud('loadAuditSheet', branch);
    if (!cloudForm) return;
    if (!state.auditSheetForm || state.auditSheetForm.branch !== branch) return; // modal moved on
    cloudForm.branch = branch;
    state.auditSheetForm = cloudForm;
    lsSet(auditSheetKey(branch), JSON.stringify(cloudForm));
    render();
  }

  function currentBranch(){
    return state.branches.find(function(b){ return b.branch === state.activeBranch; });
  }

  // Extracts the surname from a customer name so we can match on it
  // specifically (e.g. typing "A" shows everyone whose surname starts with A).
  // Supports "Surname, Firstname" format (comma) and falls back to the
  // first word of the name when there's no comma.
  function getSurname(fullName){
    var n = String(fullName || '').trim();
    if (!n) return '';
    if (n.indexOf(',') > -1){
      return n.split(',')[0].trim();
    }
    var parts = n.split(/\s+/);
    return parts[0] || '';
  }

  function filteredRows(){
    var b = currentBranch();
    if (!b) return [];
    var q = state.search.trim().toLowerCase();
    var rows = b.rows;
    if (q){
      rows = rows.filter(function(r){
        var rawName = String(r['Customer Name'] || '');
        var name = rawName.toLowerCase();
        var surname = getSurname(rawName).toLowerCase();
        var model = String(r['Model'] || '').toLowerCase();
        var engine = String(r['Engine No'] || '').toLowerCase();
        // A single letter means "show me everyone whose surname starts
        // with this letter" — keep it strict, don't also match model/engine.
        if (q.length === 1){
          return surname.indexOf(q) === 0;
        }
        return surname.indexOf(q) === 0 || name.indexOf(q) > -1 || model.indexOf(q) > -1 || engine.indexOf(q) > -1;
      });
    }
    if (state.statusFilter){
      if (state.statusFilter === '__blank__'){
        rows = rows.filter(function(r){ return !r['Customer Status']; });
      } else {
        rows = rows.filter(function(r){ return (r['Customer Status'] || '') === state.statusFilter; });
      }
    } else {
      // Landing view (no status explicitly picked): only BNEW/REPO/RSTR -
      // OD/DEL rows, so the table renders faster. Selecting any specific
      // status (an ADV/CU one, or "— Unclassified —") from the dropdown or
      // a pill sets state.statusFilter and takes the branch above instead.
      rows = rows.filter(function(r){
        var status = String(r['Customer Status'] || '').replace(/\s+/g, ' ').trim().toUpperCase();
        return LANDING_DEFAULT_CATEGORIES.indexOf(status) !== -1;
      });
    }
    return rows;
  }

  function branchStatusOptions(b){
    var seen = {};
    var out = [];
    var fromDropdown = (b && b.dropdowns && b.dropdowns['Customer Status']) || [];
    fromDropdown.forEach(function(o){ if (o && !seen[o]){ seen[o]=1; out.push(o); } });
    (b ? b.rows : []).forEach(function(r){
      var v = r['Customer Status'];
      if (v && !seen[v]){ seen[v]=1; out.push(v); }
    });
    return out;
  }

  // Counts how many customers fall under each Customer Status value
  // (e.g. BN- OD, BN-DEL, REPO- OD...) for the currently selected branch,
  // so the totals can be shown at the top of the dashboard, distinct from
  // the overall "Customers" / "Current results" metrics.
  function branchStatusCounts(b){
    var counts = {};
    var order = [];
    var blank = 0;
    (b ? b.rows : []).forEach(function(r){
      var v = r['Customer Status'];
      if (!v){ blank++; return; }
      if (!counts[v]){ counts[v] = 0; order.push(v); }
      counts[v]++;
    });
    var out = order.map(function(v){ return { status: v, count: counts[v] }; });
    if (blank) out.push({ status: '__blank__', count: blank });
    return out;
  }

  function render(){
    var app = document.getElementById('app');

    // Every render() call below rebuilds #app's entire innerHTML from
    // scratch, which would normally reset the scroll position of any
    // scrollable panel inside it (e.g. the Draft Report / Audit Sheet
    // modal body) back to the top on every single click or keystroke.
    // Snapshot whatever's currently scrolled before the rebuild, then
    // restore it once the new DOM is back in place (after bindEvents()
    // below) so editing a modal no longer yanks the view back up.
    var savedScrollPositions = {};
    if (app){
      app.querySelectorAll('.settings-overlay.open .sm-body').forEach(function(el){

        if (overlay && overlay.id) savedScrollPositions[overlay.id] = el.scrollTop;

  function fmtNotifTime(iso){
    try{
      var d = new Date(iso);
      var diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diffSec < 5) return 'just now';
      if (diffSec < 60) return diffSec + 's ago';
      var diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return diffMin + 'm ago';
      var diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + 'h ago';
      return d.toLocaleDateString('en-PH', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }catch(e){ return ''; }
  }

      return '<div class="notif-item' + (n.read ? '' : ' unread') + (clickable ? ' clickable' : '') + (hasDetails ? ' has-details' : '') + '"' +
