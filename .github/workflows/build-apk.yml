name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash from resources/
        run: |
          if [ -f resources/icon-only.png ]; then
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android --assetPath resources
          else
            echo "No resources/icon-only.png - using default icon"
          fi

      - name: Copy web files into Android project
        run: npx cap sync android

      - name: Use the fixed signing key
        run: python3 scripts/patch-gradle.py

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AuditedAccounts.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AuditedAccounts-APK
          path: AuditedAccounts.apk

      - name: Publish to Releases (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AuditedAccounts.apk
